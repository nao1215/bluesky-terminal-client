version: 2
# Each entry opens at most one version-update PR a month: the group takes every
# dependency of that ecosystem and directory. The groups cover version updates
# only (applies-to: version-updates): security updates are not grouped and do
# not follow the monthly schedule, so each opens its own PR when Dependabot
# raises an alert.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
        # unicode-width 0.2.3 changes the width of some characters and breaks
        # the layout, so it stays out of the group and is reviewed on its own.
        exclude-patterns:
          - "unicode-width"
  # The fuzz crate is its own workspace with its own Cargo.lock.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
    groups:
      cargo-fuzz:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
