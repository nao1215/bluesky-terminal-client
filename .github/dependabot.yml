version: 2
# Each entry opens at most one version-update PR a month: the group takes every
# dependency of that ecosystem. The groups cover version updates only
# (applies-to: version-updates): security updates are not grouped and do not
# follow the monthly schedule, so each opens its own PR when Dependabot raises
# an alert.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
