name: Live compatibility
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-compat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gotosocial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: nao1215/setup-atago@e573acee4be10bbfc6089f3319cb406918d566fa # v0.1.6
        with:
          version: v0.27.1
          verify-attestation: 'true'
      - name: Check media generator
        run: ffmpeg -version
      - name: Run disposable GoToSocial catalog
        run: scripts/compat/gotosocial.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: gotosocial-compatibility
          path: target/compat/gotosocial/*.json
          if-no-files-found: ignore
