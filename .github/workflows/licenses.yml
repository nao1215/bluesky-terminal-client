name: licenses

# Dependency license gate. Every crate compiled into msky, on every target in
# release-targets.json, must carry a license in deny.toml's allow list
# (cargo deny), and cargo-about must be able to write its license text into the
# THIRD_PARTY_LICENSES file that release.yml attaches to each release. Without
# the second step a crate whose text cargo-about cannot find would pass review
# and stop the release at the tag.
#
# There is no schedule: Cargo.lock pins every version, so the verdict only
# changes when a pull request changes the dependencies or the license
# configuration. The advisory check, which does change without a commit, stays
# in cargo-deny.yml.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "about.toml"
      - "about.hbs"
      - ".github/workflows/licenses.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "about.toml"
      - "about.hbs"
      - ".github/workflows/licenses.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # Pinned so a new release of either tool cannot change the verdict on its
      # own. The versions match cargo-deny.yml and release.yml.
      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Check the dependency licenses
        run: cargo deny --locked --all-features check --hide-inclusion-graph licenses

      - name: Write the third-party licenses the release ships
        run: |
          cargo about generate --locked --fail about.hbs -o THIRD_PARTY_LICENSES.html
          test -s THIRD_PARTY_LICENSES.html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 7
