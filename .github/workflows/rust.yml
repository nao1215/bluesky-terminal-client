name: Build/Test/Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/release/**"
      - ".github/release-targets.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/release/**"
      - ".github/release-targets.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Every other job installs `stable`, so nothing else would notice a dependency
  # that starts needing a compiler newer than the `rust-version` the manifest
  # declares. The toolchain is read from the manifest so raising it stays one edit.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check with the declared minimum toolchain
        run: cargo check --locked --all-targets

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The release scripts run only on a tag, so they are tested here on every
  # platform that packs an archive, and the compiler the release pins is
  # checked against rust-version, before a release depends on them.
  release-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the release scripts
        shell: bash
        run: ./scripts/release/test.sh

      - name: Check the release toolchain pin against rust-version
        if: runner.os == 'Linux'
        run: |
          pin="$(grep -oP '^\s*RUST_TOOLCHAIN:\s*"\K[^"]+' .github/workflows/release.yml)"
          msrv="$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)"
          lowest="$(printf '%s\n%s\n' "${msrv}" "${pin}" | sort -V | head -1)"
          if ! [[ "${pin}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || [ "${lowest}" != "${msrv}" ]; then
            echo "::error title=Release toolchain::release.yml pins '${pin}', which must be an explicit version at or above rust-version ${msrv}"
            exit 1
          fi
          echo "release toolchain ${pin}, rust-version ${msrv}"
