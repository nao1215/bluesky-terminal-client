name: Build/Test/Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/release/**"
      - ".github/release-targets.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
      - "fuzz/**"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/release/**"
      - ".github/release-targets.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
      - "fuzz/**"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo test --locked --all-targets

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Every other job installs `stable`, so nothing else would notice a dependency
  # that starts needing a compiler newer than the `rust-version` the manifest
  # declares. The toolchain is read from the manifest so raising it stays one edit.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check with the declared minimum toolchain
        run: cargo check --locked --all-targets

  # The release scripts run only on a tag, so they are tested here on every
  # platform that packs an archive, and the compiler the release pins is
  # checked against rust-version, before a release depends on them.
  release-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the release scripts
        shell: bash
        run: ./scripts/release/test.sh

      - name: Check the release toolchain pin against rust-version
        if: runner.os == 'Linux'
        run: |
          pin="$(grep -oP '^\s*RUST_TOOLCHAIN:\s*"\K[^"]+' .github/workflows/release.yml)"
          msrv="$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)"
          lowest="$(printf '%s\n%s\n' "${msrv}" "${pin}" | sort -V | head -1)"
          if ! [[ "${pin}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || [ "${lowest}" != "${msrv}" ]; then
            echo "::error title=Release toolchain::release.yml pins '${pin}', which must be an explicit version at or above rust-version ${msrv}"
            exit 1
          fi
          echo "release toolchain ${pin}, rust-version ${msrv}"

  # The fuzz targets include src/hls.rs and src/api/facets.rs by path, so a
  # change there can break a build that only fuzz.yml runs, at night. When they
  # or fuzz/ change, build the targets and run each over its committed seeds
  # (no exploration; that stays in fuzz.yml). Other changes skip the nightly
  # toolchain and cargo-fuzz.
  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whether the fuzzed code changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${EVENT}" = workflow_dispatch ] || [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}"; then
            run=true
          elif git diff --quiet "${BASE}" HEAD -- src/hls.rs src/api/facets.rs src/api/tlds.txt fuzz/; then
            run=false
          else
            run=true
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Install Rust nightly
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-fuzz@0.13.2

      # The target is explicit: cargo-fuzz from install-action is a musl binary
      # and would build for musl, which AddressSanitizer does not support.
      - name: Build the fuzz targets and run their seeds
        if: steps.changed.outputs.run == 'true'
        run: |
          cargo fuzz build --target x86_64-unknown-linux-gnu
          for target in $(cargo fuzz list); do
            cargo fuzz run --target x86_64-unknown-linux-gnu "${target}" -- -runs=0
          done
