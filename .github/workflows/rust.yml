name: Build/Test/Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/release/**"
      - ".github/release-targets.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-msky.yml"
      - ".github/workflows/release-mstdn.yml"
      - ".github/workflows/release-nstr.yml"
      - ".github/workflows/rust.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --locked --workspace --all-targets

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Every other job installs `stable`, so nothing else would notice a dependency
  # that starts needing a compiler newer than the `rust-version` the packages
  # declare. The toolchain is the highest rust-version of crates/*/Cargo.toml,
  # read from the manifests so raising it stays one edit per package.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-version from the packages' Cargo.toml
        id: msrv
        run: |
          set -o pipefail
          version="$(grep -ohP '^rust-version\s*=\s*"\K[^"]+' crates/*/Cargo.toml | sort -V | tail -n 1)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check with the declared minimum toolchain
        run: cargo check --locked --workspace --all-targets

  # The release scripts run only on a tag, so they are tested here on every
  # platform that packs an archive, and the compiler the release pins is
  # checked against rust-version, before a release depends on them.
  release-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the release scripts
        shell: bash
        run: ./scripts/release/test.sh

      - name: Check the release toolchain pins against rust-version
        if: runner.os == 'Linux'
        run: |
          check() {
            local workflow="$1" manifest="$2" pin msrv lowest
            pin="$(grep -oP '^\s*RUST_TOOLCHAIN:\s*"\K[^"]+' "${workflow}")"
            msrv="$(grep -oP '^rust-version\s*=\s*"\K[^"]+' "${manifest}")"
            lowest="$(printf '%s\n%s\n' "${msrv}" "${pin}" | sort -V | head -1)"
            if ! [[ "${pin}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || [ "${lowest}" != "${msrv}" ]; then
              echo "::error title=Release toolchain::${workflow} pins '${pin}', which must be an explicit version at or above rust-version ${msrv} of ${manifest}"
              exit 1
            fi
            echo "${workflow}: release toolchain ${pin}, rust-version ${msrv}"
          }
          check .github/workflows/release.yml crates/bluesky-terminal-client/Cargo.toml
          check .github/workflows/release-msky.yml crates/misskey-terminal-client/Cargo.toml
          check .github/workflows/release-mstdn.yml crates/mastodon-terminal-client/Cargo.toml
          check .github/workflows/release-nstr.yml crates/nostr-terminal-client/Cargo.toml

  # The fuzz targets include source files by path: bsky's
  # (crates/bluesky-terminal-client/fuzz/) take its src/hls.rs,
  # src/api/facets.rs and src/og.rs, and msky's
  # (crates/misskey-terminal-client/fuzz/) its src/mfm.rs, src/metadata.rs,
  # src/error.rs, src/tui/mp4.rs and src/api/types.rs, and mstdn's
  # (crates/mastodon-terminal-client/fuzz/) its src/html.rs and
  # src/api/types.rs. A change there can
  # break a build that only fuzz.yml runs, at night. When they or the fuzz
  # directory change, build the targets and run each over its committed
  # seeds (no exploration; that stays in fuzz.yml). Other changes skip the
  # nightly toolchain and cargo-fuzz.
  fuzz-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: bsky
            dir: crates/bluesky-terminal-client/fuzz
            watched: >-
              crates/bluesky-terminal-client/src/hls.rs
              crates/bluesky-terminal-client/src/api/facets.rs
              crates/bluesky-terminal-client/src/api/tlds.txt
              crates/bluesky-terminal-client/src/og.rs
              crates/bluesky-terminal-client/fuzz/
          - client: msky
            dir: crates/misskey-terminal-client/fuzz
            watched: >-
              crates/misskey-terminal-client/src/mfm.rs
              crates/misskey-terminal-client/src/metadata.rs
              crates/misskey-terminal-client/src/metadata/
              crates/misskey-terminal-client/src/error.rs
              crates/misskey-terminal-client/src/tui/mp4.rs
              crates/misskey-terminal-client/src/api/types.rs
              crates/misskey-terminal-client/fuzz/
          - client: mstdn
            dir: crates/mastodon-terminal-client/fuzz
            watched: >-
              crates/mastodon-terminal-client/src/html.rs
              crates/mastodon-terminal-client/src/api/types.rs
              crates/mastodon-terminal-client/fuzz/
    name: fuzz-build (${{ matrix.client }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whether the fuzzed code changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          WATCHED: ${{ matrix.watched }}
        run: |
          # shellcheck disable=SC2086
          if [ "${EVENT}" = workflow_dispatch ] || [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}"; then
            run=true
          elif git diff --quiet "${BASE}" HEAD -- ${WATCHED}; then
            run=false
          else
            run=true
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Install Rust nightly
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@0.13.2

      # The target is explicit: cargo-fuzz from install-action is a musl binary
      # and would build for musl, which AddressSanitizer does not support.
      - name: Build the fuzz targets and run their seeds
        if: steps.changed.outputs.run == 'true'
        env:
          FUZZ_DIR: ${{ matrix.dir }}
        run: |
          cargo fuzz build --fuzz-dir "${FUZZ_DIR}" --target x86_64-unknown-linux-gnu
          for target in $(cargo fuzz list --fuzz-dir "${FUZZ_DIR}"); do
            cargo fuzz run --fuzz-dir "${FUZZ_DIR}" --target x86_64-unknown-linux-gnu "${target}" -- -runs=0
          done
