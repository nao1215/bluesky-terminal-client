name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/coverage.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".octocov.yml"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/coverage.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".octocov.yml"
      - ".github/workflows/coverage.yml"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# octocov reads and writes its report in the Actions-artifact datastore and
# comments on pull requests; the default token is read-only, so those scopes
# are granted here. The central repository (nao1215/octocovs-central-repo)
# collects the report from the artifact and draws the README badge.
permissions:
  contents: read
  actions: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The same pinned atago as e2e.yml; see the comment there.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install atago
        env:
          ATAGO_REF: a49bce64aa19345e4a62f05d8c233823b84681c0
        run: |
          go install "github.com/nao1215/atago@${ATAGO_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Measure unit + E2E coverage
        run: ./scripts/coverage.sh lcov.info

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .octocov.yml
