name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/coverage.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".octocov.yml"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/coverage.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".octocov.yml"
      - ".github/workflows/coverage.yml"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# octocov reads and writes its report in the Actions-artifact datastore and
# comments on pull requests; the default token is read-only, so those scopes
# are granted here. The central repository (nao1215/octocovs-central-repo)
# collects the report from the artifact and draws the README badge.
permissions:
  contents: read
  actions: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov

      # The same atago as e2e.yml.
      - name: Install atago
        uses: nao1215/setup-atago@7cae89595fcbba334db0fe16fc9a24ed5b0a3fea # v0.1.2
        with:
          version: v0.24.0
          verify-attestation: "true"

      - name: Measure unit + E2E coverage
        run: ./scripts/coverage.sh lcov.info

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .octocov.yml
