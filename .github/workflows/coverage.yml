name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/coverage.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".octocov.yml"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/coverage.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".octocov.yml"
      - ".github/workflows/coverage.yml"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # octocov reads and writes its report in the Actions-artifact datastore and
    # comments on pull requests, so this job alone gets those scopes. The
    # central repository (nao1215/octocovs-central-repo) collects the report
    # from the artifact and draws the README badge.
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1

      # The same atago as e2e.yml.
      - name: Install atago
        uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3
        with:
          version: v0.25.2
          verify-attestation: "true"

      - name: Measure unit + E2E coverage
        run: ./scripts/coverage.sh lcov.info

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .octocov.yml
