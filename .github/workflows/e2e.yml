name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The suite drives bsky in a pseudo-terminal that answers like a
  # kitty-graphics terminal: a pty on Linux and macOS, a ConPTY on Windows.
  # On Windows atago runs `graphics: kitty` steps under the OpenConsole it
  # ships, which passes kitty graphics through (nao1215/atago#676).
  atago:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The suite needs `pty.graphics`, `screen.images` and the mock `query:`
      # matcher, which no atago release carries yet, so atago is built from a
      # pinned commit of its main branch. Switch back to nao1215/setup-atago
      # with the first release that includes them.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install atago
        shell: bash
        env:
          ATAGO_REF: a49bce64aa19345e4a62f05d8c233823b84681c0
        run: |
          go install "github.com/nao1215/atago@${ATAGO_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run atago E2E tests
        shell: bash
        run: ./e2e/run.sh
