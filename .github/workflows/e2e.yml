name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each client has its own suite. bsky's drives it in a pseudo-terminal that
  # answers like a kitty-graphics terminal: a pty on Linux and macOS, a
  # ConPTY on Windows. On Windows atago runs `graphics: kitty` steps under
  # the OpenConsole it ships, which passes kitty graphics through
  # (nao1215/atago#676). msky's and mstdn's run them against atago mock
  # servers of the Misskey and the Mastodon API. nstr's runs it against a
  # Nostr relay stand-in on 127.0.0.1 (a python3 script in its testdata).
  # None needs a network or an account.
  atago:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        client: [bsky, msky, mstdn, nstr]
        include:
          - client: bsky
            run: ./crates/bluesky-terminal-client/e2e/run.sh
          - client: msky
            run: ./crates/misskey-terminal-client/e2e/run.sh
          - client: mstdn
            run: ./crates/mastodon-terminal-client/e2e/run.sh
          - client: nstr
            run: ./crates/nostr-terminal-client/e2e/run.sh
    name: atago (${{ matrix.client }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.client }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A released atago, checked against its checksums and its build
      # provenance before it runs.
      - name: Install atago
        uses: nao1215/setup-atago@e573acee4be10bbfc6089f3319cb406918d566fa # v0.1.6
        with:
          version: v0.27.0
          verify-attestation: "true"

      - name: Run atago E2E tests
        shell: bash
        env:
          RUN: ${{ matrix.run }}
        run: '"${RUN}"'
