name: Nightly properties

# The property and metamorphic tests run on every pull request with proptest's
# default of 256 cases each, and the state-transition test with 12 seeds, as
# part of `cargo test`. This workflow runs the same tests each night with many
# more cases, in release mode so a case costs little. msky's properties
# (crates/misskey-terminal-client/src/properties.rs) get a step of their own
# with the case count they have always run with.
#
# proptest draws a fresh seed every run and prints the minimal failing input
# when a property breaks; the state-transition test prints the seed and step.
# Turn that input into a plain unit test beside the property, then fix it on a
# fix/* branch. Never lower the case count to make this green.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property
        default: "20000"
      seeds:
        description: Seeds of the state-transition test
        default: "2000"
      msky-cases:
        description: Cases per property of msky
        default: "500000"
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Properties and metamorphic relations
        env:
          PROPTEST_CASES: ${{ inputs.cases || '20000' }}
        run: cargo test --locked --release --workspace --exclude misskey-terminal-client --exclude nostr-terminal-client --lib --bins properties

      - name: msky's properties
        env:
          PROPTEST_CASES: ${{ inputs.msky-cases || '500000' }}
        run: cargo test --locked --release -p misskey-terminal-client --bin msky properties

      # nstr's generated tests live beside the protocol unit tests and do not
      # have "properties" in their names, so run its bin tests without a filter.
      - name: nstr's properties and protocol tests
        env:
          PROPTEST_CASES: ${{ inputs.cases || '20000' }}
        run: cargo test --locked --release -p nostr-terminal-client --bin nstr

      - name: Random keys and late answers
        env:
          BSKY_FUZZ_SEEDS: ${{ inputs.seeds || '2000' }}
        run: cargo test --locked --release -p bluesky-terminal-client --bins random_keys_and_late_answers_keep_the_client_sound

      # A failing case of msky's, mstdn's or nstr's is written under its crate; the
      # smallest input goes into a unit test beside the code it breaks.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: proptest-regressions
          path: |
            crates/misskey-terminal-client/proptest-regressions
            crates/mastodon-terminal-client/proptest-regressions
            crates/nostr-terminal-client/proptest-regressions
          if-no-files-found: ignore
