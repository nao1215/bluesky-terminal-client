name: Benchmark

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each client is measured end to end with its bench/himorime.yaml,
# in one job each.
#
# On a pull request, `himorime ci` checks the base of the pull request out
# into a temporary worktree, builds it and the head, and measures both in
# interleaved rounds on this runner, so a noisy neighbour slows both
# revisions instead of one. The job fails when the head is slower, uses
# more CPU time or more memory than the base beyond the tolerance of the
# suite with 95% confidence; a difference too close to call is
# inconclusive and does not fail it. The comparison is written to the job
# summary.
#
# Started by hand, or when the base of a pull request has no such suite yet,
# the job measures the ref it runs on without comparing.
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: bsky
            suite: crates/bluesky-terminal-client/bench
          - client: msky
            suite: crates/misskey-terminal-client/bench
          - client: mstdn
            suite: crates/mastodon-terminal-client/bench
          - client: nstr
            suite: crates/nostr-terminal-client/bench
    name: bench (${{ matrix.client }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # setup-himorime comments the comparison on a pull request from this
    # repository.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit must exist locally for the temporary worktree.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: nao1215/setup-himorime@05b4d293796e34a46c59f1363e15841a18e83e92 # v0.2.1
        with:
          version: v0.6.1
      - uses: nao1215/setup-atago@e573acee4be10bbfc6089f3319cb406918d566fa # v0.1.6
        if: matrix.client == 'mstdn'
        with:
          version: v0.28.0
      - name: Tell whether the base has the suite
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUITE: ${{ matrix.suite }}
        run: |
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}:${SUITE}/himorime.yaml"; then
            echo "compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "compare=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare the base with the head
        if: github.event_name == 'pull_request' && steps.base.outputs.compare == 'true'
        env:
          SUITE: ${{ matrix.suite }}
        run: himorime ci --output "$RUNNER_TEMP/himorime.json" --format json "${SUITE}"
      - name: Measure
        if: github.event_name != 'pull_request' || steps.base.outputs.compare != 'true'
        env:
          SUITE: ${{ matrix.suite }}
        run: himorime run --output "$RUNNER_TEMP/himorime.json" --format json --summary "$GITHUB_STEP_SUMMARY" "${SUITE}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: himorime-report-${{ matrix.client }}
          path: ${{ runner.temp }}/himorime.json
          retention-days: 7
