name: Fuzz

# Explores the fuzz targets (cargo-fuzz, libFuzzer) for a few minutes each
# night: bsky's in crates/bluesky-terminal-client/fuzz/ and msky's in
# crates/misskey-terminal-client/fuzz/.
# Pull requests do not explore: rust.yml builds the targets and runs each over
# its seed corpus in <fuzz dir>/corpus/<target>/ when the code they test
# changes.
#
# A crash uploads its input as an artifact. Commit that input to
# <fuzz dir>/corpus/<target>/ and to a unit test, then fix it on a fix/* branch.
# Never delete corpus entries to make this green.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every [[bin]] in a fuzz directory's Cargo.toml is a target, so adding
      # one needs no edit here.
      - id: list
        run: |
          set -o pipefail
          list="$(for dir in crates/bluesky-terminal-client/fuzz crates/misskey-terminal-client/fuzz; do
            grep -A1 '^\[\[bin\]\]' "${dir}/Cargo.toml" | sed -n 's/^name *= *"\(.*\)"/\1/p' | jq -R --arg dir "${dir}" '{dir: $dir, target: .}'
          done | jq -cs .)"
          test "$list" != "[]"
          echo "list=${list}" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-fuzz needs nightly (-Z sanitizer). Only the fuzz jobs use it; every
      # other job stays on stable and the MSRV.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz@0.13.2

      - name: cargo fuzz run ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
          TARGET: ${{ matrix.target }}
          FUZZ_DIR: ${{ matrix.dir }}
        # cargo-fuzz from install-action is a musl binary and would default to
        # building for musl, which AddressSanitizer does not support.
        run: cargo fuzz run --fuzz-dir "${FUZZ_DIR}" --target x86_64-unknown-linux-gnu "${TARGET}" -- -max_total_time="${SECONDS_PER_TARGET}"

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts/${{ matrix.target }}/
          retention-days: 30
