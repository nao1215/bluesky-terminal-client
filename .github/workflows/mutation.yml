name: Mutation

# Mutation testing rewrites one operator, constant or return value at a time and
# checks that a unit test fails. Every mutant rebuilds the crate and reruns the
# unit tests, so the whole set (about 1550 mutants in the files
# `.cargo/mutants.toml` names) runs weekly in shards, and a pull request mutates
# only the lines it changes.
#
# The gate is the score recorded below in MUTATION_MIN_SCORE, not 100%: some
# mutants are equivalent to the original and no test can tell them apart. A
# score that drops below the recorded one means a change made the tests weaker,
# or added code they do not check. Read the missed mutants in the job summary,
# add the test that catches them, and raise the recorded score when it goes up.

on:
  schedule:
    - cron: "0 19 * * 6"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/mutants.toml"
      - "scripts/mutation_score.py"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  # The score of the last full run (cargo mutants over every file
  # .cargo/mutants.toml names). Raise it when the score goes up.
  MUTATION_MIN_SCORE: "77"
  # A mutant that allocates without end would take the runner down with it,
  # leaving no log; the limit turns it into a failed test instead. Two
  # mutants run at once on a 16 GB runner, so each gets 4 GiB. The limit is
  # on address space, not memory used, and glibc reserves 64 MiB of it for
  # every thread's malloc arena: the view tests start picture threads for
  # every render, and passed under 2 GiB only with two arenas. A cap of
  # 16 GiB let one mutant of the first full run take its runner down.
  MUTANT_MEMORY_KIB: "4194304"
  MALLOC_ARENA_MAX: "2"
  RUST_TEST_THREADS: "4"

jobs:
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants@27.1.0

      - name: Mutate the lines this pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "${BASE_SHA}...HEAD" -- src > pr.diff
          ulimit -v "${MUTANT_MEMORY_KIB}"
          status=0
          cargo mutants --in-diff pr.diff --no-shuffle -j 2 || status=$?
          # 0: every mutant caught, 2: some missed, 3: some timed out. The score
          # below decides; anything else is a failure of the run itself.
          case "${status}" in
            0|2|3) ;;
            *) exit "${status}" ;;
          esac

      - name: Check the score
        if: hashFiles('mutants.out/outcomes.json') != ''
        run: python3 scripts/mutation_score.py mutants.out --min "${MUTATION_MIN_SCORE}" --summary "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-diff
          path: mutants.out
          if-no-files-found: ignore

  shard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Four at a time: the account shares twenty concurrent jobs across every
      # repository, and the weekly run has all night.
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants@27.1.0

      - name: Mutate shard ${{ matrix.shard }} of 8
        run: |
          ulimit -v "${MUTANT_MEMORY_KIB}"
          status=0
          cargo mutants --shard "${{ matrix.shard }}/8" --no-shuffle -j 2 || status=$?
          case "${status}" in
            0|2|3) ;;
            *) exit "${status}" ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  score:
    if: github.event_name != 'pull_request' && !cancelled()
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Check the score over every shard
        run: python3 scripts/mutation_score.py shards/* --min "${MUTATION_MIN_SCORE}" --summary "${GITHUB_STEP_SUMMARY}"
