name: Release

# A pushed version tag (vX.Y.Z) publishes bsky: it checks the tag against
# Cargo.toml and CHANGELOG.md, builds every target in release-targets.json with
# a pinned compiler and no build cache, packs reproducible archives, writes the
# third-party license texts, their checksums and an SBOM, signs checksums.txt
# with cosign, attests the build provenance, creates the GitHub release with the
# CHANGELOG section as its text, adds SLSA provenance to it, verifies all of it
# the way a user would, and only then publishes the crate and updates the
# Homebrew formula. Every action is pinned to a commit except the SLSA
# generator, which slsa-verifier requires to be referenced by tag.
#
# Cutting a release is described in CONTRIBUTING.md.
on:
  push:
    tags:
      - "v*"

# One release per tag at a time, never cancelled midway: a half-run release
# leaves crates.io, the GitHub release, and Homebrew out of step.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The compiler the binaries are built with, rather than whatever stable is
  # on the day of the tag. check-version.sh keeps it at or above rust-version.
  # No job restores a build cache: caches are written by other workflows, and
  # a poisoned one would end up in the binaries.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  # The build matrix, read from one file so the targets are listed once.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "matrix=$(jq -c . .github/release-targets.json)" >> "$GITHUB_OUTPUT"

  # The tag, the compiler pin, the release notes, and a dry-run publish.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Check the tag, the toolchain pin, and the CHANGELOG section
        run: ./scripts/release/check-version.sh "${GITHUB_REF_NAME}" "${RUST_TOOLCHAIN}"

      - name: Verify the crate packages and builds
        run: cargo publish --locked --dry-run

  build-binaries:
    needs: [verify, targets]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # bash on every runner: Windows would run PowerShell, where ${TARGET}
      # is not the environment variable.
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}"

      - name: Pack
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive }}
        run: |
          bin="target/${TARGET}/release/bsky"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          archive="bsky-${GITHUB_REF_NAME}-${TARGET}.${ARCHIVE_EXT}"
          ./scripts/release/pack-archive.sh "${bin}" "${archive}"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      # A glibc binary runs only where the C library is at least as new as the
      # newest GLIBC_x.y symbol version it links. v0.12.0 was built on Ubuntu
      # 24.04 and needed GLIBC_2.39, so it did not start on Debian 12 or Ubuntu
      # 22.04. The Linux targets build on Ubuntu 22.04, and this fails the
      # release if a binary needs a glibc newer than that system's.
      - name: Check the glibc the binary requires
        if: endsWith(matrix.target, '-linux-gnu')
        env:
          TARGET: ${{ matrix.target }}
          MAX_GLIBC: "2.35"
        run: |
          set -o pipefail
          need="$(objdump -T "target/${TARGET}/release/bsky" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          test -n "${need}"
          highest="$(printf '%s\n%s\n' "${need}" "${MAX_GLIBC}" | sort -V | tail -n 1)"
          if [ "${highest}" != "${MAX_GLIBC}" ]; then
            echo "::error title=glibc too new::${TARGET} requires GLIBC_${need}, the release allows up to ${MAX_GLIBC}"
            exit 1
          fi
          echo "${TARGET} requires GLIBC_${need} (allowed up to ${MAX_GLIBC})"

      # Layout, mode, and owner on every target, and `bsky --version` on the
      # ones this runner can execute.
      - name: Check the archive
        shell: bash
        env:
          EXEC: ${{ matrix.exec }}
        run: |
          args=("${ARCHIVE}" "${GITHUB_REF_NAME}")
          [ "${EXEC}" = "true" ] && args+=(--exec)
          ./scripts/release/check-archive.sh "${args[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # The license texts of every crate compiled into bsky. MIT, Apache-2.0 and
  # BSD ask a binary distribution to carry them; about.toml accepts exactly
  # what deny.toml allows, and --fail stops the release on anything else.
  licenses:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-about
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-about@0.9.2

      - name: Write the third-party licenses
        run: |
          out="bsky-${GITHUB_REF_NAME}-THIRD_PARTY_LICENSES.html"
          cargo about generate --locked --fail about.hbs -o "${out}"
          test -s "${out}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses
          path: bsky-*-THIRD_PARTY_LICENSES.html
          if-no-files-found: error

  # Every SHA-256 of the release is computed here, once. Every archive gets a
  # signed build provenance attestation, which
  # `gh attestation verify <archive> --repo nao1215/bluesky-terminal-client`
  # checks against this workflow and the tag it ran for, and checksums.txt is
  # signed with cosign (keyless: the certificate names this workflow and tag).
  # The signature is made before the release exists, so a failure here leaves
  # no unsigned release behind.
  checksums:
    needs: [build-binaries, licenses]
    runs-on: ubuntu-latest
    # id-token signs the attestation and the cosign certificate with the
    # workflow's identity, and attestations stores the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: licenses
          path: release-assets

      # One archive per target plus the license texts.
      - name: Write checksums.txt
        working-directory: release-assets
        run: |
          count="$(find . -maxdepth 1 -type f -name 'bsky-*' ! -name '*THIRD_PARTY_LICENSES.html' | wc -l)"
          targets="$(jq length "${GITHUB_WORKSPACE}/.github/release-targets.json")"
          if [ "${count}" -ne "${targets}" ]; then
            echo "::error title=Missing archives::${count} archives for ${targets} targets"
            exit 1
          fi
          test -s "bsky-${GITHUB_REF_NAME}-THIRD_PARTY_LICENSES.html"
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Attest the build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums.txt
        working-directory: release-assets
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      # The SLSA generator takes the subjects as base64 of sha256sum output.
      - name: Hand the checksums to the provenance job
        id: hashes
        run: echo "hashes=$(base64 -w0 release-assets/checksums.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: |
            release-assets/checksums.txt
            release-assets/checksums.txt.sigstore.json

  sbom:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token signs the attestation with the workflow's identity, and
    # attestations stores it with the repository.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate the CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --override-filename "bsky-${GITHUB_REF_NAME}.cdx"
          test -s "bsky-${GITHUB_REF_NAME}.cdx.json"

      - name: Attest the SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bsky-${{ github.ref_name }}.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: bsky-*.cdx.json

  create-release:
    needs: [checksums, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Write the release notes from CHANGELOG.md
        run: ./scripts/release/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          args=(--repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md)
          [ "${PRERELEASE}" = "true" ] && args+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" release-assets/* "${args[@]}"

  # SLSA build provenance for everything checksums.txt lists, attached to the
  # release as bsky-<tag>.intoto.jsonl. The reusable workflow must be referenced
  # by tag: slsa-verifier checks the tag the provenance names.
  provenance:
    needs: [checksums, create-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.checksums.outputs.hashes }}
      provenance-name: bsky-${{ github.ref_name }}.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}

  # The published release checked the way README tells a user to check it. The
  # crate and the Homebrew formula wait for this, since a version on crates.io
  # cannot be taken back.
  verify-release:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release

      - name: Verify the checksums and their signature
        working-directory: release
        run: |
          sha256sum --check checksums.txt
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      - name: Verify the SLSA provenance and the attestations
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in bsky-*.tar.gz bsky-*.zip; do
            slsa-verifier verify-artifact "${f}" \
              --provenance-path "bsky-${GITHUB_REF_NAME}.intoto.jsonl" \
              --source-uri "github.com/${GITHUB_REPOSITORY}" \
              --source-tag "${GITHUB_REF_NAME}"
            gh attestation verify "${f}" --repo "${GITHUB_REPOSITORY}"
          done

  # crates.io with CARGO_REGISTRY_TOKEN when it is set, else trusted publishing
  # (which needs the crate to exist on crates.io first). The crate is published
  # after the release so a failed build never leaves a version on crates.io
  # without binaries.
  publish-crate:
    needs: [create-release, verify-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Authenticate to crates.io with trusted publishing
        if: env.HAS_CARGO_REGISTRY_TOKEN == 'false'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish the crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.HAS_CARGO_REGISTRY_TOKEN == 'true' && secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}

  publish-homebrew-formula:
    needs: [create-release, verify-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN_CONFIGURED: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN != '' }}
    steps:
      - name: Skip without a tap token
        if: env.HOMEBREW_TAP_TOKEN_CONFIGURED != 'true'
        run: echo "::warning title=Homebrew formula not updated::Set HOMEBREW_TAP_GITHUB_TOKEN to update nao1215/homebrew-tap."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HOMEBREW_TAP_TOKEN_CONFIGURED == 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.HOMEBREW_TAP_TOKEN_CONFIGURED == 'true'
        with:
          name: checksums
          path: homebrew-assets

      # The formula takes its hashes from the checksums the release publishes.
      - name: Render the formula
        if: env.HOMEBREW_TAP_TOKEN_CONFIGURED == 'true'
        run: |
          ./scripts/release/render-formula.sh "${GITHUB_REF_NAME}" homebrew-assets/checksums.txt "${GITHUB_REPOSITORY}" > bsky.rb
          ruby -c bsky.rb

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HOMEBREW_TAP_TOKEN_CONFIGURED == 'true'
        with:
          repository: nao1215/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Commit and push the formula
        if: env.HOMEBREW_TAP_TOKEN_CONFIGURED == 'true'
        run: |
          mv bsky.rb homebrew-tap/bsky.rb
          cd homebrew-tap
          if [ -z "$(git status --short -- bsky.rb)" ]; then
            echo "The formula is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bsky.rb
          git commit -m "Update bsky formula for ${GITHUB_REF_NAME}"
          git push

  verify-homebrew-install:
    needs: publish-homebrew-formula
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    env:
      HOMEBREW_TAP_TOKEN_CONFIGURED: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN != '' }}
    steps:
      - name: Install bsky from the tap and check its version
        if: env.HOMEBREW_TAP_TOKEN_CONFIGURED == 'true'
        run: |
          brew install nao1215/tap/bsky
          bsky --version
          brew test nao1215/tap/bsky
