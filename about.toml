# cargo-about writes the dependency license texts attached to each release.
# bsky uses crates/bluesky-terminal-client/about.hbs; the other clients use
# scripts/release/about.hbs. The accepted list matches deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

# The platforms release.yml ships (.github/release-targets.json).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

ignore-dev-dependencies = true
ignore-build-dependencies = false
