[package]
name = "misskey-terminal-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["CHIKAMATSU Naohiro <n.chika156@gmail.com>"]
description = "Unofficial Misskey client for the terminal: read an account's notes, search, and save the files attached to notes."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nao1215/misskey-terminal-client"
keywords = ["misskey", "fediverse", "cli", "terminal"]
categories = ["command-line-utilities"]
exclude = [
    ".github/",
    ".gitignore",
    "deny.toml",
    "e2e/",
    "justfile",
    "scripts/",
]

[[bin]]
name = "msky"
path = "src/main.rs"

[dependencies]
jiff = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
rstest = "0.29"
tempfile = "3"

# An error is returned, shown, or kept with the reason it can be ignored: a
# panic leaves a half-written download behind, and a swallowed error hides
# what the user needs to know. clippy.toml lets tests unwrap.
# let_underscore_untyped stays off: it flags every `let _ =`, and the ones
# that matter (a Result, a lock, a future) have lints of their own.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
