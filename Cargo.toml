[package]
name = "bluesky-terminal-client"
version = "0.15.0"
edition = "2024"
rust-version = "1.90"
authors = ["CHIKAMATSU Naohiro <n.chika156@gmail.com>"]
description = "Unofficial Bluesky client for the terminal that shows pictures and videos inline (kitty graphics, sixel, iTerm2)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nao1215/sns-terminal-clients"
keywords = ["bluesky", "atproto", "tui", "terminal", "sixel"]
categories = ["command-line-utilities"]
# The unit tests read e2e/atago/testdata, so it ships; the rest of the
# repository's tooling does not.
exclude = [
    ".github/",
    ".gitignore",
    ".octocov.yml",
    "about.hbs",
    "about.toml",
    "bench/",
    "deny.toml",
    "doc/",
    "e2e/*.sh",
    "e2e/atago/*.yaml",
    "fuzz/",
    "justfile",
    "scripts/",
]

# `cargo binstall bluesky-terminal-client` fetches the release archive instead
# of building it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/bsky-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "bsky"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
jiff.workspace = true
openh264.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal-kit = { path = "crates/terminal-kit", version = "0.1.0" }
unicode-segmentation.workspace = true
unicode-width.workspace = true
ureq.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# msky (crates/misskey-terminal-client) and the shared terminal drawing
# helpers (crates/terminal-kit) live in crates/; the root package is a member
# too, and bare cargo commands at the root act on it alone.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["CHIKAMATSU Naohiro <n.chika156@gmail.com>"]
license = "MIT"
repository = "https://github.com/nao1215/sns-terminal-clients"

# Versions more than one member builds with, kept in step here.
[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "7"
fast_image_resize = { version = "6.1.0", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false }
jiff = "1"
openh264 = "0.9"
proptest = { version = "1.12", default-features = false, features = ["std"] }
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rstest = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"
# ratatui-core 0.1.2 adds 1 to the width of U+FF9E/U+FF9F, and 0.2.3 counts them too, so a half-width kana takes 3 cells; drop the cap once ratatui stops adding its own width.
unicode-width = ">=0.2, <0.2.3"
ureq = "3"

# cargo-llvm-cov sets cfg(coverage); tests that never run under it opt out.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

# An error is returned, shown, or kept with the reason it can be ignored: a
# panic on the UI thread leaves the terminal in raw mode, and a swallowed
# error hides what the user needs to know. clippy.toml lets tests unwrap.
# let_underscore_untyped stays off: it flags every `let _ =`, and the ones
# that matter (a Result, a lock, a future) have lints of their own.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# What e2e/run.sh builds: the release optimizations without the link-time
# optimization and the single codegen unit, which make the same code a little
# faster and took most of the E2E job (3 minutes of the 4 on Windows).
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
