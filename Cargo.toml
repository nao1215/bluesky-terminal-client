# The workspace of the terminal clients: each client and the shared terminal
# drawing helpers (terminal-kit) are a package in crates/, and the root holds
# no package of its own. A bare cargo command at the root acts on every member.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["CHIKAMATSU Naohiro <n.chika156@gmail.com>"]
license = "MIT"
repository = "https://github.com/nao1215/social-terminal-clients"

# Versions more than one member builds with, kept in step here.
[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "7"
fast_image_resize = { version = "6.1.0", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false }
jiff = "1"
openh264 = "0.9"
proptest = { version = "1.12", default-features = false, features = ["std"] }
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rstest = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"
# ratatui-core 0.1.2 adds 1 to the width of U+FF9E/U+FF9F, and 0.2.3 counts them too, so a half-width kana takes 3 cells; drop the cap once ratatui stops adding its own width.
unicode-width = ">=0.2, <0.2.3"
ureq = "3.5.2"

# cargo-llvm-cov sets cfg(coverage); tests that never run under it opt out.
# unreachable_pub keeps `pub` for what a crate's users can reach: terminal-kit's
# API. The clients are binaries, so what another of their modules uses is
# pub(crate), and the rest stays private to its module.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
unreachable_pub = "warn"

# An error is returned, shown, or kept with the reason it can be ignored: a
# panic on the UI thread leaves the terminal in raw mode, and a swallowed
# error hides what the user needs to know. clippy.toml lets tests unwrap.
# let_underscore_untyped stays off: it flags every `let _ =`, and the ones
# that matter (a Result, a lock, a future) have lints of their own.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# What each client's e2e/run.sh builds: the release optimizations without the
# link-time optimization and the single codegen unit, which make the same code
# a little faster and took most of the E2E job (3 minutes of the 4 on Windows).
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
