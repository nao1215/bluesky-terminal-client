[package]
name = "bluesky-terminal-client"
version = "0.10.1"
edition = "2024"
rust-version = "1.90"
authors = ["CHIKAMATSU Naohiro <n.chika156@gmail.com>"]
description = "Unofficial Bluesky client for the terminal that shows pictures and videos inline (kitty graphics, sixel, iTerm2)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nao1215/bluesky-terminal-client"
keywords = ["bluesky", "atproto", "tui", "terminal", "sixel"]
categories = ["command-line-utilities"]
# The unit tests read e2e/atago/testdata, so it ships; the rest of the
# repository's tooling does not.
exclude = [
    ".github/",
    ".gitignore",
    ".octocov.yml",
    "bench/",
    "deny.toml",
    "doc/",
    "e2e/*.sh",
    "e2e/atago/*.yaml",
    "justfile",
    "scripts/",
]

# `cargo binstall bluesky-terminal-client` fetches the release archive instead
# of building it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/bsky-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "bsky"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "7"
fast_image_resize = { version = "6.1.0", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
openh264 = "0.9"
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = "3"

# Reads the console input before crossterm does; see src/tui/events.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
rstest = "0.27"
tempfile = "3"

# cargo-llvm-cov sets cfg(coverage); tests that never run under it opt out.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
