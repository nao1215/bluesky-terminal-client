          graphics: kitty
          rows: 30
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_BROWSER: bsky
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains:
                  - "❝ @bob.test: the words Bob wrote"
                  - "❝ quoted post not found"
                stable_for: 300ms
            # The third post has no link: o opens the post itself.
            - send: j
            - send: j
            - send: o
            - expect_screen:
                contains: "opened https://bsky.app/profile/did:plc:alice/post/p3"
            # The fourth post quotes a post that has a picture: the picture
            # is drawn here, and space opens it full screen.
            - send: j
            - expect_screen:
                contains: "❝ @bob.test: from the top"
                # The quoted post's square picture, drawn in the row.
                images: { contains: [ { width: 240, height: 240 } ] }
                stable_for: 300ms
            - send: " "
            - expect_screen:
                contains: ["1/1", "山の頂上", "d download"]
                # The same picture, now full screen.
                images: { contains: [ { width: 520, height: 520 } ] }
            - send: { key: esc }
            # Back on the timeline before quitting.
            - expect_screen:
                contains: "Bob's photo"
                not_contains: "d download"
            - send: q
      - assert:
          exit_code: 0


  # Deleting takes two keys, and only works on your own post. What goes to
  # the server is a deleteRecord for that post in your own repo.
  - name: D deletes your own post after a y, and any other key keeps it
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:bob/app.bsky.feed.post/theirs
                    cid: cid-theirs
                    author: { did: did:plc:bob, handle: bob.test, displayName: Bob, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fb } }
                    record: { text: "Bob wrote this", createdAt: "2026-09-20T10:00:00.000Z" }
                    indexedAt: "2026-09-20T10:00:05.000Z"
                - post:
                    uri: at://did:plc:me/app.bsky.feed.post/mine
                    cid: cid-mine
                    author: { did: did:plc:me, handle: me.test, displayName: Me }
                    record: { text: "My own post to delete", createdAt: "2026-09-20T09:00:00.000Z" }
                    indexedAt: "2026-09-20T09:00:05.000Z"
          - method: POST
            path: /xrpc/com.atproto.repo.deleteRecord
            json: {}
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 24
          cols: 90
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Bob wrote this", "My own post to delete", ". actions"]
                stable_for: 300ms
            # Bob's post is selected: his is not deletable, and the actions
            # list does not offer it.
            - send: "."
            - expect_screen:
                contains: ["Actions", "reply to it"]
                not_contains: "delete your post"
            # Wait for the list to go: Esc and the next key together read as
            # Alt and that key.
            - send: { key: esc }
            - expect_screen:
                not_contains: "Actions"
            - send: D
            - expect_screen:
                contains: "you can only delete your own posts"
            # On my own post the list offers it.
            - send: j
            - send: "."
            - expect_screen:
                contains: "delete your post"
            - send: { key: esc }
            - expect_screen:
                not_contains: "Actions"
            - send: D
            - expect_screen:
                contains: "press y to delete this post"
            # Any other key keeps the post, and that key does nothing else.
            - send: k
            - expect_screen:
                contains: ["not deleted", "My own post to delete"]
            - send: D
            - send: y
            - expect_screen:
                contains: "post deleted"
                not_contains: "My own post to delete"
                stable_for: 300ms
            - send: q
      - assert:
          exit_code: 0
      # One delete left, for that post, in my own repo.
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.deleteRecord
            method: POST
            count: 1
            body:
              json:
                - { path: "$.repo", equals: "did:plc:me" }
                - { path: "$.collection", equals: "app.bsky.feed.post" }
                - { path: "$.rkey", equals: "mine" }

  # c asks the terminal itself to hold the post's address (OSC 52), which is
  # what works over ssh and in tmux.
  - name: c puts the post's address in the terminal's clipboard
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:bob/app.bsky.feed.post/theirs
                    cid: cid-theirs
                    author: { did: did:plc:bob, handle: bob.test, displayName: Bob, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fb } }
                    record: { text: "Bob wrote this", createdAt: "2026-09-20T10:00:00.000Z" }
                    indexedAt: "2026-09-20T10:00:05.000Z"
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 24
          cols: 90
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Bob wrote this", ". actions"]
                stable_for: 300ms
            # Through the list this time: it runs the key it names.
            - send: "."
            - expect_screen:
                contains: "copy its address"
                stable_for: 200ms
            - send: c
            - expect_screen:
                contains: "copied https://bsky.app/profile/did:plc:bob/post/theirs"
            - send: q
      - assert:
          exit_code: 0
          stdout:
            # OSC 52 for the clipboard, carrying that address in base64.
            contains: "]52;c;aHR0cHM6Ly9ic2t5LmFwcC9wcm9maWxlL2RpZDpwbGM6Ym9iL3Bvc3QvdGhlaXJz"

  # Q quotes the selected post: the composer says whose post it is, and the
  # record that goes out carries that post by URI and CID.
  - name: Q sends a post that quotes the selected one
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:bob/app.bsky.feed.post/theirs
                    cid: cid-theirs
                    author: { did: did:plc:bob, handle: bob.test, displayName: Bob, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fb } }
                    record: { text: "Bob wrote this", createdAt: "2026-09-20T10:00:00.000Z" }
                    indexedAt: "2026-09-20T10:00:05.000Z"
          - method: POST
            path: /xrpc/com.atproto.repo.createRecord
            json: { uri: "at://did:plc:me/app.bsky.feed.post/new", cid: "cid-new" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 24
          cols: 90
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Bob wrote this", ". actions"]
                stable_for: 300ms
            - send: Q
            - expect_screen:
                contains: ["Quote @bob.test", "❝ Bob wrote this", "ctrl+s send"]
            - send: "worth reading 👍🏽"
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "posted"
                not_contains: "Quote @bob.test"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json:
                - { path: "$.record.text", equals: "worth reading 👍🏽" }
                - { path: "$.record.embed['$type']", equals: "app.bsky.embed.record" }
                - { path: "$.record.embed.record.uri", equals: "at://did:plc:bob/app.bsky.feed.post/theirs" }
                - { path: "$.record.embed.record.cid", equals: "cid-theirs" }

  # M mutes the author of the selected post at once; B asks first, since a
  # block is public, and any key but y leaves them be. Their posts leave the
  # timeline as the answer comes.
  - name: M mutes the selected post's author and B blocks after a y, and their posts leave the timeline
    mock_servers:
      - name: api
        routes:
          - *timeline
          - *img_alice
          - *img_bob
          - *img_photo
          - method: POST
            path: /xrpc/app.bsky.graph.muteActor
            json: {}
          - method: POST
            path: /xrpc/com.atproto.repo.createRecord
            json: { uri: "at://did:plc:me/app.bsky.graph.block/b1", cid: "cid-b1" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Photo from the mountains", "Replying to carol"]
            - send: M
            - expect_screen:
                contains: ["muted: their posts leave your lists", "Replying to carol"]
                not_contains: "Photo from the mountains"
            - send: B
            - expect_screen:
                contains: "press y to block @bob.test"
            - send: n
            - expect_screen:
                contains: ["not blocked", "Replying to carol"]
            - send: B
            - send: y
            - expect_screen:
                contains: ["blocked: B on their profile unblocks", "My own post"]
                not_contains: "Replying to carol"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/app.bsky.graph.muteActor
            count: 1
            body:
              json: { path: "$.actor", equals: "did:plc:alice" }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json:
                - { path: "$.collection", equals: "app.bsky.graph.block" }
                - { path: "$.record.subject", equals: "did:plc:bob" }
                - { path: "$.record['$type']", equals: "app.bsky.graph.block" }

  # A post deleted on the Profile tab leaves the timeline too. The post
  # selected there, below it, stays selected: l back on the timeline likes
  # that one, not the one after it.
  - name: a post deleted elsewhere above the selection leaves the selection on its post
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post: { uri: "at://did:plc:me/app.bsky.feed.post/m1", cid: cid-m1, author: { did: did:plc:me, handle: me.test }, record: { text: "Mine, to be deleted", createdAt: "2026-09-20T10:00:00.000Z" } }
                - post: { uri: "at://did:plc:alice/app.bsky.feed.post/a2", cid: cid-a2, author: { did: did:plc:alice, handle: alice.test, viewer: { following: "at://did:plc:me/app.bsky.graph.follow/a" } }, record: { text: "Alice's post", createdAt: "2026-09-20T09:00:00.000Z" } }
                - post: { uri: "at://did:plc:bob/app.bsky.feed.post/b3", cid: cid-b3, author: { did: did:plc:bob, handle: bob.test, viewer: { following: "at://did:plc:me/app.bsky.graph.follow/b" } }, record: { text: "Bob's post 🇯🇵", createdAt: "2026-09-20T08:00:00.000Z" } }
                - post: { uri: "at://did:plc:carol/app.bsky.feed.post/c4", cid: cid-c4, author: { did: did:plc:carol, handle: carol.test, viewer: { following: "at://did:plc:me/app.bsky.graph.follow/c" } }, record: { text: "Carol's post", createdAt: "2026-09-20T07:00:00.000Z" } }
          - method: GET
            path: /xrpc/app.bsky.actor.getProfile
            json: { did: did:plc:me, handle: me.test }
          - method: GET
            path: /xrpc/app.bsky.feed.getAuthorFeed
            json:
              feed:
                - post: { uri: "at://did:plc:me/app.bsky.feed.post/m1", cid: cid-m1, author: { did: did:plc:me, handle: me.test }, record: { text: "Mine, to be deleted", createdAt: "2026-09-20T10:00:00.000Z" } }
          - *delete_record
          - *create_record
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Mine, to be deleted", "Carol's post"]
            - send: j
            - send: j
            - send: "5"
            - expect_screen:
                contains: ["Mine, to be deleted", "this is you"]
            - send: D
            - expect_screen:
                contains: "press y to delete"
            - send: y
            - expect_screen:
                contains: "post deleted"
            - send: "1"
            - expect_screen:
                contains: "Bob's post 🇯🇵"
                not_contains: "Mine, to be deleted"
            - send: l
            - expect_screen:
                contains: "liked"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json: { path: "$.record.subject.uri", equals: "at://did:plc:bob/app.bsky.feed.post/b3" }

  # A thread someone posts in parts: the second part comes with the first
  # above it, and the first, also in the timeline, is not shown again below.
  - name: a post shown above its reply is not shown a second time
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:t/app.bsky.feed.post/p2
                    cid: cid-p2
                    author: { did: did:plc:t, handle: trending.test, displayName: Trending, viewer: { following: at://did:plc:me/app.bsky.graph.follow/t } }
                    record:
                      text: "Second part (2/2)"
                      createdAt: "2026-09-20T10:01:00.000Z"
                      reply: { root: { uri: at://did:plc:t/app.bsky.feed.post/p1, cid: cid-p1 }, parent: { uri: at://did:plc:t/app.bsky.feed.post/p1, cid: cid-p1 } }
                  reply:
                    root: { $type: app.bsky.feed.defs#postView, uri: at://did:plc:t/app.bsky.feed.post/p1, cid: cid-p1, author: { did: did:plc:t, handle: trending.test, displayName: Trending }, record: { text: "First part 🚀 (1/2)", createdAt: "2026-09-20T10:00:00.000Z" } }
                    parent: { $type: app.bsky.feed.defs#postView, uri: at://did:plc:t/app.bsky.feed.post/p1, cid: cid-p1, author: { did: did:plc:t, handle: trending.test, displayName: Trending }, record: { text: "First part 🚀 (1/2)", createdAt: "2026-09-20T10:00:00.000Z" } }
                - post:
                    uri: at://did:plc:t/app.bsky.feed.post/p1
                    cid: cid-p1
                    author: { did: did:plc:t, handle: trending.test, displayName: Trending, viewer: { following: at://did:plc:me/app.bsky.graph.follow/t } }
                    record: { text: "First part 🚀 (1/2)", createdAt: "2026-09-20T10:00:00.000Z" }
                - post:
                    uri: at://did:plc:o/app.bsky.feed.post/o1
                    cid: cid-o1
                    author: { did: did:plc:o, handle: other.test, viewer: { following: at://did:plc:me/app.bsky.graph.follow/o } }
                    record: { text: "Someone else", createdAt: "2026-09-20T09:00:00.000Z" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Second part (2/2)", "Someone else"]
            - expect_screen:
                matches: "First part 🚀 \\(1/2\\)"
                count: 1
            - send: q
      - assert:
          exit_code: 0
