                - { path: "$.record.text", equals: "家族が👨‍👩‍👧‍👦 （https://example.com） 🇯🇵" }
                # 9 bytes of kana and kanji, 25 of the family, a space, and
                # the 3-byte full-width parenthesis, which is not in the link.
                - { path: "$.record.facets", length: 1 }
                - { path: "$.record.facets[0].index.byteStart", equals: 38 }
                - { path: "$.record.facets[0].index.byteEnd", equals: 57 }
                - { path: "$.record.facets[0].features[0].uri", equals: "https://example.com" }

  # A paste into the composer keeps its line breaks (a post may have several
  # lines) and its emoji, and the facets after them are counted in bytes of
  # the pasted text.
  - name: a paste into the composer keeps its lines and emoji and links what it holds
    mock_servers:
      - name: api
        routes:
          - *timeline
          - *img_alice
          - *img_bob
          - *img_photo
          - *create_record
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "Photo from the mountains"
            - send: n
            - expect_screen:
                contains: "New post"
            - send: { paste: "一行目👍🏽\r\n#タグ https://example.com" }
            - expect_screen:
                contains: ["一行目👍🏽", "#タグ https://example.com"]
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "posted"
                not_contains: "New post"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json:
                # The CR of a CRLF paste is dropped, the LF kept.
                - { path: "$.record.text", equals: "一行目👍🏽\n#タグ https://example.com" }
                # 9 bytes of kanji, 8 of the thumbs-up, 1 of the line break.
                - { path: "$.record.facets", length: 2 }
                - { path: "$.record.facets[0].index.byteStart", equals: 18 }
                - { path: "$.record.facets[0].index.byteEnd", equals: 25 }
                - { path: "$.record.facets[0].features[0].tag", equals: "タグ" }
                - { path: "$.record.facets[1].index.byteStart", equals: 26 }
                - { path: "$.record.facets[1].index.byteEnd", equals: 45 }

  # G and g move the selection to the last and first post, and what the next
