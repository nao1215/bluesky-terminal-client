                          uri: at://did:plc:bob/app.bsky.feed.post/quoted
                          cid: cid-quoted
                          author: { did: did:plc:bob, handle: bob.test, displayName: Bob }
                          value: { text: "the words Bob wrote" }
                      media:
                        $type: app.bsky.embed.images#view
                        images: [ { thumb: "${api.url}/img/photo.png", fullsize: "${api.url}/img/photo.png", alt: "", aspectRatio: { width: 4, height: 3 } } ]
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/q2
                    cid: cid-q2
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "This one is gone", createdAt: "2026-09-20T09:00:00.000Z" }
                    indexedAt: "2026-09-20T09:00:05.000Z"
                    embed:
                      $type: app.bsky.embed.record#view
                      record:
                        $type: app.bsky.embed.record#viewNotFound
                        uri: at://did:plc:bob/app.bsky.feed.post/gone
                        notFound: true
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/p3
                    cid: cid-p3
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Just words, no link", createdAt: "2026-09-20T08:00:00.000Z" }
                    indexedAt: "2026-09-20T08:00:05.000Z"
                # A plain quote of a post that has a picture: the picture is
                # drawn here, as the quoted post itself would draw it.
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/q3
                    cid: cid-q3
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Bob's photo", createdAt: "2026-09-20T07:00:00.000Z" }
                    indexedAt: "2026-09-20T07:00:05.000Z"
                    embed:
                      $type: app.bsky.embed.record#view
                      record:
                        $type: app.bsky.embed.record#viewRecord
                        uri: at://did:plc:bob/app.bsky.feed.post/withpic
                        cid: cid-withpic
                        author: { did: did:plc:bob, handle: bob.test, displayName: Bob }
                        value: { text: "from the top" }
                        embeds:
                          - $type: app.bsky.embed.images#view
                            images: [ { thumb: "${api.url}/img/alice.png", fullsize: "${api.url}/img/alice.png", alt: "山の頂上", aspectRatio: { width: 1, height: 1 } } ]
          - *img_alice
    steps:
      - *session
      - pty:
