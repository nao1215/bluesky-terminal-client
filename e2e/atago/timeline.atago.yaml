  # A write is never tried again by itself: a gateway error on a like may
  # come after the server made the like, and a second try would make two.
  # Reads are tried once more (see the failing timeline below); writes are
  # not, and the post stays as it was.
  - name: a like, a repost and a delete the server fails with 502 are each sent once
    mock_servers:
      - name: api
        routes:
          - *timeline
          - *img_alice
          - *img_bob
          - *img_photo
          - method: POST
            path: /xrpc/com.atproto.repo.createRecord
            status: 502
            body: "bad gateway"
          - method: POST
            path: /xrpc/com.atproto.repo.deleteRecord
            status: 502
            body: "bad gateway"
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: ["♡ 2   ⟳ 1", "My own post"]
            - send: l
            - expect_screen:
                contains: [" Error ", "com.atproto.repo.createRecord failed: HTTP 502"]
            # Any key closes the error box; right does nothing else here.
            - send: { key: right }
            - expect_screen:
                contains: "♡ 2   ⟳ 1"
                not_contains: [" Error ", "♥ 3"]
            - send: b
            - expect_screen:
                contains: [" Error ", "com.atproto.repo.createRecord failed: HTTP 502"]
            - send: { key: right }
            - expect_screen:
                contains: "♡ 2   ⟳ 1"
                not_contains: [" Error ", "⟳ 2"]
            - send: G
            - send: D
            - expect_screen:
                contains: "press y to delete this post"
            - send: y
            - expect_screen:
                contains: [" Error ", "com.atproto.repo.deleteRecord failed: HTTP 502"]
            - send: { key: right }
            # The post is still there, and a second y does not delete it.
            - expect_screen:
                contains: "My own post"
                not_contains: " Error "
            - send: y
            - expect_screen:
                contains: "My own post"
                stable_for: 500ms
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.createRecord, count: 2 }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            body:
              json: { path: "$.record.subject.uri", equals: "at://did:plc:alice/app.bsky.feed.post/p1" }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.deleteRecord
            count: 1
            body:
              json:
                - { path: "$.repo", equals: "did:plc:me" }
                - { path: "$.rkey", equals: "p4" }

  - name: a failing timeline is reported and the client keeps running
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            status: 502
            body: "bad gateway"
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "app.bsky.feed.getTimeline failed: HTTP 502"
            # R retries.
            - send: R
            - expect_screen:
                contains: "app.bsky.feed.getTimeline failed: HTTP 502"
                not_contains: "refreshing"
                stable_for: 300ms
            - send: q
      - assert:
          exit_code: 0
      # A gateway error is tried once more by itself, so two loads (the
      # start and R) make four requests.
      - assert:
          mock: { name: api, path: /xrpc/app.bsky.feed.getTimeline, count: 4 }

  - name: an expired access token is refreshed once and the new tokens are saved
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            status: 400
            json: { error: "ExpiredToken", message: "Token has expired" }
          - method: POST
            path: /xrpc/com.atproto.server.refreshSession
            json: { did: "did:plc:me", handle: "me.test", accessJwt: "acc-2", refreshJwt: "ref-2" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            # This stub never stops saying "expired", so the one retry fails
            # too, and that failure is what is shown: no refresh loop.
            - expect_screen:
                contains: "ExpiredToken: Token has expired"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.server.refreshSession
            count: 1
            header: { name: Authorization, equals: "Bearer ref" }
      - assert:
          mock:
            name: api
            path: /xrpc/app.bsky.feed.getTimeline
            count: 2
            header: { name: Authorization, equals: "Bearer acc-2" }
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            json:
              - { path: "$.accessJwt", equals: "acc-2" }
              - { path: "$.refreshJwt", equals: "ref-2" }
              - { path: "$.service", equals: "${api.url}" }

  # The access token saved when bsky last ran has usually expired by the next
  # start. Its JWT says when; one past that is refreshed before the first
  # load, which is then sent once, not refused first and sent again.
  - name: an access token past the expiry it carries is refreshed before the first load
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
          - method: POST
            path: /xrpc/com.atproto.server.refreshSession
            json: { did: "did:plc:me", handle: "me.test", accessJwt: "acc-2", refreshJwt: "ref-2" }
    steps:
      # The access token is a JWT that expired in November 2023.
      - fixture:
          file: cfg/accounts/did_plc_me.json
          content: |
            {"service": "${api.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJhdCtqd3QifQ.eyJleHAiOjE3MDAwMDAwMDB9.sig", "refreshJwt": "ref"}
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.server.refreshSession
            count: 1
            header: { name: Authorization, equals: "Bearer ref" }
      - assert:
          mock:
            name: api
            path: /xrpc/app.bsky.feed.getTimeline
            count: 1
            header: { name: Authorization, equals: "Bearer acc-2" }
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            json:
              - { path: "$.accessJwt", equals: "acc-2" }
              - { path: "$.refreshJwt", equals: "ref-2" }
      # Meanwhile a connection is opened for each load the start sends at
      # once, with a request that asks nothing of the account.
      - assert:
          mock:
            name: api
            path: /xrpc/_health
            method: HEAD
            count: 4
            header: { name: Authorization, equals: "" }

  # The loads at the start run at once and all find the token expired. A
  # refresh token works only once, so one of them refreshes and the others
  # take the new token instead of refreshing with the spent one.
  - name: loads that find the token expired together refresh it once
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            status: 400
            delay: 300ms
            json: { error: "ExpiredToken", message: "Token has expired" }
          - method: GET
            path: /xrpc/app.bsky.notification.listNotifications
            status: 400
            delay: 300ms
            json: { error: "ExpiredToken", message: "Token has expired" }
          - method: POST
            path: /xrpc/com.atproto.server.refreshSession
            json: { did: "did:plc:me", handle: "me.test", accessJwt: "acc-2", refreshJwt: "ref-2" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "ExpiredToken: Token has expired"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.server.refreshSession
            count: 1
            header: { name: Authorization, equals: "Bearer ref" }
      - assert:
          mock:
            name: api
            path: /xrpc/app.bsky.notification.listNotifications
            count: 2
            header: { name: Authorization, equals: "Bearer acc-2" }
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            json: { path: "$.refreshJwt", equals: "ref-2" }

  - name: a refresh token the server refuses brings back the login form
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            status: 400
            json: { error: "ExpiredToken", message: "Token has expired" }
          - method: POST
            path: /xrpc/com.atproto.server.refreshSession
            status: 400
            json: { error: "ExpiredToken", message: "Token has been revoked" }
          - method: POST
            path: /xrpc/com.atproto.server.createSession
            # Long enough for "logging in…" to be seen before the answer.
            delay: 300ms
            json: { did: "did:plc:me", handle: "me.test", accessJwt: "acc-new", refreshJwt: "ref-new" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          env: *env
          timeout: 20s
          session:
            # The account is filled in; only the password is asked for.
            - expect_screen:
                contains: ["Log in to Bluesky", "the session has expired; log in again", "me.test", "${api.url}"]
            - send: "app-pass-1234"
            - send: { key: enter }
            # This stand-in server refuses every token, the new one too, so
            # once logged in the form comes back at once. The login is done
            # when "logging in…" has gone; the new tokens are checked in the
            # file below. ctrl+c quits from the form.
            - expect_screen:
                contains: "logging in…"
            - expect_screen:
                contains: "the session has expired; log in again"
                not_contains: "logging in…"
            - send: { key: ctrl-c }
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.server.createSession
            count: 1
            body:
              json:
                - { path: "$.identifier", equals: "me.test" }
                - { path: "$.password", equals: "app-pass-1234" }
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            json: { path: "$.refreshJwt", equals: "ref-new" }

  - name: a draft is still there after the session expires while it is sent and the login form comes back
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
          - method: POST
            path: /xrpc/com.atproto.repo.createRecord
            status: 400
            json: { error: "ExpiredToken", message: "Token has expired" }
          - method: POST
            path: /xrpc/com.atproto.server.refreshSession
            status: 400
            json: { error: "ExpiredToken", message: "Token has been revoked" }
          - method: POST
            path: /xrpc/com.atproto.server.createSession
            json: { did: "did:plc:me", handle: "me.test", accessJwt: "acc-new", refreshJwt: "ref-new" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: n
            - expect_screen:
                contains: "New post"
            - send: "a draft worth keeping"
            - send: { key: ctrl-s }
            # The expired session brings the login form up over the composer.
            - expect_screen:
                contains: ["Log in to Bluesky", "the session has expired; log in again"]
            - send: "app-pass-1234"
            - send: { key: enter }
            # Logged in again, the draft is still in the composer.
            - expect_screen:
                contains: ["New post", "a draft worth keeping"]
                not_contains: "Log in to Bluesky"
                stable_for: 300ms
            - send: { key: esc }
            - expect_screen:
                not_contains: "New post"
            - send: q
      - assert:
          exit_code: 0
      # Sent once, and never again by itself: sending it is the user's to do.
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json:
                - { path: "$.record.text", equals: "a draft worth keeping" }

  # D asks, and the question belongs to that moment. The notifications load
  # in the background and find the session expired while D is waiting for
  # its y; the login form comes up, and after logging in again the first y
  # is not taken as the answer to a question asked before.
  - name: a delete asked before the session expired is not made by the first y after logging in
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:me/app.bsky.feed.post/mine
                    cid: cid-mine
                    author: { did: did:plc:me, handle: me.test, displayName: Me }
                    record: { text: "My own post, asked about", createdAt: "2026-09-20T09:00:00.000Z" }
          - method: GET
            path: /xrpc/app.bsky.notification.listNotifications
            delay: 2s
            status: 400
            json: { error: "ExpiredToken", message: "Token has expired" }
          - method: POST
            path: /xrpc/com.atproto.server.refreshSession
            status: 400
            json: { error: "ExpiredToken", message: "Token has been revoked" }
          - method: POST
            path: /xrpc/com.atproto.server.createSession
            json: { did: "did:plc:me", handle: "me.test", accessJwt: "acc-new", refreshJwt: "ref-new" }
          - method: POST
            path: /xrpc/com.atproto.repo.deleteRecord
            json: {}
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "My own post, asked about"
            - send: D
            - expect_screen:
                contains: "press y to delete this post"
            # No key: the background load expires the session.
            - expect_screen:
                contains: ["Log in to Bluesky", "the session has expired; log in again"]
            - send: "app-pass-1234"
            - send: { key: enter }
            - expect_screen:
                contains: "My own post, asked about"
                not_contains: "Log in to Bluesky"
            - send: y
            - expect_screen:
                contains: "My own post, asked about"
                not_contains: "deleting"
                stable_for: 300ms
            - send: { key: ctrl-c }
      - assert:
          exit_code: 0
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.deleteRecord, count: 0 }

  - name: the help lists the keys by section, scrolls, and closes only on purpose
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 20
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            # The hint row names the keys of the current view at all times.
            - expect_screen:
                contains: ["? help", "j k move", ". actions"]
            - send: "?"
            - expect_screen:
                contains: ["Keys", "Global", "choose a color theme", "j/pgdn more"]
                not_contains: "edit your profile"
            # A stray key does not close it.
            - send: x
            - expect_screen:
                contains: "Keys"
                stable_for: 200ms
            - send: { key: pagedown }
            - expect_screen:
                contains: ["like / remove like", "repost / remove repost"]
            - send: { key: pagedown }
            - send: { key: pagedown }
            - send: { key: pagedown }
            - send: { key: pagedown }
            - expect_screen:
                contains: "edit your profile"
            # Wait for the window itself to go before the next key, or Esc
            # followed by q reads as Alt+q.
            - send: { key: esc }
            - expect_screen:
                not_contains: ["Keys", "edit your profile"]
            - send: q
      - assert:
          exit_code: 0

  - name: pictures are kept on disk and the next start draws them without downloading
    mock_servers:
