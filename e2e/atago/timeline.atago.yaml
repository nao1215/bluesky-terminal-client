                      record: { $type: app.bsky.graph.defs#starterPackViewBasic, uri: "at://did:plc:bob/app.bsky.graph.starterpack/sp", cid: c3, record: { $type: app.bsky.graph.starterpack, name: "👨‍👩‍👧 家族 🇯🇵", list: "at://did:plc:bob/app.bsky.graph.list/sp", createdAt: "2026-09-20T08:00:00.000Z" }, creator: { did: did:plc:bob, handle: bob.test }, indexedAt: "2026-09-20T08:00:00.000Z" }
