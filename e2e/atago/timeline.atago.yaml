          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/q1
                    cid: cid-q1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Look at this one", createdAt: "2026-09-20T10:00:00.000Z" }
                    indexedAt: "2026-09-20T10:00:05.000Z"
                    embed:
                      $type: app.bsky.embed.recordWithMedia#view
                      record:
                        $type: app.bsky.embed.record#view
