                      record: { $type: app.bsky.graph.defs#listView, uri: "at://did:plc:bob/app.bsky.graph.list/rust", cid: c2, name: "Rustaceans 🦀", purpose: app.bsky.graph.defs#curatelist, creator: { did: did:plc:bob, handle: bob.test }, indexedAt: "2026-09-20T09:00:00.000Z" }
