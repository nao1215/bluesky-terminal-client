# Color themes: the picker (T), what is saved in settings.json, and what is
# never written.
#
# settings.json is written only when a theme is applied with Enter. Opening
# the picker, previewing, cancelling, a broken settings file, and `bsky logout`
# must leave it alone. COLORTERM is set so the colors are the theme's own
# 24-bit ones rather than their 256-color approximation.
version: "1"

suite:
  name: bsky themes

scenarios:
  - name: applying a theme saves it in settings.json
    mock_servers:
      - name: api
        routes:
          - &empty_timeline
            method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
    steps:
      - &session
        fixture:
          file: cfg/session.json
          content: |
            {"service": "${api.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          env: &env
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            COLORTERM: truecolor
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: T
            - expect_screen:
                # A window of ten themes, with more below it.
                contains: ["Theme", "▶ bluesky", "bluesky-dark", "bluesky-light", "terminal", "▼", "1/42  enter apply"]
                not_contains: ["zenburn", "▲"]
            # Two down is bluesky-light; the screen is already drawn in it.
            - send: j
            - send: j
            - expect_screen:
                contains: ["▶ bluesky-light", "3/42"]
            - send: { key: enter }
            - expect_screen:
                contains: "theme: bluesky-light"
                not_contains: "enter apply"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          file:
            path: cfg/settings.json
            json: { path: "$.theme", equals: "bluesky-light" }
      # The session file is untouched by a theme change.
      - assert:
          file:
            path: cfg/session.json
            json: { path: "$.accessJwt", equals: "acc" }

  - name: previewing and cancelling writes nothing
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: T
            - expect_screen:
                contains: "▶ bluesky"
            - send: j
            - expect_screen:
                contains: "▶ bluesky-dark"
            - send: { key: esc }
            - expect_screen:
                not_contains: "enter apply"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          file:
            path: cfg/settings.json
            exists: false

  - name: a saved theme is back on the next start
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
    steps:
      - *session
      - fixture:
          file: cfg/settings.json
          content: '{"theme": "nord", "keep": {"written by": "a newer bsky"}}'
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: T
            - expect_screen:
                contains: "▶ nord"
            # Applying another theme keeps what this bsky does not know about.
            - send: j
            - send: { key: enter }
            - expect_screen:
                contains: "theme: oceanic-next"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          file:
            path: cfg/settings.json
            json:
              - { path: "$.theme", equals: "oceanic-next" }
              - { path: "$.keep['written by']", equals: "a newer bsky" }

  - name: a broken settings file is reported, ignored, and left alone
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
    steps:
      - *session
      - fixture:
          file: cfg/settings.json
          content: "{broken"
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 160
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                # The message names the file by its full path, which the error
                # box wraps where it likes (macOS temporary paths are long).
                contains: ["No posts from accounts you follow yet", " Error ", "is not valid and was ignored"]
            # A theme can still be used, but saving it would lose the file.
            - send: T
            - expect_screen:
                contains: "▶ bluesky"
            - send: j
            - expect_screen:
                contains: "▶ bluesky-dark"
            - send: { key: enter }
            - expect_screen:
                contains: "theme: bluesky-dark for this session only"
            - send: q
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: []

  - name: an unknown theme name falls back to bluesky and says so
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
    steps:
      - *session
      - fixture:
          file: cfg/settings.json
          content: '{"theme": "neon"}'
      - pty:
          command: bsky
          graphics: kitty
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: 'unknown theme "neon"; using bluesky'
            - send: q
      - assert:
          exit_code: 0

  - name: NO_COLOR draws without color and keeps the picker closed
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
    steps:
      - *session
      - fixture:
          file: cfg/settings.json
          content: '{"theme": "dracula"}'
      - pty:
          command: bsky
          graphics: kitty
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            COLORTERM: truecolor
            NO_COLOR: "1"
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
                attrs:
                  # The saved dracula colors are not used: text keeps the
                  # terminal's own colors, and the active tab is marked by
                  # reverse video instead.
                  - { text: "No posts from accounts you follow yet", fg: default, bg: default }
                  - { text: "1 Timeline", reverse: true, fg: default }
            - send: T
            - expect_screen:
                contains: "colors are off because NO_COLOR is set"
                not_contains: "enter apply"
            - send: q
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: []

  - name: logout leaves the settings alone
    steps:
      - fixture:
          file: cfg/session.json
          content: '{"service": "https://pds.example", "did": "did:plc:me", "handle": "me.test", "accessJwt": "a", "refreshJwt": "r"}'
      - fixture:
          file: cfg/settings.json
          content: '{"theme": "nord"}'
      - run:
          command: bsky logout
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: [cfg/session.json]
