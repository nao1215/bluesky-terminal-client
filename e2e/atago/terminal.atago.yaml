# The terminal contract and the exit codes.
#
# bsky draws images with the terminal's own graphics protocol and refuses to
# start where there is none. Every failure class has its own exit code:
#
#   0  success
#   1  usage error (bad flag, bad --service, bad BSKY_GRAPHICS)
#   2  terminal unsupported (not a terminal, no image protocol)
#   3  local file error (unreadable session file)
#
# Network and server errors are shown inside the client and do not end it;
# login.atago.yaml and timeline.atago.yaml cover those.
#
# The pty scenarios use atago's `graphics: kitty` to stand in for a terminal
# that draws images; leaving it out is the terminal that cannot.
version: "1"

suite:
  name: bsky terminal and exit codes

scenarios:
  - name: help documents the image protocols, the text fallback, and the exit codes
    steps:
      - run:
          command: bsky --help
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            contains:
              - "kitty graphics, sixel, or iTerm2"
              - "On a terminal that supports none of them bsky runs as text"
              - "0 success, 1 usage error, 2 not an interactive terminal"
              - "3 local file error. Network and server errors are shown in the client"
              - "--service <URL>"
              - "logout"

  - name: version names the binary and a semantic version
    steps:
      - run:
          command: bsky --version
      - assert:
          exit_code: 0
          stdout:
            matches: '^bsky \d+\.\d+\.\d+\n$'

  - name: an unknown flag is a usage error that points at help
    steps:
      - run:
          command: bsky --no-such-flag
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            contains:
              - "error: unexpected argument '--no-such-flag'"
              - "hint: run `bsky --help` for usage"

  - name: a service URL without a scheme is a usage error
    steps:
      - run:
          command: bsky --service bsky.social
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            contains:
              - 'error: invalid service URL "bsky.social"'
              - "hint: pass an http:// or https:// URL"

  - name: BSKY_SERVICE is checked like --service
    steps:
      - run:
          command: bsky
          env:
            BSKY_SERVICE: "ftp://pds.example"
      - assert:
          exit_code: 1
          stderr:
            contains: 'error: invalid service URL "ftp://pds.example"'

  - name: without a terminal bsky refuses to start and touches nothing
    steps:
      - run:
          command: bsky
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            contains:
              - "error: bsky needs an interactive terminal"
              - "hint: run bsky directly in a terminal, not through a pipe or redirect"
          changes:
            created: []
            modified: []
            deleted: []

  # A terminal that answers no image protocol still gets the client, as
  # text: no avatar column, a line saying what a post carries instead of the
  # pictures, nothing downloaded to draw, and space opens the post on
  # bsky.app, where its pictures and video can be seen, instead of a viewer
  # this terminal cannot show. bsky itself stands in for the browser: the
  # opener is started and not waited for, so any program that exists will do.
  - name: a terminal that cannot draw images gets the client as text
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/p1
                    cid: cid-p1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, avatar: "${api.url}/img/a.png", viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    # No ZWJ sequence here: ConPTY draws only its first
                    # emoji. The unit tests cover them.
                    record: { text: "Two photos from the trip", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.images#view
                      images:
                        - { thumb: "${api.url}/img/1.png", fullsize: "${api.url}/img/1.png", alt: "山の頂上" }
                        - { thumb: "${api.url}/img/2.png", fullsize: "${api.url}/img/2.png", alt: "" }
                - post:
                    uri: at://did:plc:bob/app.bsky.feed.post/p2
                    cid: cid-p2
                    author: { did: did:plc:bob, handle: bob.test, displayName: Bob, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fb } }
                    record: { text: "A short clip", createdAt: "2026-09-20T09:00:00.000Z" }
                    embed: { $type: app.bsky.embed.video#view, playlist: "${api.url}/v/playlist.m3u8", thumbnail: "${api.url}/img/v.png", alt: "a cat" }
    steps:
      - fixture:
          file: cfg/session.json
          content: |
            {"service": "${api.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - pty:
          command: bsky
          rows: 30
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_BROWSER: bsky
            TZ: UTC
          timeout: 20s
          session:
            # The message goes after a few seconds: waited for on its own,
            # before the timeline, which a slow runner may draw later.
            - expect_screen:
                contains: "this terminal cannot show pictures; bsky runs without them"
            - expect_screen:
                contains:
                  - "Two photos from the trip"
                  - "▣ 2 pictures: 山の頂上"
                  - "▶ video: a cat"
                  - "space open in browser"
                not_contains: "space view"
            - send: " "
            - expect_screen:
                contains: "opened https://bsky.app/profile/did:plc:alice/post/p1"
            - send: "?"
            - expect_screen:
                contains: "open the post in the web browser"
                not_contains: "Viewer"
            - send: { key: esc }
            - expect_screen:
                not_contains: "open the post in the web browser"
            - send: q
      - assert:
          exit_code: 0
          screen:
            images: { count: 0 }
      # Nothing is downloaded to be drawn.
      - assert:
          mock: { name: api, path: /img/a.png, count: 0 }
      - assert:
          mock: { name: api, path: /img/1.png, count: 0 }

  - name: a kitty terminal is detected from its answer alone
    steps:
      - pty:
          command: bsky
          graphics: kitty
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
          timeout: 15s
          session:
            - expect_screen:
                contains: "Log in to Bluesky"
            - send: { key: esc }
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: []

  - name: BSKY_GRAPHICS forces a protocol on a terminal that does not answer
    steps:
      - pty:
          command: bsky
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_GRAPHICS: kitty
          timeout: 15s
          session:
            - expect_screen:
                contains: "Log in to Bluesky"
            - send: { key: esc }
      - assert:
          exit_code: 0

  - name: BSKY_GRAPHICS naming something that is not an image protocol is a usage error
    steps:
      - pty:
          command: bsky
          graphics: kitty
          cols: 200
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_GRAPHICS: halfblocks
          timeout: 15s
      - assert:
          exit_code: 1
          screen:
            contains:
              - 'error: BSKY_GRAPHICS="halfblocks" is not a graphics protocol'
              - "hint: set BSKY_GRAPHICS to kitty, sixel, or iterm2, or unset it"

  - name: a corrupt session file is a local-file error that names the way out
    steps:
      - fixture:
          file: cfg/session.json
          content: "{not json"
      - pty:
          command: bsky
          graphics: kitty
          cols: 200
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
          timeout: 15s
      - assert:
          exit_code: 3
          screen:
            contains:
              - "is not a valid session file"
              - "hint: run `bsky logout` to discard it and log in again"
          # The broken file is reported, not repaired or deleted behind the user's back.
          changes:
            created: []
            modified: []
            deleted: []

  - name: logout removes the saved session and nothing else, and is idempotent
    steps:
      - fixture:
          file: cfg/session.json
          content: |
            {"service": "https://pds.example", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - fixture:
          file: cfg/unrelated.txt
          content: "keep me\n"
      - run:
          command: bsky logout
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
      - assert:
          exit_code: 0
          stdout:
            equals: "logged out\n"
          stderr:
            empty: true
          changes:
            created: []
            modified: []
            deleted: [cfg/session.json]
      - run:
          command: bsky logout
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
      - assert:
          exit_code: 0
          stdout:
            equals: "not logged in\n"
          changes:
            created: []
            modified: []
            deleted: []
