# The terminal contract and the exit codes.
#
# bs draws images with the terminal's own graphics protocol and refuses to
# start where there is none. Every failure class has its own exit code:
#
#   0  success
#   1  usage error (bad flag, bad --service, bad BS_GRAPHICS)
#   2  terminal unsupported (not a terminal, no image protocol)
#   3  local file error (unreadable session file)
#
# Network and server errors are shown inside the client and do not end it;
# login.atago.yaml and timeline.atago.yaml cover those.
#
# The pty scenarios use atago's `graphics: kitty` to stand in for a terminal
# that draws images; leaving it out is the terminal that cannot.
version: "1"

suite:
  name: bs terminal and exit codes

scenarios:
  - name: help documents the image requirement and the exit codes
    steps:
      - run:
          command: bs --help
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            contains:
              - "kitty graphics, sixel, or iTerm2"
              - "exits with status 2 on a terminal that supports none of them"
              - "0 success, 1 usage error, 2 terminal unsupported"
              - "3 local file error. Network and server errors are shown in the client"
              - "--service <URL>"
              - "logout"

  - name: version names the binary and a semantic version
    steps:
      - run:
          command: bs --version
      - assert:
          exit_code: 0
          stdout:
            matches: '^bs \d+\.\d+\.\d+\n$'

  - name: an unknown flag is a usage error that points at help
    steps:
      - run:
          command: bs --no-such-flag
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            contains:
              - "error: unexpected argument '--no-such-flag'"
              - "hint: run `bs --help` for usage"

  - name: a service URL without a scheme is a usage error
    steps:
      - run:
          command: bs --service bsky.social
      - assert:
          exit_code: 1
          stdout:
            empty: true
          stderr:
            contains:
              - 'error: invalid service URL "bsky.social"'
              - "hint: pass an http:// or https:// URL"

  - name: BS_SERVICE is checked like --service
    steps:
      - run:
          command: bs
          env:
            BS_SERVICE: "ftp://pds.example"
      - assert:
          exit_code: 1
          stderr:
            contains: 'error: invalid service URL "ftp://pds.example"'

  - name: without a terminal bs refuses to start and touches nothing
    steps:
      - run:
          command: bs
          env:
            BS_CONFIG_DIR: ${workdir}/cfg
            BS_CACHE_DIR: ${workdir}/cache
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            contains:
              - "error: bs needs an interactive terminal"
              - "hint: run bs directly in a terminal, not through a pipe or redirect"
          changes:
            created: []
            modified: []
            deleted: []

  - name: a terminal that cannot draw images is refused before any request
    skip:
      os: windows
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
    steps:
      - fixture:
          file: cfg/session.json
          content: |
            {"service": "${api.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - pty:
          command: bs
          cols: 200
          env:
            BS_CONFIG_DIR: ${workdir}/cfg
            BS_CACHE_DIR: ${workdir}/cache
          timeout: 15s
      - assert:
          exit_code: 2
          screen:
            contains:
              - "error: this terminal cannot display images"
              - "hint: use a terminal with kitty graphics, sixel, or iTerm2 inline images"
              - "or set BS_GRAPHICS when yours supports one but does not answer the query"
      # Refusing means refusing up front: no timeline was requested.
      - assert:
          mock:
            name: api
            count: 0

  - name: a kitty terminal is detected from its answer alone
    skip:
      os: windows
    steps:
      - pty:
          command: bs
          graphics: kitty
          env:
            BS_CONFIG_DIR: ${workdir}/cfg
            BS_CACHE_DIR: ${workdir}/cache
          timeout: 15s
          session:
            - expect_screen:
                contains: "Log in to Bluesky"
            - send: { key: esc }
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: []

  - name: BS_GRAPHICS forces a protocol on a terminal that does not answer
    skip:
      os: windows
    steps:
      - pty:
          command: bs
          env:
            BS_CONFIG_DIR: ${workdir}/cfg
            BS_CACHE_DIR: ${workdir}/cache
            BS_GRAPHICS: kitty
          timeout: 15s
          session:
            - expect_screen:
                contains: "Log in to Bluesky"
            - send: { key: esc }
      - assert:
          exit_code: 0

  - name: BS_GRAPHICS naming something that is not an image protocol is a usage error
    skip:
      os: windows
    steps:
      - pty:
          command: bs
          graphics: kitty
          cols: 200
          env:
            BS_CONFIG_DIR: ${workdir}/cfg
            BS_CACHE_DIR: ${workdir}/cache
            BS_GRAPHICS: halfblocks
          timeout: 15s
      - assert:
          exit_code: 1
          screen:
            contains:
              - 'error: BS_GRAPHICS="halfblocks" is not a graphics protocol'
              - "hint: set BS_GRAPHICS to kitty, sixel, or iterm2, or unset it"

  - name: a corrupt session file is a local-file error that names the way out
    skip:
      os: windows
    steps:
      - fixture:
          file: cfg/session.json
          content: "{not json"
      - pty:
          command: bs
          graphics: kitty
          cols: 200
          env:
            BS_CONFIG_DIR: ${workdir}/cfg
            BS_CACHE_DIR: ${workdir}/cache
          timeout: 15s
      - assert:
          exit_code: 3
          screen:
            contains:
              - "is not a valid session file"
              - "hint: run `bs logout` to discard it and log in again"
          # The broken file is reported, not repaired or deleted behind the user's back.
          changes:
            created: []
            modified: []
            deleted: []

  - name: logout removes the saved session and nothing else, and is idempotent
    steps:
      - fixture:
          file: cfg/session.json
          content: |
            {"service": "https://pds.example", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - fixture:
          file: cfg/unrelated.txt
          content: "keep me\n"
      - run:
          command: bs logout
          env:
            BS_CONFIG_DIR: ${workdir}/cfg
            BS_CACHE_DIR: ${workdir}/cache
      - assert:
          exit_code: 0
          stdout:
            equals: "logged out\n"
          stderr:
            empty: true
          changes:
            created: []
            modified: []
            deleted: [cfg/session.json]
      - run:
          command: bs logout
          env:
            BS_CONFIG_DIR: ${workdir}/cfg
            BS_CACHE_DIR: ${workdir}/cache
      - assert:
          exit_code: 0
          stdout:
            equals: "not logged in\n"
          changes:
            created: []
            modified: []
            deleted: []
