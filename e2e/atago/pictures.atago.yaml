# Pictures from the user's disk: the browser that walks folders and previews
# the selected picture (ctrl+o), attaching up to four to a post with alt text,
# and choosing a new avatar the same way.
#
# bsky runs in the workdir, so the browser opens there: cfg/ (the session) and
# the pics/ folder each scenario sets up. The pictures are the solid-color
# PNGs of testdata, and a "picture" that is really text.
version: "1"

suite:
  name: bsky pictures

scenarios:
  - name: two pictures from two folders are posted with their alt text and shape
    mock_servers:
      - name: api
        routes:
          - &empty_timeline
            method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
          - &upload
            method: POST
            path: /xrpc/com.atproto.repo.uploadBlob
            json:
              blob: { $type: blob, ref: { $link: bafypic }, mimeType: image/png, size: 300 }
          - &create
            method: POST
            path: /xrpc/com.atproto.repo.createRecord
            json: { uri: "at://did:plc:me/app.bsky.feed.post/new", cid: "cid-new" }
    steps:
      - &session
        fixture:
          file: cfg/session.json
          content: |
            {"service": "${api.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - fixture:
          file: pics/photo.png
          from: testdata/photo.png
      - fixture:
          file: pics/sub/alice.png
          from: testdata/avatar-alice.png
      - fixture:
          file: pics/notes.txt
          content: "not a picture, and not listed"
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 110
          env: &env
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: n
            - expect_screen:
                contains: ["New post", "ctrl+o attach pictures or a video"]
            - send: "Two pictures"
            - send: { key: ctrl-o }
            # Folders first; the selection starts on the first of them.
            - expect_screen:
                contains: ["Attach pictures (up to 4) or a video", "../", "cfg/", "pics/", "enter opens the folder"]
            - send: j
            - send: { key: enter }
            # Only folders and pictures are listed.
            - expect_screen:
                contains: ["sub/", "photo.png"]
                not_contains: "notes.txt"
            - send: j
            # The picture is previewed, with its size.
            - expect_screen:
                contains: "120×90 ·"
                images: { count: 1 }
            - send: " "
            - expect_screen:
                contains: ["✓ photo.png", "1 marked"]
            # Into sub/, where the mark is kept.
            - send: k
            - send: { key: enter }
            - expect_screen:
                contains: ["alice.png", "100×100 ·"]
            - send: " "
            - expect_screen:
                contains: "2 marked"
            - send: { key: enter }
            # Back in the composer: a thumbnail and an alt text line for each.
            # Alice's 100x100 picture fills its 5-row thumbnail box; nothing
            # else is drawn at that size (the preview box is larger).
            - expect_screen:
                contains: ["1 photo.png  alt:", "2 alice.png  alt:", "(none; tab to describe it)"]
                not_contains: "Choose pictures"
                images:
                  contains:
                    - { width: 100, height: 100 }
            - send: { key: tab }
            - send: "a mountain"
            - send: { key: tab }
            - send: "Alice's avatar"
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "posted"
                not_contains: "New post"
            - send: q
      # The pictures are read and never changed; nothing else is written.
      - assert:
          exit_code: 0
          screen:
            images:
              contains:
                - { width: 100, height: 100, similar_to: testdata/avatar-alice.png, max_diff: 0.01 }
          changes:
            created: []
            modified: []
            deleted: []
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.uploadBlob
            method: POST
            count: 2
            header: { name: Content-Type, equals: "image/png" }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json:
                - { path: "$.record.text", equals: "Two pictures" }
                - { path: "$.record.embed['$type']", equals: "app.bsky.embed.images" }
                - { path: "$.record.embed.images", length: 2 }
                - { path: "$.record.embed.images[0].alt", equals: "a mountain" }
                - { path: "$.record.embed.images[0].aspectRatio.width", equals: 120 }
                - { path: "$.record.embed.images[0].aspectRatio.height", equals: 90 }
                - { path: "$.record.embed.images[0].image.ref['$link']", equals: "bafypic" }
                - { path: "$.record.embed.images[1].alt", equals: "Alice's avatar" }
                - { path: "$.record.embed.images[1].aspectRatio.width", equals: 100 }

  - name: four pictures at most, and one that cannot be read stops the post before any upload
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *upload
          - *create
    steps:
      - *session
      - fixture: { file: pics/p1.png, from: testdata/photo.png }
      - fixture: { file: pics/p2.png, from: testdata/avatar-alice.png }
      - fixture: { file: pics/p3.png, from: testdata/avatar-bob.png }
      - fixture: { file: pics/p4.png, from: testdata/new-avatar.png }
      - fixture:
          file: pics/broken.png
          content: "only text"
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 110
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: n
            - expect_screen:
                contains: "New post"
            - send: { key: ctrl-o }
            - expect_screen:
                contains: "pics/"
            - send: j
            - send: { key: enter }
            - expect_screen:
                contains: ["broken.png", "p4.png"]
            # Mark p1 to p4; a fifth has no room.
            - send: j
            - send: " "
            - send: " "
            - send: " "
            - send: " "
            - expect_screen:
                contains: "4 marked"
            - send: g
            - send: j
            - send: " "
            - expect_screen:
                contains: "4 marked; there is no room for more"
            - send: { key: enter }
            - expect_screen:
                contains: ["1 p1.png", "4 p4.png"]
            - send: { key: ctrl-o }
            - expect_screen:
                contains: "a post can have at most 4 pictures"
            # ctrl+x removes the last; the browser opens where it was.
            - send: { key: ctrl-x }
            - expect_screen:
                contains: "3 p3.png"
                not_contains: "4 p4.png"
            - send: { key: ctrl-o }
            - expect_screen:
                contains: ["Choose a picture", "broken.png"]
            - send: { key: enter }
            - expect_screen:
                contains: "4 broken.png"
            # No text is needed with pictures; the unreadable one is named.
            - send: { key: ctrl-s }
            # The message names the file by its full path, which the error
            # box wraps where it likes (Windows temporary paths are long),
            # so the words may sit on two lines between the box's borders.
            - expect_screen:
                contains: "New post"
                matches: 'is[\s│]+not[\s│]+a[\s│]+picture'
            # The draft and its pictures are still there.
            - expect_screen:
                contains: ["1 p1.png", "4 broken.png"]
                stable_for: 300ms
            - send: { key: esc }
            - expect_screen:
                not_contains: "New post"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.uploadBlob, count: 0 }
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.createRecord, count: 0 }

  - name: the avatar is chosen in the browser, hidden files on request, esc changes nothing
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - method: GET
            path: /xrpc/app.bsky.actor.getProfile
            json: { did: did:plc:me, handle: me.test, displayName: Me }
          - method: GET
            path: /xrpc/app.bsky.feed.getAuthorFeed
            json: { feed: [] }
          - method: GET
            path: /xrpc/com.atproto.repo.getRecord
            json:
              uri: at://did:plc:me/app.bsky.actor.profile/self
              cid: cid-profile-1
              value: { $type: app.bsky.actor.profile, displayName: Me }
          - method: POST
            path: /xrpc/com.atproto.repo.putRecord
            json: { uri: at://did:plc:me/app.bsky.actor.profile/self, cid: cid-profile-2 }
          - method: POST
            path: /xrpc/com.atproto.repo.uploadBlob
            json:
              blob: { $type: blob, ref: { $link: bafynewavatar }, mimeType: image/png, size: 178 }
    steps:
      - *session
      - fixture: { file: me.png, from: testdata/new-avatar.png }
      - fixture: { file: .hidden.png, from: testdata/avatar-bob.png }
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 110
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains: "this is you  [ e Edit profile ]  [ s Settings ]"
            - send: e
            - expect_screen:
                contains: ["New avatar (path, or ctrl+o to browse; optional)", "ctrl+o choose avatar"]
            # Esc leaves the browser and the field as they were.
            - send: { key: ctrl-o }
            - expect_screen:
                contains: ["Choose a picture", "me.png"]
                not_contains: ".hidden.png"
            - send: { key: esc }
            - expect_screen:
                contains: "╭ Edit profile"
                not_contains: "Choose a picture"
            - send: { key: ctrl-o }
            - expect_screen:
                contains: "Choose a picture"
            - send: "."
            - expect_screen:
                contains: [".hidden.png", "me.png"]
            - send: G
            - send: { key: enter }
            - expect_screen:
                contains: ["╭ Edit profile", "me.png"]
                not_contains: "Choose a picture"
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "profile updated"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.uploadBlob
            count: 1
            header: { name: Content-Type, equals: "image/png" }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.putRecord
            count: 1
            body:
              json: { path: "$.record.avatar.ref['$link']", equals: "bafynewavatar" }

  # On a small terminal the composer has no room for the thumbnails. The
  # names of the pictures still take their rows, so what the post carries is
  # on the screen before it is sent.
  - name: a composer too short for thumbnails still lists the pictures it will send
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *upload
          - *create
    steps:
      - *session
      - fixture:
          file: pics/photo.png
          from: testdata/photo.png
      - fixture:
          file: pics/alice.png
          from: testdata/avatar-alice.png
      - pty:
          command: bsky
          graphics: kitty
          rows: 10
          cols: 26
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from"
            - send: n
            - expect_screen:
                contains: "New post"
            - send: "Two"
            - send: { key: ctrl-o }
            - expect_screen:
                contains: "pics/"
            - send: j
            - send: { key: enter }
            - expect_screen:
                contains: "alice.png"
            - send: " "
            - send: j
            - send: " "
            - expect_screen:
                contains: "2 marked"
            - send: { key: enter }
            # Both names, and no thumbnail drawn: there is no room for one.
            - expect_screen:
                contains:
                  - "1 alice.png  alt:"
                  - "2 photo.png  alt:"
                images: { count: 0 }
                stable_for: 300ms
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "posted"
            - send: q
      - assert:
          exit_code: 0
      # What the screen listed is what the post carries.
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json:
                - { path: "$.record.embed.images", length: 2 }

  # A quote that carries a picture of its own is one embed with both, which
  # the lexicon calls recordWithMedia.
  - name: a quote with a picture is sent as one embed carrying both
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:bob/app.bsky.feed.post/theirs
                    cid: cid-theirs
                    author: { did: did:plc:bob, handle: bob.test, displayName: Bob, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fb } }
                    record: { text: "Bob wrote this", createdAt: "2026-09-20T10:00:00.000Z" }
                    indexedAt: "2026-09-20T10:00:05.000Z"
          - *upload
          - *create
    steps:
      - *session
      - fixture:
          file: pics/photo.png
          from: testdata/photo.png
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 110
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "Bob wrote this"
            - send: Q
            - expect_screen:
                contains: "Quote @bob.test"
            - send: "with a picture"
            - send: { key: ctrl-o }
            - expect_screen:
                contains: "pics/"
            - send: j
            - send: { key: enter }
            - expect_screen:
                contains: "photo.png"
            - send: " "
            - send: { key: enter }
            - expect_screen:
                contains: "1 photo.png  alt:"
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "posted"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json:
                - { path: "$.record.embed['$type']", equals: "app.bsky.embed.recordWithMedia" }
                - { path: "$.record.embed.record['$type']", equals: "app.bsky.embed.record" }
                - { path: "$.record.embed.record.record.uri", equals: "at://did:plc:bob/app.bsky.feed.post/theirs" }
                - { path: "$.record.embed.media['$type']", equals: "app.bsky.embed.images" }
                - { path: "$.record.embed.media.images", length: 1 }
