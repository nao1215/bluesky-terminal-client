# The viewer: space on a post opens its pictures full screen, or plays its
# video; Esc goes back to where you were.
#
# The video is played from its HLS playlist: testdata/hls is a master
# playlist, one variant, and one 1-second 64x36 H.264 segment, as Bluesky's
# video service serves them. bsky decodes it with the OpenH264 it is built
# with; nothing else needs to be installed. (atago counts every picture sent
# to the terminal, so the frames of the video add to the count.)
version: "1"

suite:
  name: bsky viewer

scenarios:
  - name: space shows a post's pictures full screen, one after another, and esc goes back
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/p1
                    cid: cid-p1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Two photos", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.images#view
                      images:
                        - { thumb: "${api.url}/img/thumb1.png", fullsize: "${api.url}/img/full1.png", alt: "The mountains", aspectRatio: { width: 4, height: 3 } }
                        - { thumb: "${api.url}/img/thumb2.png", fullsize: "${api.url}/img/full2.png", alt: "", aspectRatio: { width: 1, height: 1 } }
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/p2
                    cid: cid-p2
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Just words", createdAt: "2026-09-20T09:00:00.000Z" }
          - { method: GET, path: /img/thumb1.png, body_file: testdata/photo.png, header: { Content-Type: image/png } }
          - { method: GET, path: /img/thumb2.png, body_file: testdata/avatar-alice.png, header: { Content-Type: image/png } }
          - { method: GET, path: /img/full1.png, body_file: testdata/photo.png, header: { Content-Type: image/png } }
          - { method: GET, path: /img/full2.png, body_file: testdata/avatar-alice.png, header: { Content-Type: image/png } }
    steps:
      - &session
        fixture:
          file: cfg/accounts/did_plc_me.json
          content: |
            {"service": "${api.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: &env
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_DOWNLOAD_DIR: ${workdir}/downloads
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: "Two photos"
            - send: " "
            # The full-size picture, as large as the screen allows at 4:3:
            # 26 rows of 20 pixels make 520 high, so 693 wide (69 cells).
            - expect_screen:
                contains: ["1/2", "The mountains", "esc back"]
                not_contains: "Two photos"
                images:
                  contains:
                    - { width: 690, height: 520 }
            - send: l
            - expect_screen:
                contains: ["2/2", "(no alt text)", "d download"]
            # d saves the one shown, full size, in the download folder.
            - send: d
            - expect_screen:
                # The folder and the file are joined with the platform's
                # separator.
                matches: 'saved .+downloads[/\\]full2\.png'
            # Esc goes back to the timeline, where it was.
            - send: { key: esc }
            - expect_screen:
                contains: "Two photos"
                not_contains: "2/2"
            # A post without pictures says so and stays put.
            - send: j
            - send: " "
            - expect_screen:
                contains: "this post has no pictures, video, or link"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock: { name: api, path: /img/full1.png, count: 1 }
      # Shown and saved: fetched once to show it and once to save it.
      - assert:
          mock: { name: api, path: /img/full2.png, count: 2 }
      - assert:
          dir: { path: downloads, count: 1, contains: [full2.png] }
      - assert:
          image: { path: downloads/full2.png, width: 100, height: 100 }

  # What d saves is named by what it is, not by the address the post
  # gives: a picture at an address ending in .exe is saved as the picture
  # it is, and bytes that are no picture are not saved at all.
  - name: d saves a picture as what it is and refuses what is not a picture
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/x1
                    cid: cid-x1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Two odd pictures", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.images#view
                      images:
                        - { thumb: "${api.url}/img/setup.exe", fullsize: "${api.url}/img/setup.exe", alt: "a picture with a program's name", aspectRatio: { width: 1, height: 1 } }
                        - { thumb: "${api.url}/img/tool.exe", fullsize: "${api.url}/img/tool.exe", alt: "not a picture", aspectRatio: { width: 1, height: 1 } }
          - { method: GET, path: /img/setup.exe, body_file: testdata/avatar-alice.png, header: { Content-Type: application/octet-stream } }
          - { method: GET, path: /img/tool.exe, body: "MZ this is a program, not a picture", header: { Content-Type: application/octet-stream } }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "Two odd pictures"
            - send: " "
            - expect_screen:
                contains: ["1/2", "a picture with a program's name"]
            - send: d
            - expect_screen:
                matches: 'saved .+downloads[/\\]setup\.png'
            - send: l
            - expect_screen:
                contains: ["2/2", "not a picture"]
            - send: d
            - expect_screen:
                contains: [" Error ", "tool.exe is not a picture bsky can save; nothing was written"]
            - send: { key: esc }
            - expect_screen:
                not_contains: " Error "
            - send: { key: esc }
            - expect_screen:
                contains: "Two odd pictures"
                not_contains: "2/2"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          dir: { path: downloads, count: 1, contains: [setup.png] }
      - assert:
          image: { path: downloads/setup.png, width: 100, height: 100 }

  - name: space plays a post's video, r plays it again, and esc stops it
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/v1
                    cid: cid-v1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Watch this", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.video#view
                      cid: bafyvideo
                      playlist: "${api.url}/watch/v1/playlist.m3u8"
                      thumbnail: "${api.url}/watch/v1/thumbnail.png"
                      alt: "A test pattern"
                      aspectRatio: { width: 16, height: 9 }
          - { method: GET, path: /watch/v1/thumbnail.png, body_file: testdata/photo.png, header: { Content-Type: image/png } }
          - { method: GET, path: /watch/v1/playlist.m3u8, body_file: testdata/hls/playlist.m3u8, header: { Content-Type: application/vnd.apple.mpegurl } }
          - { method: GET, path: /watch/v1/v/video.m3u8, body_file: testdata/hls/v/video.m3u8, header: { Content-Type: application/vnd.apple.mpegurl } }
          - { method: GET, path: /watch/v1/v/seg0.ts, body_file: testdata/hls/v/seg0.ts, header: { Content-Type: video/mp2t } }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Watch this", "▶ video"]
            - send: " "
            # One second of video: it plays, then ends on its last picture.
            - expect_screen:
                contains: ["1/1", "A test pattern", "■ ended  r plays it again", "r replay"]
                # At least one picture of it. How many reach the screen
                # depends on the machine: a late one is skipped for the
                # newest, and a Windows runner or an instrumented build draws
                # only one or two of a one-second video. That it played to
                # the end is what "■ ended" says, and the segment counts
                # below say it was fetched.
                images: { min_count: 1 }
            - send: r
            - expect_screen:
                contains: "■ ended"
                stable_for: 1500ms
            # d saves the video: its segments joined in one .ts file.
            - send: d
            - expect_screen:
                matches: 'saved .+downloads[/\\]v1\.ts'
            - send: { key: esc }
            - expect_screen:
                contains: "Watch this"
                not_contains: "1/1"
            - send: q
      - assert:
          exit_code: 0
      # Played twice and saved once; the segment fetched each time.
      - assert:
          mock: { name: api, path: /watch/v1/playlist.m3u8, count: 3 }
      - assert:
          mock: { name: api, path: /watch/v1/v/seg0.ts, count: 3 }
      - assert:
          dir: { path: downloads, count: 1, contains: [v1.ts] }
      - assert:
          mock: { name: api, path: /watch/v1/v/video.m3u8, query: { name: session_id, equals: "t" } }

  - name: a video plays when its playlist names files the scheme-relative and dot-segment way
    # Bluesky serves plain relative URLs today, but a playlist may name a
    # file any way RFC 3986 allows: here the variant is scheme-relative
    # (//host/path) and the segment goes up a level and back down.
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/v2
                    cid: cid-v2
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Odd playlist", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.video#view
                      cid: bafyvideo
                      playlist: "${api.url}/watch/v2/playlist.m3u8"
                      thumbnail: "${api.url}/watch/v2/thumbnail.png"
                      alt: "A test pattern"
                      aspectRatio: { width: 16, height: 9 }
          - { method: GET, path: /watch/v2/thumbnail.png, body_file: testdata/photo.png, header: { Content-Type: image/png } }
          - method: GET
            path: /watch/v2/playlist.m3u8
            header: { Content-Type: application/vnd.apple.mpegurl }
            body: |
              #EXTM3U
              #EXT-X-VERSION:3
              #EXT-X-STREAM-INF:PROGRAM-ID=0,BANDWIDTH=550000,CODECS="avc1.42c00a",RESOLUTION=64x36
              //127.0.0.1:${api.port}/watch/v2/v/video.m3u8?session_id=t
          - method: GET
            path: /watch/v2/v/video.m3u8
            header: { Content-Type: application/vnd.apple.mpegurl }
            body: |
              #EXTM3U
              #EXT-X-VERSION:3
              #EXT-X-PLAYLIST-TYPE:VOD
              #EXT-X-TARGETDURATION:1
              #EXTINF:1.000,
              ../v/seg0.ts?dur=1
              #EXT-X-ENDLIST
          - { method: GET, path: /watch/v2/v/seg0.ts, body_file: testdata/hls/v/seg0.ts, header: { Content-Type: video/mp2t } }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Odd playlist", "▶ video"]
            - send: " "
            - expect_screen:
                contains: ["1/1", "A test pattern", "■ ended  r plays it again"]
                not_contains: "cannot load the video"
                # One picture at least; how many depends on the machine.
                images: { min_count: 1 }
            - send: { key: esc }
            - expect_screen:
                contains: "Odd playlist"
                not_contains: "1/1"
            - send: q
      - assert:
          exit_code: 0
      # Each file was asked for at the path RFC 3986 gives, not at a joined one.
      - assert:
          mock: { name: api, path: /watch/v2/playlist.m3u8, count: 1 }
      - assert:
          mock: { name: api, path: /watch/v2/v/video.m3u8, count: 1, query: { name: session_id, equals: "t" } }
      - assert:
          mock: { name: api, path: /watch/v2/v/seg0.ts, count: 1 }

  - name: a video bsky cannot play is a warning, not an error, and its thumbnail stays
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/v1
                    cid: cid-v1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Broken video", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.video#view
                      cid: bafyvideo
                      playlist: "${api.url}/watch/v1/playlist.m3u8"
                      thumbnail: "${api.url}/watch/v1/thumbnail.png"
                      aspectRatio: { width: 4, height: 3 }
          - { method: GET, path: /watch/v1/thumbnail.png, body_file: testdata/photo.png, header: { Content-Type: image/png } }
          - method: GET
            path: /watch/v1/playlist.m3u8
            status: 404
            body: "not found"
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 120
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "Broken video"
            - send: " "
            - expect_screen:
                contains: ["⚠ cannot load the video: HTTP 404; showing its thumbnail"]
                not_contains: " Error "
                images:
                  contains:
                    - { width: 690, height: 520 }
            - send: { key: esc }
            - expect_screen:
                contains: "Broken video"
            - send: q
      - assert:
          exit_code: 0

  - name: space on a post with only a link opens it in the browser, and o opens a link anywhere
    # A shell script stands in for the browser; Windows has its own
    # scenario with a batch file, next.
    skip:
      os: windows
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/l1
                    cid: cid-l1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record:
                      text: "Read this article"
                      createdAt: "2026-09-20T10:00:00.000Z"
                      facets:
                        - index: { byteStart: 0, byteEnd: 4 }
                          features: [ { $type: app.bsky.richtext.facet#link, uri: "https://example.com/in-text" } ]
                    embed:
                      $type: app.bsky.embed.external#view
                      external: { uri: "https://example.com/article?a=1&b=2", title: "An article", description: "" }
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/l2
                    cid: cid-l2
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record:
                      text: "A photo and a link"
                      createdAt: "2026-09-20T09:00:00.000Z"
                      facets:
                        - index: { byteStart: 0, byteEnd: 1 }
                          features: [ { $type: app.bsky.richtext.facet#link, uri: "https://example.com/photo-page" } ]
                    embed:
                      $type: app.bsky.embed.images#view
                      images: [ { thumb: "${api.url}/img/t.png", fullsize: "${api.url}/img/t.png", alt: "" } ]
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/l3
                    cid: cid-l3
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Nothing to open", createdAt: "2026-09-20T08:00:00.000Z" }
          - { method: GET, path: /img/t.png, body_file: testdata/photo.png, header: { Content-Type: image/png } }
    steps:
      - *session
      # Stands in for the browser: it writes down every URL it is given.
      - fixture:
          file: opener.sh
          mode: "0755"
          content: |
            #!/bin/sh
            printf '%s\n' "$@" >> "$(dirname "$0")/opened.txt"
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_BROWSER: ${workdir}/opener.sh
          timeout: 20s
          session:
            - expect_screen:
                contains: "Read this article"
            # No pictures: space opens the link card's URL.
            - send: " "
            - expect_screen:
                contains: "opened https://example.com/article?a=1&b=2"
            # Pictures: space shows them, and o opens the link instead.
            - send: j
            - send: o
            - expect_screen:
                contains: "opened https://example.com/photo-page"
            - send: j
            - send: " "
            - expect_screen:
                contains: "this post has no pictures, video, or link"
            - send: q
      - assert:
          exit_code: 0
      # One URL per line, whole (the & is not a shell's), in order.
      - assert:
          file:
            path: opened.txt
            contains: "https://example.com/article?a=1&b=2\nhttps://example.com/photo-page\n"

  - name: on Windows, space and o open links with the program BSKY_BROWSER names
    only:
      os: windows
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/l1
                    cid: cid-l1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record:
                      text: "Read this article"
                      createdAt: "2026-09-20T10:00:00.000Z"
                      facets:
                        - index: { byteStart: 0, byteEnd: 4 }
                          features: [ { $type: app.bsky.richtext.facet#link, uri: "https://example.com/in-text" } ]
                    embed:
                      $type: app.bsky.embed.external#view
                      external: { uri: "https://example.com/article?a=1&b=2", title: "An article", description: "" }
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/l2
                    cid: cid-l2
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record:
                      text: "A photo and a link"
                      createdAt: "2026-09-20T09:00:00.000Z"
                      facets:
                        - index: { byteStart: 0, byteEnd: 1 }
                          features: [ { $type: app.bsky.richtext.facet#link, uri: "https://example.com/photo-page" } ]
                    embed:
                      $type: app.bsky.embed.images#view
                      images: [ { thumb: "${api.url}/img/t.png", fullsize: "${api.url}/img/t.png", alt: "" } ]
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/l3
                    cid: cid-l3
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Nothing to open", createdAt: "2026-09-20T08:00:00.000Z" }
          - { method: GET, path: /img/t.png, body_file: testdata/photo.png, header: { Content-Type: image/png } }
    steps:
      - *session
      # Stands in for the browser: it writes down every URL it is given.
      - fixture:
          file: opener.cmd
          content: |
            @echo off
            setlocal enabledelayedexpansion
            rem Delayed expansion keeps cmd from reading the & in a URL.
            set "url=%~1"
            >>"%~dp0opened.txt" echo(!url!
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_BROWSER: ${workdir}/opener.cmd
          timeout: 20s
          session:
            - expect_screen:
                contains: "Read this article"
            # No pictures: space opens the link card's URL.
            - send: " "
            - expect_screen:
                contains: "opened https://example.com/article?a=1&b=2"
            # Pictures: space shows them, and o opens the link instead.
            - send: j
            - send: o
            - expect_screen:
                contains: "opened https://example.com/photo-page"
            - send: j
            - send: " "
            - expect_screen:
                contains: "this post has no pictures, video, or link"
            - send: q
      - assert:
          exit_code: 0
      # Each URL whole (cmd ends its lines with CRLF).
      - assert:
          file:
            path: opened.txt
            contains: "https://example.com/article?a=1&b=2\r\nhttps://example.com/photo-page\r\n"

  - name: without a program to open links, it says what to set
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/l1
                    cid: cid-l1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Read this article", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.external#view
                      external: { uri: "https://example.com/article", title: "An article", description: "" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_BROWSER: ${workdir}/no-such-browser
          timeout: 20s
          session:
            - expect_screen:
                contains: "Read this article"
            - send: o
            - expect_screen:
                contains: [" Error ", "cannot open the link", "no-such-browser", "hint: set BSKY_BROWSER, or Browser on the settings screen"]
            - send: q
      - assert:
          exit_code: 0

  - name: a browser typed on the settings screen opens the links
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/l1
                    cid: cid-l1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Read this article", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.external#view
                      external: { uri: "https://example.com/article", title: "An article", description: "" }
          - method: GET
            path: /xrpc/app.bsky.actor.getProfile
            json: { did: did:plc:me, handle: me.test, displayName: "Me" }
          - method: GET
            path: /xrpc/app.bsky.feed.getAuthorFeed
            json: { feed: [] }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
          timeout: 20s
          session:
            - expect_screen:
                contains: "Read this article"
            - send: "5"
            - expect_screen:
                contains: "[ s Settings ]"
            - send: s
            - send: k
            - send: k
            - expect_screen:
                contains: ["▶ Browser", "the default; enter types the program that opens links"]
            - send: { key: enter }
            # A name without a folder, looked up on PATH: short enough that
            # the error box never wraps it, however deep the work folder is.
            - send: "ブラウザ🦊"
            - send: { key: enter }
            - expect_screen:
                contains: ["browser: ", "ブラウザ🦊", "x goes back to the default"]
            - send: { key: esc }
            - expect_screen:
                not_contains: "Picture cache"
            - send: "1"
            - send: o
            # The program named on the screen is the one tried.
            - expect_screen:
                contains: [" Error ", "cannot open the link: ブラウザ🦊 was not found"]
            - send: q
      - assert:
          exit_code: 0
      - assert:
          file:
            path: cfg/settings.json
            json: { path: "$.browser", equals: "ブラウザ🦊" }

  - name: without BSKY_DOWNLOAD_DIR a picture is saved under the home download folder
    # The platform download folder is the home one on Linux and macOS, so
    # HOME decides it here. On Windows it comes from the shell's known
    # folders, which no environment variable moves, so this runs on the
    # other two; the default itself is unit-tested everywhere.
    skip:
      os: windows
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/p9
                    cid: cid-p9
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "One photo", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.images#view
                      images:
                        - { thumb: "${api.url}/img/t.png", fullsize: "${api.url}/img/full.png", alt: "The lake", aspectRatio: { width: 1, height: 1 } }
          - { method: GET, path: /img/t.png, body_file: testdata/avatar-alice.png, header: { Content-Type: image/png } }
          - { method: GET, path: /img/full.png, body_file: testdata/avatar-alice.png, header: { Content-Type: image/png } }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            HOME: ${workdir}/home
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: "One photo"
            - send: " "
            - expect_screen:
                contains: ["1/1", "The lake"]
            - send: d
            # The path is too long to fit the status line on a runner whose
            # temporary folder is deep, so where the file went is asserted
            # below instead of on screen.
            - expect_screen:
                contains: "saved "

            - send: { key: esc }
            - expect_screen:
                contains: "One photo"
                not_contains: "1/1"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          dir: { path: home/Downloads/bsky, count: 1, contains: [full.png] }
      - assert:
          image: { path: home/Downloads/bsky/full.png, width: 100, height: 100 }

  # The download folder can be chosen on the settings screen, in a browser
  # that lists folders only; the next d saves there. It opens at the folder
  # set now: settings.json names one here, so where it opens does not depend
  # on the platform's own download folder. The name is relative to where
  # bsky runs: a Windows path would need its backslashes escaped in JSON.
  - name: a download folder chosen on the settings screen is where d saves
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/p9
                    cid: cid-p9
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "One photo", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.images#view
                      images:
                        - { thumb: "${api.url}/img/t.png", fullsize: "${api.url}/img/full.png", alt: "The lake", aspectRatio: { width: 1, height: 1 } }
          - { method: GET, path: /img/t.png, body_file: testdata/avatar-alice.png, header: { Content-Type: image/png } }
          - { method: GET, path: /img/full.png, body_file: testdata/avatar-alice.png, header: { Content-Type: image/png } }
          - method: GET
            path: /xrpc/app.bsky.actor.getProfile
            json: { did: did:plc:me, handle: me.test, displayName: "Me" }
          - method: GET
            path: /xrpc/app.bsky.feed.getAuthorFeed
            json: { feed: [] }
    steps:
      - *session
      - fixture:
          file: cfg/settings.json
          content: |
            {"download_dir": "first", "theme": "nord"}
      - fixture: { file: first/keep.txt, content: "the folder settings.json names" }
      - fixture: { file: first-写真👨‍👩‍👧/keep.txt, content: "the folder to choose" }
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: "One photo"
            - send: "5"
            - expect_screen:
                contains: "[ s Settings ]"
            - send: s
            - send: j
            - send: j
            - expect_screen:
                contains: ["▶ Download folder", "x goes back to the default"]
            - send: { key: enter }
            # Folders only, opened at the one set now.
            - expect_screen:
                matches: '[/\\]first\s'
                contains: ["Choose a folder", "space choose this folder"]
                not_contains: "keep.txt"
            # Up, where the selection is on the folder it came from; the
            # next one is the folder to choose.
            - send: h
            - send: j
            - send: { key: enter }
            - expect_screen:
                contains: "first-写真👨‍👩‍👧"
            - send: " "
            - expect_screen:
                contains: "download folder: "
                not_contains: "Choose a folder"
            - send: { key: esc }
            - expect_screen:
                not_contains: "Picture cache"
            - send: "1"
            - send: " "
            - expect_screen:
                contains: ["1/1", "The lake"]
            - send: d
            - expect_screen:
                contains: "saved "
            - send: { key: esc }
            - expect_screen:
                not_contains: "1/1"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          dir: { path: "first-写真👨‍👩‍👧", contains: [full.png] }
      - assert:
          image: { path: "first-写真👨‍👩‍👧/full.png", width: 100, height: 100 }
      - assert:
          dir: { path: first, count: 1 }
      # The folder is kept, beside what the file already held.
      - assert:
          file:
            path: cfg/settings.json
            json:
              - { path: "$.download_dir", matches: 'first-写真👨‍👩‍👧$' }
              - { path: "$.theme", equals: "nord" }
