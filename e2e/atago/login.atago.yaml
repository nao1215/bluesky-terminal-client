# Logging in (with the account's password or an app password), and the
# session file it leaves behind.
#
# The Bluesky PDS is an atago mock server, reached through --service, so the
# suite needs no account and no network. The password below is a throwaway
# value the mock accepts; it is masked in reports all the same.
version: "1"

suite:
  name: bsky login

secrets:
  - app-pass-1234

scenarios:
  - name: logging in saves the session and loads the timeline with its token
    mock_servers:
      - name: api
        routes:
          - method: POST
            path: /xrpc/com.atproto.server.createSession
            json: { did: "did:plc:me", handle: "me.test", accessJwt: "acc-1", refreshJwt: "ref-1" }
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
    steps:
      - pty:
          command: bsky --service ${api.url}
          graphics: kitty
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
          timeout: 20s
          session:
            # The service field starts filled in from --service, and focus
            # starts on the identifier.
            - expect_screen:
                contains: ["Log in to Bluesky", "${api.url}", "an app password is safer", "unofficial client"]
            - send: "me.test"
            - send: { key: enter }
            - send: "app-pass-1234"
            # The password field shows bullets, never the password.
            - expect_screen:
                contains: "•••••••••••••"
                not_contains: "app-pass-1234"
            - send: { key: enter }
            - expect_screen:
                contains: ["No posts from accounts you follow yet", "@me.test", "logged in as @me.test"]
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.server.createSession
            method: POST
            count: 1
            body:
              json:
                - { path: "$.identifier", equals: "me.test" }
                - { path: "$.password", equals: "app-pass-1234" }
      # The token from createSession is what the next request carries.
      - assert:
          mock:
            name: api
            path: /xrpc/app.bsky.feed.getTimeline
            method: GET
            count: 1
            header: { name: Authorization, equals: "Bearer acc-1" }
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            json:
              - { path: "$.service", equals: "${api.url}" }
              - { path: "$.did", equals: "did:plc:me" }
              - { path: "$.handle", equals: "me.test" }
              - { path: "$.accessJwt", equals: "acc-1" }
              - { path: "$.refreshJwt", equals: "ref-1" }
      # The password itself is never stored, only the tokens.
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            not_contains: "app-pass-1234"

  - name: a saved session skips the login screen on the next start
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
    steps:
      - fixture:
          file: cfg/accounts/did_plc_me.json
          content: |
            {"service": "${api.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc-9", "refreshJwt": "ref-9"}
      - pty:
          command: bsky
          graphics: kitty
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
                not_contains: "Log in to Bluesky"
            - send: q
      - assert:
          exit_code: 0
      # The session's own service is used, whatever --service says.
      - assert:
          mock:
            name: api
            path: /xrpc/app.bsky.feed.getTimeline
            count: 1
            header: { name: Authorization, equals: "Bearer acc-9" }

  - name: rejected credentials keep the form open and save nothing
    mock_servers:
      - name: api
        routes:
          - method: POST
            path: /xrpc/com.atproto.server.createSession
            status: 401
            json: { error: "AuthenticationRequired", message: "Invalid identifier or password" }
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
    steps:
      - pty:
          command: bsky --service ${api.url}
          graphics: kitty
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
          timeout: 20s
          session:
            - expect_screen:
                contains: "Log in to Bluesky"
            - send: "me.test"
            - send: { key: enter }
            - send: "wrong-password"
            - send: { key: enter }
            - expect_screen:
                contains: "AuthenticationRequired: Invalid identifier or password"
            # A second attempt is possible: the form is still live. The old
            # error is on screen until the answer arrives, so wait for the
            # frame to settle rather than for the text alone.
            - send: { key: enter }
            - expect_screen:
                contains: "AuthenticationRequired: Invalid identifier or password"
                not_contains: "logging in"
                stable_for: 500ms
            - send: { key: esc }
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.server.createSession
            count: 2
      - assert:
          mock:
            name: api
            path: /xrpc/app.bsky.feed.getTimeline
            count: 0
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            exists: false

  - name: an empty field is caught before anything is sent
    mock_servers:
      - name: api
        routes:
          - method: POST
            path: /xrpc/com.atproto.server.createSession
            json: { did: "did:plc:me", handle: "me.test", accessJwt: "a", refreshJwt: "r" }
    steps:
      - pty:
          command: bsky --service ${api.url}
          graphics: kitty
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
          timeout: 20s
          session:
            - expect_screen:
                contains: "Log in to Bluesky"
            # Enter on the empty identifier moves on; Enter on the empty
            # password tries to submit and is refused.
            - send: { key: enter }
            - send: { key: enter }
            - expect_screen:
                contains: "fill in all three fields"
            - send: { key: esc }
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            count: 0

  - name: an unreachable server is reported on the form
    steps:
      - pty:
          # Port 9 (discard) on loopback: nothing listens there.
          command: bsky --service http://127.0.0.1:9
          graphics: kitty
          cols: 120
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
          timeout: 40s
          session:
            - expect_screen:
                contains: "Log in to Bluesky"
            - send: "me.test"
            - send: { key: enter }
            - send: "app-pass-1234"
            - send: { key: enter }
            - expect_screen:
                contains: "com.atproto.server.createSession: cannot reach the server"
            - send: { key: esc }
      - assert:
          exit_code: 0
          changes:
            created: []
            modified: []
            deleted: []

  # Several accounts. Each has its own server here, so what each sees and
  # which token each sends shows which account is in use.
  - name: a second account is logged in from the account list, and A switches between them
    mock_servers:
      - name: home
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:me/app.bsky.feed.post/h1
                    cid: cid-h1
                    author: { did: did:plc:me, handle: me.test, displayName: Me }
                    record: { text: "Seen by the personal account 👨‍👩‍👧", createdAt: "2026-09-20T10:00:00.000Z" }
      - name: work
        routes:
          - method: POST
            path: /xrpc/com.atproto.server.createSession
            json: { did: "did:plc:work", handle: "work.example", accessJwt: "acc-work", refreshJwt: "ref-work" }
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:work/app.bsky.feed.post/w1
                    cid: cid-w1
                    author: { did: did:plc:work, handle: work.example, displayName: Work }
                    record: { text: "Seen by the work account 🇯🇵", createdAt: "2026-09-20T10:00:00.000Z" }
    steps:
      # A login of a version with one account: it becomes the first account.
      - fixture:
          file: cfg/session.json
          content: |
            {"service": "${home.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: &accounts_env
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: "Seen by the personal account 👨‍👩‍👧"
            - send: A
            - expect_screen:
                contains: [" Accounts ", "▶ @me.test  in use", "a log in another  x log out"]
            - send: a
            # The form starts on the handle, with the service in use above it.
            - expect_screen:
                contains: ["Log in to Bluesky", "esc back"]
            - send: { key: backtab }
            - send: { key: ctrl-u }
            - send: "${work.url}"
            - send: { key: tab }
            - send: "work.example"
            - send: { key: tab }
            - send: "app-pass-work"
            - send: { key: enter }
            # The new account is in use, and the tabs name it now that there
            # are two.
            - expect_screen:
                contains: ["Seen by the work account 🇯🇵", "@work.example"]
                not_contains: ["Seen by the personal account", "Log in to Bluesky"]
            - send: A
            - expect_screen:
                contains: ["@me.test", "▶ @work.example  in use"]
            - send: k
            - send: { key: enter }
            - expect_screen:
                contains: ["Seen by the personal account 👨‍👩‍👧", "@me.test"]
                not_contains: "Seen by the work account"
            - send: q
      - assert:
          exit_code: 0
      # Each server was read with its own account's token.
      - assert:
          mock: { name: home, path: /xrpc/app.bsky.feed.getTimeline, header: { name: Authorization, equals: "Bearer acc" } }
      - assert:
          mock: { name: work, path: /xrpc/app.bsky.feed.getTimeline, count: 1, header: { name: Authorization, equals: "Bearer acc-work" } }
      - assert:
          mock: { name: home, path: /xrpc/app.bsky.feed.getTimeline, count: 2 }
      # One file per account, owner-only; the old file is gone, and the
      # account last switched to is the one in use.
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            json: { path: "$.accessJwt", equals: "acc" }
      - assert:
          file:
            path: cfg/accounts/did_plc_work.json
            json:
              - { path: "$.accessJwt", equals: "acc-work" }
              - { path: "$.service", equals: "${work.url}" }
      - assert:
          file:
            path: cfg/accounts.json
            json: { path: "$.current", equals: "did:plc:me" }
      - assert:
          file:
            path: cfg/session.json
            exists: false

  - name: -a starts on the account it names without changing the one in use, and an unknown one is a usage error
    mock_servers:
      - name: work
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:work/app.bsky.feed.post/w1
                    cid: cid-w1
                    author: { did: did:plc:work, handle: work.example, displayName: Work }
                    record: { text: "Seen by the work account", createdAt: "2026-09-20T10:00:00.000Z" }
    steps:
      - &two_accounts_me
        fixture:
          file: cfg/accounts/did_plc_me.json
          content: |
            {"service": "http://127.0.0.1:9", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - &two_accounts_work
        fixture:
          file: cfg/accounts/did_plc_work.json
          content: |
            {"service": "${work.url}", "did": "did:plc:work", "handle": "work.example", "accessJwt": "acc-work", "refreshJwt": "ref-work"}
      - &two_accounts_current
        fixture:
          file: cfg/accounts.json
          content: |
            {"current": "did:plc:me"}
      - pty:
          command: bsky -a @Work.Example
          graphics: kitty
          rows: 30
          cols: 100
          env: *accounts_env
          timeout: 20s
          session:
            - expect_screen:
                contains: ["Seen by the work account", "@work.example"]
            - send: q
      - assert:
          exit_code: 0
          changes:
            modified: []
            deleted: []
      - run:
          command: bsky -a nobody.test
          env: *accounts_env
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "error: nobody.test is not logged in"
              - "hint: logged in: @me.test, @work.example"

  - name: logout logs one account out and keeps the other, and --all logs every one out
    steps:
      - *two_accounts_me
      - *two_accounts_work
      - *two_accounts_current
      - run:
          command: bsky logout -a work.example
          env: *accounts_env
      - assert:
          exit_code: 0
          stdout:
            equals: "logged out @work.example\n"
          changes:
            created: []
            modified: []
            deleted: [cfg/accounts/did_plc_work.json]
      - run:
          command: bsky logout --all
          env: *accounts_env
      - assert:
          exit_code: 0
          stdout:
            equals: "logged out @me.test\n"
      - assert:
          file:
            path: cfg/accounts/did_plc_me.json
            exists: false
      - run:
          command: bsky logout
          env: *accounts_env
      - assert:
          exit_code: 0
          stdout:
            equals: "not logged in\n"

  # Writes run one after another, so a like can wait behind a slow write
  # while the account is switched. It is still sent as the account in use
  # when it was pressed, never as the one switched to.
  - name: a write waiting behind a slow one is sent as the account it was pressed on, after a switch
    mock_servers:
      - name: home
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/a1
                    cid: cid-a1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: "at://did:plc:me/app.bsky.graph.follow/f1" } }
                    record: { text: "Liked and reposted from home 🇯🇵", createdAt: "2026-09-20T10:00:00.000Z" }
          - method: POST
            path: /xrpc/com.atproto.repo.createRecord
            delay: 3s
            json: { uri: "at://did:plc:me/app.bsky.feed.like/l1", cid: "cid-l1" }
      - name: work
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:work/app.bsky.feed.post/w1
                    cid: cid-w1
                    author: { did: did:plc:work, handle: work.example, displayName: Work }
                    record: { text: "Seen by the work account", createdAt: "2026-09-20T10:00:00.000Z" }
          - method: POST
            path: /xrpc/com.atproto.repo.createRecord
            json: { uri: "at://did:plc:work/app.bsky.feed.repost/r1", cid: "cid-r1" }
    steps:
      - fixture:
          file: cfg/accounts/did_plc_me.json
          content: |
            {"service": "${home.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - *two_accounts_work
      - *two_accounts_current
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *accounts_env
          timeout: 25s
          session:
            - expect_screen:
                contains: "Liked and reposted from home 🇯🇵"
            # The like takes three seconds; the repost waits behind it.
            - send: l
            - send: b
            - send: A
            - expect_screen:
                contains: "▶ @me.test  in use"
            - send: j
            - send: { key: enter }
            - expect_screen:
                contains: "Seen by the work account"
            # Both writes are answered, by the first account's server.
            - expect_screen:
                contains: "Seen by the work account"
                not_contains: "loading…"
                timeout: 10s
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: home
            path: /xrpc/com.atproto.repo.createRecord
            count: 2
            header: { name: Authorization, equals: "Bearer acc" }
      - assert:
          mock:
            name: home
            path: /xrpc/com.atproto.repo.createRecord
            count: 2
            body:
              json: { path: "$.repo", equals: "did:plc:me" }
      - assert:
          mock:
            name: work
            path: /xrpc/com.atproto.repo.createRecord
            count: 0
