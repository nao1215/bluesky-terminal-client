# The Profile tab and the profile editor.
#
# Saving rewrites the whole app.bsky.actor.profile record, so the contract is
# as much about what is kept (fields bsky does not edit, the avatar when no new
# one is given) as about what changes. The write is guarded with swapRecord so
# it cannot silently overwrite an edit made elsewhere in the meantime.
version: "1"

suite:
  name: bsky profile

scenarios:
  - name: the Profile tab shows the account itself
    mock_servers:
      - name: api
        routes:
          - &empty_timeline
            method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json: { feed: [] }
          - &own_profile
            method: GET
            path: /xrpc/app.bsky.actor.getProfile
            json:
              did: did:plc:me
              handle: me.test
              displayName: "Old Name"
              description: "old bio"
              followersCount: 12
              followsCount: 3
              postsCount: 42
          - &own_feed
            method: GET
            path: /xrpc/app.bsky.feed.getAuthorFeed
            json:
              feed:
                - post:
                    uri: at://did:plc:me/app.bsky.feed.post/m1
                    cid: cid-m1
                    author: { did: did:plc:me, handle: me.test, displayName: "Old Name" }
                    record: { text: "My first post", createdAt: "2026-09-01T00:00:00.000Z" }
    steps:
      - &session
        fixture:
          file: cfg/session.json
          content: |
            {"service": "${api.url}", "did": "did:plc:me", "handle": "me.test", "accessJwt": "acc", "refreshJwt": "ref"}
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: &env
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains:
                  - "Old Name"
                  - "@me.test"
                  - "12 followers  3 following  42 posts"
                  - "this is you  [ e Edit profile ]  [ s Settings ]"
                  - "old bio"
                  - "My first post"
                not_contains: "(f to toggle)"
            # There is no following yourself.
            - send: f
            - expect_screen:
                contains: "you cannot follow yourself"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock: { name: api, path: /xrpc/app.bsky.actor.getProfile, count: 1, query: { name: actor, equals: "did:plc:me" } }
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.createRecord, count: 0 }

  - name: saving keeps the fields bsky does not edit and guards the write with swapRecord
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *own_profile
          - *own_feed
          - &own_record
            method: GET
            path: /xrpc/com.atproto.repo.getRecord
            json:
              uri: at://did:plc:me/app.bsky.actor.profile/self
              cid: cid-profile-1
              value:
                $type: app.bsky.actor.profile
                displayName: "Old Name"
                description: "old bio"
                avatar: { $type: blob, ref: { $link: bafyavatar }, mimeType: image/jpeg, size: 1000 }
                banner: { $type: blob, ref: { $link: bafybanner }, mimeType: image/jpeg, size: 2000 }
                pinnedPost: { uri: at://did:plc:me/app.bsky.feed.post/m1, cid: cid-m1 }
          - &put_record
            method: POST
            path: /xrpc/com.atproto.repo.putRecord
            json: { uri: at://did:plc:me/app.bsky.actor.profile/self, cid: cid-profile-2 }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains: "this is you  [ e Edit profile ]  [ s Settings ]"
            - send: e
            # The editor starts from the stored record, not from the view.
            - expect_screen:
                contains: ["╭ Edit profile", "Display name", "Old Name", "old bio", "New avatar (path, or ctrl+o to browse; optional)"]
            # Ctrl+U clears the field; the description is left as it is.
            - send: { key: ctrl-u }
            - send: "新しい名前"
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "profile updated"
                not_contains: "╭ Edit profile"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.getRecord
            count: 1
            query: { name: collection, equals: "app.bsky.actor.profile" }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.getRecord
            query: { name: rkey, equals: "self" }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.putRecord
            method: POST
            count: 1
            body:
              json:
                - { path: "$.repo", equals: "did:plc:me" }
                - { path: "$.collection", equals: "app.bsky.actor.profile" }
                - { path: "$.rkey", equals: "self" }
                - { path: "$.swapRecord", equals: "cid-profile-1" }
                - { path: "$.record.displayName", equals: "新しい名前" }
                - { path: "$.record.description", equals: "old bio" }
                - { path: "$.record['$type']", equals: "app.bsky.actor.profile" }
                - { path: "$.record.avatar.ref['$link']", equals: "bafyavatar" }
                - { path: "$.record.banner.ref['$link']", equals: "bafybanner" }
                - { path: "$.record.pinnedPost.uri", equals: "at://did:plc:me/app.bsky.feed.post/m1" }
      # No new avatar was given, so nothing was uploaded.
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.uploadBlob, count: 0 }
      # The profile is reloaded after saving.
      - assert:
          mock: { name: api, path: /xrpc/app.bsky.actor.getProfile, count: 2 }

  - name: a cleared description is removed from the record, not saved empty
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *own_profile
          - *own_feed
          - *own_record
          - *put_record
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains: "this is you  [ e Edit profile ]  [ s Settings ]"
            - send: e
            # The avatar field appears once the stored record has loaded; "old
            # bio" alone would also match the profile behind the editor.
            - expect_screen:
                contains: ["New avatar (path, or ctrl+o to browse; optional)", "old bio"]
            - send: { key: tab }
            - send: { key: ctrl-u }
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "profile updated"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.putRecord
            count: 1
            body:
              not_contains: '"description"'
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.putRecord
            body:
              json: { path: "$.record.displayName", equals: "Old Name" }

  - name: a new avatar is uploaded first and the record points at the uploaded blob
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *own_profile
          - *own_feed
          - *own_record
          - *put_record
          - method: POST
            path: /xrpc/com.atproto.repo.uploadBlob
            json:
              blob: { $type: blob, ref: { $link: bafynewavatar }, mimeType: image/png, size: 178 }
    steps:
      - *session
      - fixture:
          file: me.png
          from: testdata/new-avatar.png
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains: "this is you  [ e Edit profile ]  [ s Settings ]"
            - send: e
            # The avatar field appears once the stored record has loaded; "old
            # bio" alone would also match the profile behind the editor.
            - expect_screen:
                contains: ["New avatar (path, or ctrl+o to browse; optional)", "old bio"]
            - send: { key: tab }
            - send: { key: tab }
            - send: "me.png"
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "profile updated"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.uploadBlob
            method: POST
            count: 1
            header: { name: Content-Type, equals: "image/png" }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.putRecord
            count: 1
            body:
              json:
                - { path: "$.record.avatar.ref['$link']", equals: "bafynewavatar" }
                - { path: "$.record.avatar.mimeType", equals: "image/png" }
                - { path: "$.record.banner.ref['$link']", equals: "bafybanner" }
      # The avatar file is read, never changed or moved.
      - assert:
          file:
            path: me.png
            exists: true

  - name: a file that is not a picture is refused as an avatar before anything is uploaded
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *own_profile
          - *own_feed
          - *own_record
          - *put_record
    steps:
      - *session
      - fixture:
          file: notes.txt
          content: "not an image\n"
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains: "this is you  [ e Edit profile ]  [ s Settings ]"
            - send: e
            # The avatar field appears once the stored record has loaded; "old
            # bio" alone would also match the profile behind the editor.
            - expect_screen:
                contains: ["New avatar (path, or ctrl+o to browse; optional)", "old bio"]
            - send: { key: tab }
            - send: { key: tab }
            - send: "notes.txt"
            - send: { key: ctrl-s }
            # The editor stays open with the input, and says why.
            - expect_screen:
                contains: ["notes.txt is not a picture bsky can read", "╭ Edit profile"]
            - send: { key: esc }
            - expect_screen:
                not_contains: "╭ Edit profile"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.uploadBlob, count: 0 }
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.putRecord, count: 0 }

  - name: an account that never saved a profile gets a new record, swapped against none
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *own_profile
          - *own_feed
          - method: GET
            path: /xrpc/com.atproto.repo.getRecord
            status: 400
            json: { error: "RecordNotFound", message: "Could not locate record" }
          - *put_record
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains: "this is you  [ e Edit profile ]  [ s Settings ]"
            - send: e
            - expect_screen:
                contains: "New avatar (path, or ctrl+o to browse; optional)"
            - send: "First Name"
            - send: { key: ctrl-s }
            - expect_screen:
                contains: "profile updated"
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.putRecord
            count: 1
            body:
              json:
                - { path: "$.record['$type']", equals: "app.bsky.actor.profile" }
                - { path: "$.record.displayName", equals: "First Name" }
                # null: "only if there is still no profile record".
                - { path: "$.swapRecord", equals: null }

  - name: a save that lost a race with another client says so and keeps the edit
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *own_profile
          - *own_feed
          - *own_record
          - method: POST
            path: /xrpc/com.atproto.repo.putRecord
            status: 400
            json: { error: "InvalidSwap", message: "Record was at cid-profile-9" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 120
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains: "this is you  [ e Edit profile ]  [ s Settings ]"
            - send: e
            # The avatar field appears once the stored record has loaded; "old
            # bio" alone would also match the profile behind the editor.
            - expect_screen:
                contains: ["New avatar (path, or ctrl+o to browse; optional)", "old bio"]
            - send: "!"
            - send: { key: ctrl-s }
            # The error is in a box in the middle of the screen; the next key
            # closes it and the edit is still there.
            - expect_screen:
                contains: [" Error ", "the profile was changed elsewhere", "the current version"]
            - send: { key: right }
            - expect_screen:
                contains: ["Old Name!", "╭ Edit profile"]
                not_contains: " Error "
            - send: { key: esc }
            - expect_screen:
                not_contains: "╭ Edit profile"
            - send: q
      - assert:
          exit_code: 0

  - name: someone else's profile can be followed but not edited, and Esc goes back to the timeline
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/p1
                    cid: cid-p1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Photo from the mountains", createdAt: "2026-09-20T10:00:00.000Z" }
          - method: GET
            path: /xrpc/app.bsky.actor.getProfile
            json:
              did: did:plc:alice
              handle: alice.test
              displayName: Alice
              followersCount: 1
              followsCount: 1
              postsCount: 1
              viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa }
          - method: GET
            path: /xrpc/app.bsky.feed.getAuthorFeed
            json: { feed: [] }
          - method: POST
            path: /xrpc/com.atproto.repo.deleteRecord
            json: {}
          - method: POST
            path: /xrpc/com.atproto.repo.createRecord
            json: { uri: "at://did:plc:me/app.bsky.graph.follow/fa2", cid: "cid-fa2" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "Photo from the mountains"
            - send: { key: enter }
            - expect_screen:
                contains: ["Alice", "✓ following", "(f to toggle)"]
            - send: e
            - expect_screen:
                contains: "you can only edit your own profile"
            - send: f
            - expect_screen:
                contains: ["not following", "unfollowed"]
            - send: f
            - expect_screen:
                contains: ["✓ following", "followed"]
            # Esc goes back to the timeline the profile was opened from;
            # nothing is fetched to get there. Alice's post left it when she
            # was unfollowed, and following again does not put it back until
            # the timeline is refreshed.
            - expect_screen:
                contains: "esc back to timeline"
            - send: { key: esc }
            - expect_screen:
                contains: ["1 Timeline", "No posts from accounts you follow yet"]
                not_contains: ["(f to toggle)", "esc back to timeline"]
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.deleteRecord
            count: 1
            body:
              json: { path: "$.rkey", equals: "fa" }
      - assert:
          mock:
            name: api
            path: /xrpc/com.atproto.repo.createRecord
            count: 1
            body:
              json: { path: "$.record.subject", equals: "did:plc:alice" }
      - assert:
          mock: { name: api, path: /xrpc/com.atproto.repo.getRecord, count: 0 }
      - assert:
          mock: { name: api, path: /xrpc/app.bsky.actor.getProfile, count: 1 }
      - assert:
          mock: { name: api, path: /xrpc/app.bsky.feed.getTimeline, count: 1 }

  - name: nearing the end of a profile's posts asks for the next page once
    mock_servers:
      - name: api
        routes:
          - *empty_timeline
          - *own_profile
          - method: GET
            path: /xrpc/app.bsky.feed.getAuthorFeed
            json:
              cursor: "author-page-2"
              feed:
                - post:
                    uri: at://did:plc:me/app.bsky.feed.post/m1
                    cid: cid-m1
                    author: { did: did:plc:me, handle: me.test, displayName: "Old Name" }
                    record: { text: "My first post", createdAt: "2026-09-01T00:00:00.000Z" }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "No posts from accounts you follow yet"
            - send: "4"
            - expect_screen:
                contains: ["@me.test", "My first post"]
            # One post, so the first move is already near the end. The next
            # page repeats it with the same cursor, which ends the list.
            - send: j
            - expect_screen:
                matches: "My first post"
                count: 1
                stable_for: 500ms
            - send: q
      - assert:
          exit_code: 0
      - assert:
          mock:
            name: api
            path: /xrpc/app.bsky.feed.getAuthorFeed
            count: 2
            query: { name: cursor, equals: "author-page-2" }

  # The settings screen: s on your own profile. Pictures turned off there
  # are off at once and after a restart; auto brings them back without one.
  - name: pictures turned off on the settings screen stay off, and auto brings them back
    mock_servers:
      - name: api
        routes:
          - &picture_timeline
            method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:alice/app.bsky.feed.post/p1
                    cid: cid-p1
                    author: { did: did:plc:alice, handle: alice.test, displayName: Alice, viewer: { following: at://did:plc:me/app.bsky.graph.follow/fa } }
                    record: { text: "Photo from the mountains", createdAt: "2026-09-20T10:00:00.000Z" }
                    embed: { $type: app.bsky.embed.images#view, images: [ { thumb: "${api.url}/img/photo.png", fullsize: "${api.url}/img/photo.png", alt: "山の頂上👨‍👩‍👧", aspectRatio: { width: 4, height: 3 } } ] }
          - *own_profile
          - *own_feed
          - &img_photo { method: GET, path: /img/photo.png, body_file: testdata/photo.png, header: { Content-Type: image/png } }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "Photo from the mountains"
                images: { count: 1 }
            - send: "4"
            - expect_screen:
                contains: ["this is you  [ e Edit profile ]  [ s Settings ]", "s settings"]
            - send: s
            - expect_screen:
                contains: [" Settings ", "▶ Theme", "Pictures         auto", "Download folder", "Picture cache", "Video service", "Browser", "j k move  enter change  esc close"]
            - send: j
            - send: { key: enter }
            - expect_screen:
                contains: ["Pictures         off", "pictures: off"]
            # Wait for the window itself to go before the next key, or Esc
            # followed by 1 reads as Alt+1.
            - send: { key: esc }
            - expect_screen:
                not_contains: "Picture cache"
            - send: "1"
            # The post says what it carries instead of drawing it. The
            # picture sent before is still counted by the terminal, so that
            # none is sent at all is checked on the next start.
            - expect_screen:
                contains: ["Photo from the mountains", "▣ 1 picture: 山の頂上👨‍👩‍👧", "space open in browser"]
            - send: q
      - assert:
          exit_code: 0
      - assert:
          file:
            path: cfg/settings.json
            json: { path: "$.pictures", equals: "off" }
      # Started again with the same settings: still off, and no picture is
      # sent until they are turned back on.
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "▣ 1 picture: 山の頂上👨‍👩‍👧"
                not_contains: "cannot show pictures"
                images: { count: 0 }
                stable_for: 300ms
            # Back to auto: the picture is drawn again, without a restart.
            - send: "4"
            - expect_screen:
                contains: "[ s Settings ]"
            - send: s
            - expect_screen:
                contains: "Pictures         off"
            - send: j
            - send: " "
            - expect_screen:
                contains: ["Pictures         auto", "pictures: auto"]
            - send: { key: esc }
            - expect_screen:
                not_contains: "Picture cache"
            - send: "1"
            - expect_screen:
                contains: "Photo from the mountains"
                not_contains: "▣ 1 picture"
                images: { count: 1 }
            - send: q
      - assert:
          exit_code: 0
      - assert:
          file:
            path: cfg/settings.json
            json: { path: "$.pictures", equals: "auto" }

  - name: a setting a variable fixes is shown as set for this run and is not changed
    mock_servers:
      - name: api
        routes:
          - *picture_timeline
          - *own_profile
          - *own_feed
          - *img_photo
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 30
          cols: 100
          env:
            BSKY_CONFIG_DIR: ${workdir}/cfg
            BSKY_CACHE_DIR: ${workdir}/cache
            BSKY_GRAPHICS: kitty
            BSKY_DOWNLOAD_DIR: ${workdir}/saved
            TZ: UTC
          timeout: 20s
          session:
            - expect_screen:
                contains: "Photo from the mountains"
                images: { count: 1 }
            - send: "4"
            - expect_screen:
                contains: "[ s Settings ]"
            - send: s
            - expect_screen:
                contains: ["Pictures         kitty", "saved"]
            - send: j
            - expect_screen:
                contains: "set by BSKY_GRAPHICS for this run"
            - send: { key: enter }
            - expect_screen:
                contains: "Pictures         kitty"
                not_contains: "pictures: off"
            - send: j
            - expect_screen:
                contains: "set by BSKY_DOWNLOAD_DIR for this run"
            - send: { key: esc }
            - expect_screen:
                not_contains: "Picture cache"
            - send: "1"
            - expect_screen:
                contains: "Photo from the mountains"
                images: { count: 1 }
            - send: q
      # Nothing was chosen, so nothing was written.
      - assert:
          exit_code: 0
      - assert:
          file:
            path: cfg/settings.json
            exists: false
