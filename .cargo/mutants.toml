# cargo-mutants configuration (https://mutants.rs).
#
# Mutation testing changes one operator, constant or return value at a time and
# checks that some test fails. In bsky (crates/bluesky-terminal-client) it is
# pointed at the code that computes and decides on its own: laying text out in
# cells, finding the facets of a post, reading HLS playlists and MPEG-TS,
# reading a page's link card, fitting pictures in cells, the columns and the
# text field. The rest mostly wires those to the terminal, the network and the
# worker thread, which the state tests of App and the E2E suite cover.
#
# In msky (crates/misskey-terminal-client) it is pointed at reading a note's
# MFM (its links and its plain text), taking the metadata off a file before it
# is uploaded, reading an MP4's video track and putting text others wrote on
# one line.
#
# In mstdn (crates/mastodon-terminal-client) it is pointed at reading a
# status's HTML back into the text its author wrote, putting text others
# wrote on one line, and the full-screen client's lists: where the next page
# starts, which answer is the one waited for, and how far in a reply is drawn.
#
# The text layout, the picture scaling and the text field live in the
# terminal-kit crate of the workspace, which the clients use, so
# mutation.yml runs cargo mutants with --workspace.
examine_globs = [
  "crates/terminal-kit/src/text.rs",
  "crates/bluesky-terminal-client/src/api/facets.rs",
  "crates/bluesky-terminal-client/src/hls.rs",
  "crates/bluesky-terminal-client/src/og.rs",
  "crates/bluesky-terminal-client/src/langs.rs",
  "crates/terminal-kit/src/scale.rs",
  "crates/bluesky-terminal-client/src/tui/columns.rs",
  "crates/terminal-kit/src/input.rs",
  "crates/misskey-terminal-client/src/mfm.rs",
  "crates/misskey-terminal-client/src/metadata.rs",
  "crates/misskey-terminal-client/src/tui/mp4.rs",
  "crates/misskey-terminal-client/src/text.rs",
  "crates/mastodon-terminal-client/src/html.rs",
  "crates/mastodon-terminal-client/src/text.rs",
  "crates/mastodon-terminal-client/src/tui/list.rs",
]

# A mutant in terminal-kit is judged by the clients' tests too, which
# draw whole screens with it.
test_workspace = true

# The clients' unit tests are in their bin targets and terminal-kit's in
# its lib target; --all-targets runs them all and leaves the doc tests out.
# They run in about forty seconds.
additional_cargo_test_args = ["--all-targets"]

# A mutant that turns a loop condition around can spin forever.
timeout_multiplier = 3.0
