- name: 'usable: read specified visibility seeded through API'
  steps:
  - run:
      command: msky note ${env:MSKY_SEED_SPECIFIED} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.visibility
          equals: specified
- name: 'usable: notifications include seeded interactions'
  steps:
  - run:
      command: msky notifications -n 2000 --json
  - assert:
      exit_code: 0
      stdout:
        contains:
        - '"type":"mention"'
        - '"type":"reply"'
        - '"type":"like"'
        - '"type":"repost"'
        - '"type":"follow"'
- name: 'usable: download preserves the picture'
  steps:
  - fixture:
      file: expected.png
      from: ../atago/testdata/photo.png
  - run:
      command: msky download ${env:MSKY_SEED_PICTURE_FIRST} -o downloaded --json
      env:
        MSKY_TOKEN: ${env:MSKY_THIRD_TOKEN}
  - assert:
      exit_code: 0
      stdout:
        matches: (?m)^\{
        count: 4
  - assert:
      dir:
        path: downloaded
        count: 4
  - assert:
      file:
        path: downloaded/${env:MSKY_SEED_PICTURE_FIRST}-1.png
        equals_file: expected.png
  - assert:
      file:
        path: downloaded/${env:MSKY_SEED_PICTURE_FIRST}-2.png
        equals_file: expected.png
  - assert:
      file:
        path: downloaded/${env:MSKY_SEED_PICTURE_FIRST}-3.png
        equals_file: expected.png
  - assert:
      file:
        path: downloaded/${env:MSKY_SEED_PICTURE_FIRST}-4.png
        equals_file: expected.png
- name: 'usable: kitty opens thread pictures video searches accounts composes and quits'
  steps:
  - pty:
      command: msky
      graphics: kitty
      rows: 40
      cols: 120
      sandbox_home: true
      env:
        MSKY_CONFIG_DIR: ${workdir}/cfg
        MSKY_CACHE_DIR: 'off'
        MSKY_SERVERS_URL: 'off'
        MSKY_DOWNLOAD_DIR: ${workdir}/downloads
        NO_COLOR: ''
      timeout: 120s
      session:
      - expect_screen:
          timeout: 10s
          contains: 1 Home
          stable_for: 200ms
      - send: '/'
      - expect_screen:
          timeout: 10s
          contains: Search
          stable_for: 200ms
      - send: compat-wide-root
      - send:
          key: enter
      - expect_screen:
          timeout: 10s
          contains: compat-wide-root
          stable_for: 200ms
      - send: v
      - expect_screen:
          timeout: 10s
          contains:
          - Thread
          - compat-wide-
          stable_for: 200ms
      - send:
          key: esc
      - expect_screen:
          timeout: 10s
          not_contains: Thread
          contains: compat-wide-root
          stable_for: 200ms
      - send: /
      - expect_screen:
          timeout: 10s
          stable_for: 200ms
          contains: Search
      - send:
          key: ctrl-u
      - send: compat-upload-picture
      - send:
          key: enter
      - expect_screen:
          timeout: 10s
          stable_for: 200ms
          contains: compat-upload-picture
          images:
            min_count: 1
      - send: ' '
      - expect_screen:
          timeout: 15s
          stable_for: 200ms
          contains: 1/1
          images:
            min_count: 1
      - send:
          key: esc
      - expect_screen:
          timeout: 10s
          stable_for: 200ms
          contains: compat-upload-picture
      - send: /
      - expect_screen:
          timeout: 10s
          stable_for: 200ms
          contains: Search
      - send:
          key: ctrl-u
      - send: compat-upload-video
      - send:
          key: enter
      - expect_screen:
          timeout: 10s
          stable_for: 200ms
          contains: compat-upload-video
          images:
            min_count: 1
      - send: ' '
      - expect_screen:
          timeout: 15s
          stable_for: 200ms
          contains: ■ ended
          images:
            min_count: 1
      - send:
          key: esc
      - expect_screen:
          timeout: 10s
          stable_for: 200ms
          contains: compat-upload-video
      - send: /
      - expect_screen:
          timeout: 10s
          stable_for: 200ms
          contains: Search
      - send:
          key: ctrl-u
      - send: compat_admin
      - send:
          key: ctrl-t
      - send:
          key: enter
      - expect_screen:
          timeout: 10s
          stable_for: 200ms
          contains:
          - Search accounts
          - '@compat_admin'
      - send: n
      - expect_screen:
          timeout: 10s
          contains: New note
          stable_for: 200ms
      - send: compat-pty-write
      - send:
          key: ctrl-s
      - expect_screen:
          timeout: 10s
          contains: 'posted '
          stable_for: 200ms
      - send: q
  - assert:
      exit_code: 0
