version: '1'
suite:
  name: msky live catalog
scenarios:
- name: 'usable: token identifies the account'
  steps:
  - run:
      command: msky whoami --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.username
          equals: compat_admin
- name: 'usable: home timeline reads seeded notes'
  steps:
  - run:
      command: msky timeline home -n 100 --json
  - assert:
      exit_code: 0
      stdout:
        matches: (?m)^\{
        count: 100
  - assert:
      stdout:
        contains: compat-
- name: 'usable: local timeline reads seeded notes'
  steps:
  - run:
      command: msky timeline local -n 100 --json
  - assert:
      exit_code: 0
      stdout:
        matches: (?m)^\{
        count: 100
  - assert:
      stdout:
        contains: compat-
- name: 'usable: global timeline reads seeded notes'
  steps:
  - run:
      command: msky timeline global -n 100 --json
  - assert:
      exit_code: 0
      stdout:
        matches: (?m)^\{
        count: 100
  - assert:
      stdout:
        contains: compat-
- name: 'usable: three pages of seeded text notes'
  steps:
  - run:
      command: msky search "#compatcatalog" -n 1000 --json
  - assert:
      exit_code: 0
      stdout:
        matches: (?m)^\{
        count: 500
  - assert:
      stdout:
        contains:
        - compat-text-499
        - compat-text-000
- name: 'usable: post reply thread and delete'
  steps:
  - run:
      command: msky post "compat-native-post" --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.action
          equals: post
  - store:
      name: note
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: msky post "compat-native-reply" --reply ${note} --json
  - store:
      name: reply
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: msky thread ${note} --json
  - assert:
      exit_code: 0
      stdout:
        matches: (?m)^\{
        count: 2
  - assert:
      stdout:
        contains:
        - ${reply}
        - ${note}
        - compat-native-reply
  - run:
      command: msky delete ${reply} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.action
          equals: delete
  - run:
      command: msky delete ${note} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.action
          equals: delete
  - run:
      command: msky note ${note} --json
  - assert:
      exit_code: 4
      stdout:
        json:
        - path: $.error
          matches: NO_SUCH_NOTE
        - path: $.status
          equals: 4
- name: 'usable: reactions custom emoji and renote removal'
  steps:
  - run:
      command: msky post "compat-native-react" --json
  - store:
      name: note
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: msky like ${note} --reaction 👍 --json
      env:
        MSKY_TOKEN: ${env:MSKY_SECOND_TOKEN}
  - run:
      command: msky note ${note} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.likeCount
          equals: 1
  - run:
      command: msky reactions ${note} --json
  - assert:
      exit_code: 0
      stdout:
        matches: (?m)^\{
        count: 1
  - run:
      command: msky unlike ${note} --json
      env:
        MSKY_TOKEN: ${env:MSKY_SECOND_TOKEN}
  - run:
      command: msky note ${note} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.likeCount
          equals: 0
  - run:
      command: 'msky like ${note} --reaction :compat: --json'
      env:
        MSKY_TOKEN: ${env:MSKY_SECOND_TOKEN}
  - run:
      command: msky reactions ${note} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.reaction
          equals: ':compat@.:'
  - run:
      command: msky repost ${note} --json
      env:
        MSKY_TOKEN: ${env:MSKY_SECOND_TOKEN}
  - run:
      command: msky note ${note} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.repostCount
          equals: 1
  - run:
      command: msky unrepost ${note} --json
      env:
        MSKY_TOKEN: ${env:MSKY_SECOND_TOKEN}
  - run:
      command: msky renotes ${note} --json
      retry:
        times: 20
        interval: 250ms
        until:
          exit_code: 0
          stdout:
            empty: true
  - assert:
      exit_code: 0
      stdout:
        empty: true
- name: 'usable: renote count returns to zero'
  skip:
    env: MSKY_STALE_RENOTE
  steps:
  - run:
      command: msky note ${env:MSKY_SEED_RENOTE_TARGET} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.repostCount
          equals: 0
- name: 'usable: known stale renote count from the server'
  only:
    env: MSKY_STALE_RENOTE
  expect_fail:
    reason: The server removed the renote but retained renoteCount; see COMPAT.md.
  steps:
  - run:
      command: msky note ${env:MSKY_SEED_RENOTE_TARGET} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.repostCount
          equals: 0
- name: 'usable: upload picture with alt text'
  steps:
  - run:
      command: msky post "compat-upload-picture" --image ${env:MSKY_SEED_PICTURE_PATH} --alt "compat alt 👨‍👩‍👧 👍🏽
        🇯🇵 漢字 العربية é" --json
  - store:
      name: note
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: msky note ${note} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.files[0].type
          equals: image
        - path: $.files[0].description
          equals: compat alt 👨‍👩‍👧 👍🏽 🇯🇵 漢字 العربية é
- name: 'usable: upload video with alt text'
  steps:
  - run:
      command: msky post "compat-upload-video" --video ${env:MSKY_SEED_VIDEO_PATH} --alt "compat alt 👨‍👩‍👧 👍🏽 🇯🇵
        漢字 العربية é" --json
  - store:
      name: note
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: msky note ${note} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.files[0].type
          equals: video
        - path: $.files[0].description
          equals: compat alt 👨‍👩‍👧 👍🏽 🇯🇵 漢字 العربية é
- name: 'usable: content warning and public visibility'
  steps:
  - run:
      command: msky post "compat-warning" --cw "compat warning" --visibility public --json
  - store:
      name: note
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: msky note ${note} --json
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.cw
          equals: compat warning
        - path: $.visibility
          equals: public
- name: 'usable: content warning and home visibility'
  steps:
  - run:
      command: msky post "compat-warning" --cw "compat warning" --visibility home --json
  - store:
      name: note
      from:
        stdout:
          json:
            path: $.id
