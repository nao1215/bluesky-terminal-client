- name: 'heavy: unsupported codec offers saving'
  steps:
  - pty:
      command: msky
      graphics: kitty
      rows: 40
      cols: 120
      sandbox_home: true
      env:
        MSKY_CONFIG_DIR: ${workdir}/cfg
        MSKY_CACHE_DIR: 'off'
        MSKY_SERVERS_URL: 'off'
        MSKY_DOWNLOAD_DIR: ${workdir}/downloads
        NO_COLOR: ''
      timeout: 120s
      session:
      - expect_screen:
          timeout: 10s
          contains: 1 Home
          stable_for: 200ms
      - send: '/'
      - expect_screen:
          timeout: 10s
          contains: Search
          stable_for: 200ms
      - send: compat-unsupported-vp9
      - send:
          key: enter
      - expect_screen:
