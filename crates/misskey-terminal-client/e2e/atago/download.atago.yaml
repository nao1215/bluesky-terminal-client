# msky download: the files attached to one note, saved as
# <note id>-<n>.<ext>. The extension is the one the file was uploaded with
# when it agrees with the type the server detected, else the type's own,
# and nothing is written over.
version: "1"

suite:
  name: msky download

scenarios:
  - name: download saves each file of a note under the note's name, and prints where
    mock_servers:
      - name: api
        routes:
          - method: POST
            path: /api/notes/show
            json:
              id: 9abc
              createdAt: "2026-09-20T10:00:00.000Z"
              user: { username: alice }
              text: "三つのファイル 👨‍👩‍👧"
              files:
                - { id: f1, name: "写真.PNG", type: image/png, size: 242, url: "${api.url}/files/f1" }
                - { id: f2, name: "clip.exe", type: video/mp4, size: 1838, url: "${api.url}/files/f2" }
                - { id: f3, name: "tool.exe", type: application/x-msdownload, size: 242, url: "${api.url}/files/f3" }
          - { method: GET, path: /files/f1, body_file: testdata/photo.png, header: { Content-Type: image/png } }
          - { method: GET, path: /files/f2, body_file: testdata/clip.mp4, header: { Content-Type: video/mp4 } }
          - { method: GET, path: /files/f3, body_file: testdata/photo.png }
    steps:
      - fixture: { file: expected/photo.png, from: testdata/photo.png }
      - fixture: { file: expected/clip.mp4, from: testdata/clip.mp4 }
      - run:
          command: msky download ${api.url}/notes/9abc -o 写真👨‍👩‍👧 --host 127.0.0.1:9
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            matches: '^[^\n]*9abc-1\.png\n[^\n]*9abc-2\.mp4\n[^\n]*9abc-3\.bin\n$'
      - assert:
          dir: { path: 写真👨‍👩‍👧, count: 3, contains: [9abc-1.png, 9abc-2.mp4, 9abc-3.bin] }
      - assert:
          file: { path: 写真👨‍👩‍👧/9abc-1.png, equals_file: expected/photo.png }
      - assert:
          file: { path: 写真👨‍👩‍👧/9abc-2.mp4, equals_file: expected/clip.mp4 }
      - assert:
          mock:
            name: api
            path: /api/notes/show
            body:
              json: { path: "$.noteId", equals: 9abc }

  - name: download writes over nothing, and --json says what each saved file is
    mock_servers:
      - name: api
        routes:
          - method: POST
            path: /api/notes/show
            json:
              id: 9abc
              user: { username: alice }
              files:
                - { id: f1, name: "a.png", type: image/png, size: 242, url: "${api.url}/files/f1" }
          - { method: GET, path: /files/f1, body_file: testdata/photo.png }
    steps:
      - fixture: { file: out/9abc-1.png, content: "already here" }
      - run:
          command: msky download 9abc --json --host ${api.url}
          env:
            MSKY_DOWNLOAD_DIR: out
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.postId", equals: 9abc }
              - { path: "$.type", equals: image }
              - { path: "$.url", equals: "${api.url}/files/f1" }
              - { path: "$.path", matches: "9abc-1 \\(1\\)\\.png$" }
      - assert:
          file: { path: out/9abc-1.png, equals: "already here" }
      - assert:
          file: { path: "out/9abc-1 (1).png", size: 242 }

  # The files of the note a renote or a quote carries are saved too, each
  # under the ID of the note it is attached to.
  - name: download saves the files of the note a renote or a quote carries
    mock_servers:
      - name: api
        routes:
          - method: POST
            path: /api/notes/show
            json:
              id: qt1
              user: { username: alice }
              text: "これ見て 👀"
              files:
                - { id: f0, name: "mine.png", type: image/png, size: 242, url: "${api.url}/files/f0" }
              renoteId: orig
              renote:
                id: orig
                user: { username: bob, host: other.example }
                files:
                  - { id: f1, name: "a.png", type: image/png, size: 242, url: "${api.url}/files/f1" }
                  - { id: f2, name: "b.mp4", type: video/mp4, size: 1838, url: "${api.url}/files/f2" }
          - { method: GET, path: /files/f0, body_file: testdata/photo.png }
          - { method: GET, path: /files/f1, body_file: testdata/photo.png }
          - { method: GET, path: /files/f2, body_file: testdata/clip.mp4 }
    steps:
      - run:
          command: msky download qt1 -o out --json --host ${api.url}
      - assert:
          exit_code: 0
          stdout:
            matches: '"path":"[^"]*qt1-1\.png","postId":"qt1","type":"image"[^\n]*\n[^\n]*"path":"[^"]*orig-1\.png","postId":"orig","type":"image"[^\n]*\n[^\n]*orig-2\.mp4","postId":"orig","type":"video"'
      - assert:
          dir: { path: out, count: 3, contains: [qt1-1.png, orig-1.png, orig-2.mp4] }

  # Only an http(s) address is fetched, and a file the server says is over
  # 200 MB is not fetched at all; either leaves nothing behind.
  - name: a file not at a web address, too large, or missing is an error and leaves nothing
    mock_servers:
      - name: api
        routes:
          - method: POST
            path: /api/notes/show
            json:
              id: bad
              user: { username: eve }
              files:
                - { id: f1, name: "p", type: text/plain, size: 1, url: "file:///etc/passwd" }
          - method: POST
            path: /api/notes/search
            json: []
      - name: big
        routes:
          - method: POST
            path: /api/notes/show
            json:
              id: big
              user: { username: eve }
              files:
                - { id: f1, name: "v.mp4", type: video/mp4, size: 209715201, url: "${big.url}/files/v" }
      - name: gone
        routes:
          - method: POST
            path: /api/notes/show
            json:
              id: gone
              user: { username: eve }
              files:
                - { id: f1, name: "a.png", type: image/png, size: 1, url: "${gone.url}/files/missing" }
    steps:
      - run:
          command: msky download bad -o out --host ${api.url}
      - assert:
          exit_code: 4
          stderr:
            equals: "error: file:///etc/passwd is not an http(s) address; nothing was written\n"
      - run:
          command: msky download big -o out --host ${big.url}
      - assert:
          exit_code: 4
          stderr:
            contains: "is larger than 200 MB, the most msky saves; nothing was written"
      - assert:
          mock: { name: big, path: /files/v, count: 0 }
      - run:
          command: msky download gone -o out --host ${gone.url}
      - assert:
          exit_code: 4
          stderr:
            contains: "/files/missing: HTTP 404"
      - assert:
          dir: { path: out, exists: false }

  - name: a note without files, or not written as a note, is a usage error
    mock_servers:
      - name: api
        routes:
          - method: POST
            path: /api/notes/show
            json: { id: plain, user: { username: alice }, text: "文字だけ" }
    steps:
      - run:
          command: msky download plain -o out --host ${api.url}
      - assert:
          exit_code: 1
          stderr:
            equals: "error: ${api.url}/notes/plain has no files\n"
      - run:
          command: msky download ${api.url}/@alice --host ${api.url}
      - assert:
          exit_code: 1
          stderr:
            contains: "is not a note"
      - assert:
          mock: { name: api, path: /api/notes/show, count: 1 }
