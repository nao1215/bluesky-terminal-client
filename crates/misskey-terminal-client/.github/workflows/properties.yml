name: Properties

# Runs the properties in src/properties.rs (proptest) with many more cases
# than a pull request does: every run of `cargo test` checks them with
# proptest's default 256 cases, and this job each night with
# PROPTEST_CASES, in a release build so that it takes minutes.
#
# A failure prints the smallest input proptest found and uploads the
# proptest-regressions/ file. Add that input as a unit test next to the code
# it breaks, then fix it on a fix/* branch. Never lower the number of cases
# to make this green.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property
        default: "500000"
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - name: Check the properties
        env:
          PROPTEST_CASES: ${{ inputs.cases || '500000' }}
        run: cargo test --release --locked --bin msky properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: proptest-regressions
          path: proptest-regressions
          if-no-files-found: ignore
