# cargo-mutants configuration (https://mutants.rs).
#
# Mutation testing changes one operator, constant or return value at a time and
# checks that some test fails. It is pointed at the code that computes and
# decides on its own: reading a note's MFM (its links and its plain text),
# taking the metadata off a file before it is uploaded, reading an MP4's video
# track, laying text out in cells, cleaning text others wrote, fitting
# pictures in cells and the text field. The rest mostly wires those to the
# terminal, the network and the worker thread, which the state tests of App
# and the E2E suite cover.
examine_globs = [
  "src/mfm.rs",
  "src/metadata.rs",
  "src/tui/mp4.rs",
  "src/tui/text.rs",
  "src/text.rs",
  "src/tui/scale.rs",
  "src/tui/input.rs",
]

# msky is a binary crate: its unit tests are in the bin target. They run in
# about fifteen seconds.
additional_cargo_test_args = ["--bins"]

# A mutant that turns a loop condition around can spin forever.
timeout_multiplier = 3.0
