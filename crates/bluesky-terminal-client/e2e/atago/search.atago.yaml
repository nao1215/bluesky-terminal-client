                  contains: [{ width: 360, height: 203 }]
            - send: q
      - assert:
          exit_code: 0
          mock: { name: api, path: /xrpc/app.bsky.feed.getTimeline, count: 1 }
      - assert:
          # Playback can fetch HLS again after search replaced the read-ahead set.
          mock: { name: api, path: /timeline/v/seg0.ts, method: GET }
      - assert:
          mock: { name: api, path: /search/v/seg0.ts, method: GET }
