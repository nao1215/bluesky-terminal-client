  - name: search plays the selected video inline and Esc restores timeline playback
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /xrpc/app.bsky.feed.getTimeline
            json:
              feed:
                - post:
                    uri: at://did:plc:me/app.bsky.feed.post/plain
                    cid: plain
                    author: { did: did:plc:me, handle: me.test }
                    record: { text: "Timeline plain post", createdAt: "2026-09-19T12:00:00.000Z" }
                - post:
                    uri: at://did:plc:me/app.bsky.feed.post/video
                    cid: video
                    author: { did: did:plc:me, handle: me.test }
                    record: { text: "Timeline selected video", createdAt: "2026-09-19T11:00:00.000Z" }
                    embed:
                      $type: app.bsky.embed.video#view
                      cid: video
                      playlist: "${api.url}/timeline/playlist.m3u8"
                      thumbnail: "${api.url}/thumb.png"
                      aspectRatio: { width: 16, height: 9 }
          - *empty_notifications
          - method: GET
            path: /xrpc/app.bsky.feed.searchPosts
            json:
              posts:
                - uri: at://did:plc:carol/app.bsky.feed.post/plain
