                  author: { did: did:plc:carol, handle: carol.test }
                  record: { text: "Search plain post", createdAt: "2026-09-19T12:00:00.000Z" }
                - uri: at://did:plc:carol/app.bsky.feed.post/video
                  cid: result-video
                  author: { did: did:plc:carol, handle: carol.test }
                  record: { text: "Search selected video", createdAt: "2026-09-19T11:00:00.000Z" }
                  embed:
                    $type: app.bsky.embed.video#view
                    cid: result-video
                    playlist: "${api.url}/search/playlist.m3u8"
                    thumbnail: "${api.url}/thumb.png"
                    aspectRatio: { width: 16, height: 9 }
          - { method: GET, path: /thumb.png, body_file: testdata/avatar-alice.png, header: { Content-Type: image/png } }
          - { method: GET, path: /timeline/playlist.m3u8, body_file: testdata/hls/playlist.m3u8, header: { Content-Type: application/vnd.apple.mpegurl } }
          - { method: GET, path: /timeline/v/video.m3u8, body_file: testdata/hls/v/video.m3u8, header: { Content-Type: application/vnd.apple.mpegurl } }
          - { method: GET, path: /timeline/v/seg0.ts, body_file: testdata/hls/v/seg0.ts, header: { Content-Type: video/mp2t } }
          - { method: GET, path: /search/playlist.m3u8, body_file: testdata/hls/playlist.m3u8, header: { Content-Type: application/vnd.apple.mpegurl } }
          - { method: GET, path: /search/v/video.m3u8, body_file: testdata/hls/v/video.m3u8, header: { Content-Type: application/vnd.apple.mpegurl } }
          - { method: GET, path: /search/v/seg0.ts, body_file: testdata/hls/v/seg0.ts, header: { Content-Type: video/mp2t } }
    steps:
      - *session
      - pty:
          command: bsky
          graphics: kitty
          rows: 40
          cols: 100
          env: *env
          timeout: 20s
          session:
            - expect_screen:
                contains: "Timeline selected video"
            - send: j
            - expect_screen:
                contains: "▌      Timeline selected video"
                images:
                  contains: [{ width: 360, height: 203 }]
            - send: "/"
            - send: "videos"
            - send: { key: enter }
            - expect_screen:
                contains: ["Search: videos", "Search plain post", "Search selected video"]
                not_contains: "Timeline selected video"
            - send: j
            - expect_screen:
                contains: "▌      Search selected video"
                not_contains: "1/1"
                images:
                  contains: [{ width: 360, height: 203 }]
            - send: { key: esc }
            - expect_screen:
                contains: ["1 Timeline", "▌      Timeline selected video"]
                not_contains: "Search: videos"
