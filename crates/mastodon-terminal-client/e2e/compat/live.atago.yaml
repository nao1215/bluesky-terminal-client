      stdout: {json: {path: $.quoteId, equals: '${env:MSTDN_SEED_TEXT}'}}
  - pty:
      command: mstdn
      graphics: kitty
      rows: 36
      cols: 140
      env:
        MSTDN_CACHE_DIR: ${workdir}/cache
        MSTDN_DOWNLOAD_DIR: ${workdir}/download
