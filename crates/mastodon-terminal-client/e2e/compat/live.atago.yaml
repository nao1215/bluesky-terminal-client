- name: 'usable: notification kinds'
  steps:
  - run:
      command: mstdn --json notifications -n 2000
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        contains:
        - '"type":"mention"'
        - '"type":"follow"'
        - '"type":"like"'
        - '"type":"repost"'
- name: 'usable: hashtag search'
  steps:
  - run:
      command: mstdn --json search "#compatvideo" -n 150
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        matches: ^(?:\{[^\n]+\}\n){100}$
- name: 'heavy: 100 four-picture posts'
  steps:
  - run:
      command: mstdn --json search "#compatpictures" -n 150
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        matches: ^(?:\{[^\n]+\}\n){100}$
- name: 'heavy: 50-deep thread'
  steps:
  - run:
      command: mstdn --json thread ${env:MSTDN_SEED_DEEP_LAST}
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        matches: ^(?:\{[^\n]+\}\n){51}$
  - assert:
      stdout:
        contains:
        - '"id":"${env:MSTDN_SEED_DEEP}"'
        - '"id":"${env:MSTDN_SEED_DEEP_LAST}"'
- name: 'heavy: 200 replies'
  steps:
  - run:
      command: mstdn --json thread ${env:MSTDN_SEED_WIDE}
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        matches: ^(?:\{[^\n]+\}\n){201}$
- name: 'heavy: at least 500 notifications'
  steps:
  - run:
      command: mstdn --json notifications -n 2000
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        matches: ^(?:\{[^\n]+\}\n){500,}$
- name: 'heavy: longest text and one over'
  steps:
  - fixture: {file: max-text.txt, from: '${env:MSTDN_COMPAT_SEED}/max-text.txt'}
  - fixture: {file: over-text.txt, from: '${env:MSTDN_COMPAT_SEED}/over-text.txt'}
  - run:
      command: mstdn --json post -
      timeout: 60s
      stdin:
        file: max-text.txt
  - assert:
      exit_code: 0
  - run:
      command: mstdn --json post -
      timeout: 60s
      stdin:
        file: over-text.txt
  - assert:
      exit_code: 1
      stdout:
        contains: ['takes up to', '${env:MSTDN_LIMIT_TEXT}']
- name: 'behavior: wrong token'
  steps:
  - run:
      command: mstdn --json whoami
      timeout: 60s
      env:
        MSTDN_TOKEN: invalid-compatibility-token
  - assert:
      exit_code: 4
      stdout:
        json:
          path: $.status
          equals: 4
- name: 'behavior: deleted status remains a resource error'
  steps:
  - run:
      command: mstdn --json status ${env:MSTDN_SEED_DELETED}
      timeout: 60s
  - assert:
      exit_code: 4
      stdout:
        json:
          path: $.status
          equals: 4
- name: 'speed: timeline under 10s'
  steps:
  - run:
      command: mstdn --json timeline home -n 100
      timeout: 60s
  - assert:
      exit_code: 0
      duration:
        lt: 10s
      stdout:
        matches: ^(?:\{[^\n]+\}\n){100}$
- name: 'speed: notifications under 10s'
  steps:
  - run:
      command: mstdn --json notifications -n 100
      timeout: 60s
  - assert:
      exit_code: 0
      duration:
        lt: 10s
      stdout:
        matches: ^(?:\{[^\n]+\}\n){100}$
- name: 'speed: search under 10s'
  steps:
  - run:
      command: mstdn --json search "#compatvideo" -n 100
      timeout: 60s
  - assert:
      exit_code: 0
      duration:
        lt: 10s
      stdout:
        matches: ^(?:\{[^\n]+\}\n){100}$
- name: 'speed: picture post under 30s'
  steps:
  - run:
      command: mstdn --json post "speed picture" --image "${env:MSTDN_COMPAT_SEED}/picture.png" --alt "Speed picture"
      timeout: 60s
  - assert:
      exit_code: 0
      duration:
        lt: 30s
      stdout:
        matches: ^(?:\{[^\n]+\}\n){1}$
- name: 'usable: kitty timeline thread compose and quit'
  steps:
  - pty:
      command: mstdn
      graphics: kitty
      rows: 36
      cols: 140
      env:
        MSTDN_CACHE_DIR: ${workdir}/cache
        MSTDN_DOWNLOAD_DIR: ${workdir}/download
        MSTDN_GRAPHICS: kitty
      timeout: 60s
      session:
      - expect_screen:
          contains: Home
          timeout: 10s
      - send: /
      - expect_screen:
          contains: Search
          timeout: 10s
      - send: '#compatroot'
      - send:
          key: enter
      - expect_screen:
          contains: Search
          timeout: 10s
          not_contains: loading…
          stable_for: 150ms
      - expect_screen:
          contains: compatibility root
          timeout: 10s
      - send: v
      - expect_screen:
          contains: compatibility reply
          timeout: 10s
      - send:
          key: esc
      - expect_screen:
          contains: Search
          not_contains: Thread
          stable_for: 150ms
          timeout: 10s
      - send: '1'
      - expect_screen:
          contains: Home
          timeout: 10s
      - send: n
      - expect_screen:
          contains: New post
          timeout: 10s
      - send: compatibility TUI composed
      - send:
          key: ctrl-s
      - expect_screen:
          contains: posted
          timeout: 10s
      - send: q
  - assert:
      exit_code: 0
- name: 'heavy: scroll compatvideo down and back with kitty'
  steps:
  - pty:
      command: mstdn
      graphics: kitty
      rows: 36
      cols: 140
      env:
        MSTDN_CACHE_DIR: ${workdir}/cache
        MSTDN_DOWNLOAD_DIR: ${workdir}/download
        MSTDN_GRAPHICS: kitty
      timeout: 480s
