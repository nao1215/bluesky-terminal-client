      - {expect_screen: {contains: Home, timeout: 10s}}
      - {send: /}
      - {expect_screen: {contains: Search, timeout: 10s}}
      - {send: '#compatvideo'}
      - {send: {key: enter}}
      - {expect_screen: {contains: Search, timeout: 10s, not_contains: loading…, stable_for: 150ms}}
      - {expect_screen: {matches: '(?m)^▌  video099 ', timeout: 10s, images: {min_count: 1}}}
