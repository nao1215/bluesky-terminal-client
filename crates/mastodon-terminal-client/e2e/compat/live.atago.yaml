version: '1'
suite:
  name: mstdn live catalog
runners:
  peer: {type: http, base_url: '${env:MSTDN_HOST}'}
scenarios:
- name: 'usable: token identity'
  steps:
  - run:
      command: mstdn --json whoami
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.id
          equals: ${env:MSTDN_SEED_ALICE}
        - path: $.username
          equals: alice
- name: 'usable: home timeline newest page'
  steps:
  - run:
      command: mstdn --json timeline home -n 1
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.id
          equals: ${env:MSTDN_SEED_VIEWER_PICTURE}
        - path: $.text
          equals: compatibility viewer picture
- name: 'usable: local timeline newest page'
  steps:
  - run:
      command: mstdn --json timeline local -n 1
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.id
          equals: ${env:MSTDN_SEED_VIEWER_PICTURE}
        - path: $.text
          equals: compatibility viewer picture
- name: 'usable: public timeline newest page'
  steps:
  - run:
      command: mstdn --json timeline public -n 1
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.id
          equals: ${env:MSTDN_SEED_VIEWER_PICTURE}
        - path: $.text
          equals: compatibility viewer picture
- name: 'usable: three pages of video posts and end count'
  steps:
  - run:
      command: mstdn --json author videos -n 150
      timeout: 60s
      deterministic: {runs: 2, compare: [stdout, exit_code]}
  - assert:
      exit_code: 0
      stdout:
        matches: ^(?:\{[^\n]+\}\n){100}$
  - assert:
      stdout:
        matches: '^\{[^\n]*"text":"video099 #compatvideo"[^\n]*\n(?:[^\n]*\n){98}\{[^\n]*"text":"video000 #compatvideo"[^\n]*\n$'
- name: 'usable: post reply and thread'
  steps:
  - run:
      command: 'mstdn --json post "compatibility live post #compatlive"'
      timeout: 60s
  - assert:
      exit_code: 0
  - store:
      name: root
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: mstdn --json post "compatibility live reply" --reply ${root}
      timeout: 60s
  - assert:
      exit_code: 0
  - store:
      name: reply
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: mstdn --json thread ${root}
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        matches: ^(?:\{[^\n]+\}\n){2}$
  - assert:
      stdout:
        contains:
        - '"id":"${root}"'
        - '"id":"${reply}"'
        - '"replyId":"${root}"'
- name: 'usable: picture upload alt text and download'
  steps:
  - run:
      command: mstdn --json post "compatibility live picture" --image "${env:MSTDN_COMPAT_SEED}/picture.png" --alt "Round trip alt 👩🏽‍💻"
      timeout: 60s
  - assert:
      exit_code: 0
  - store:
      name: picture
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: mstdn --json status ${picture}
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.files[0].type
          equals: image
        - path: $.files[0].description
          equals: Round trip alt 👩🏽‍💻
  - run:
      command: mstdn --json download ${picture} -o dl
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        json:
          path: $.postId
          equals: ${picture}
  - store:
      name: download
      from:
        stdout:
          json:
            path: $.path
  - assert:
      image:
        path: ${download}
        width: 64
        height: 64
- name: 'usable: video upload'
  steps:
  - run:
      command: mstdn --json post "compatibility live video" --video "${env:MSTDN_COMPAT_SEED}/clip.mp4" --alt "Round trip video"
      timeout: 60s
  - assert:
      exit_code: 0
  - store:
      name: video
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: mstdn --json status ${video}
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.files[0].type
          equals: video
        - path: $.files[0].description
          equals: Round trip video
- name: 'usable: content warning and public visibility'
  steps:
  - run:
      command: mstdn --json post "@bob visibility round trip" --cw "Round trip CW" --visibility public
      timeout: 60s
  - assert:
      exit_code: 0
  - store:
      name: post
      from:
        stdout:
          json:
            path: $.id
  - run:
      command: mstdn --json status ${post}
      timeout: 60s
  - assert:
      exit_code: 0
      stdout:
        json:
        - path: $.cw
          equals: Round trip CW
        - path: $.visibility
          equals: public
