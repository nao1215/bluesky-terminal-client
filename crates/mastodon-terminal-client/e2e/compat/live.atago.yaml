- name: 'heavy: scroll compatpictures down and back with kitty'
  steps:
  - pty:
      command: mstdn
      graphics: kitty
      rows: 36
      cols: 140
      env:
        MSTDN_CACHE_DIR: ${workdir}/cache
        MSTDN_DOWNLOAD_DIR: ${workdir}/download
        MSTDN_GRAPHICS: kitty
      timeout: 480s
      session:
      - {expect_screen: {contains: Home, timeout: 10s}}
