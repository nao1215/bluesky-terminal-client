- name: 'heavy: advertised or fallback alt text limit and one over'
  steps:
  - fixture: {file: max-alt.txt, from: '${env:MSTDN_COMPAT_SEED}/max-alt.txt'}
  - fixture: {file: over-alt.txt, from: '${env:MSTDN_COMPAT_SEED}/over-alt.txt'}
  - store:
      name: alt
      from:
        file:
          path: max-alt.txt
          text: true
  - store:
      name: over
      from:
        file:
          path: over-alt.txt
          text: true
  - run:
      command: mstdn --json post "max alt" --image "${env:MSTDN_COMPAT_SEED}/picture.png" --alt "${alt}"
      timeout: 60s
  - assert: {exit_code: 0}
  - store: {name: created, from: {stdout: {json: {path: $.id}}}}
  - run: {command: 'mstdn --json status ${created}', timeout: 60s}
  - assert:
      exit_code: 0
      stdout:
        json:
          path: $.files[0].description
          equals: ${alt}
  - run:
      command: mstdn --json post "over alt" --image "${env:MSTDN_COMPAT_SEED}/picture.png" --alt "${over}"
      timeout: 60s
  - assert:
      exit_code: 1
      stdout:
        contains: ['takes up to', '${env:MSTDN_LIMIT_ALT}']
- name: 'behavior: server restart during a TUI session'
  steps:
  - pty:
      command: mstdn
      graphics: kitty
      rows: 36
      cols: 140
      timeout: 180s
      env:
        MSTDN_CACHE_DIR: 'off'
        MSTDN_GRAPHICS: kitty
      session:
      - expect_screen:
          contains: Home
          not_contains: loading…
          stable_for: 150ms
          timeout: 10s
      - exec:
          command: python3 ${env:MSTDN_COMPAT_ROOT}/scripts/compat/server.py stop
          timeout: 40s
      - send: R
      - expect_screen:
          matches: (?i)(connect|refused)
          timeout: 20s
      - exec:
          command: python3 ${env:MSTDN_COMPAT_ROOT}/scripts/compat/server.py start
          timeout: 40s
      - exec:
          command: python3 ${env:MSTDN_COMPAT_ROOT}/scripts/compat/server.py ready ${env:MSTDN_HOST}
          timeout: 60s
      - send: R
      - expect_screen:
          contains: Home
          not_contains:
          - loading…
          - refused
          stable_for: 500ms
          timeout: 90s
      - send: q
  - assert:
      exit_code: 0
- name: 'behavior: a blocked account is a resource error and unblocking restores reads'
  only: {env: MSTDN_BLOCKED_HIDDEN}
  steps:
  - &block_peer
    http:
      runner: peer
      method: POST
      path: /api/v1/accounts/${env:MSTDN_SEED_ALICE}/block
      header: {Authorization: 'Bearer ${env:MSTDN_TOKEN_SECOND}'}
      json: {}
  - assert: {status: 200}
  - &read_blocked
    run: {command: 'mstdn --json status ${env:MSTDN_SEED_REPLY}', timeout: 60s}
  - assert: {exit_code: 4, stdout: {json: {path: $.status, equals: 4}}}
  - &unblock_peer
    http:
      runner: peer
      method: POST
      path: /api/v1/accounts/${env:MSTDN_SEED_ALICE}/unblock
      header: {Authorization: 'Bearer ${env:MSTDN_TOKEN_SECOND}'}
      json: {}
  - assert: {status: 200}
  - run: {command: 'mstdn --json status ${env:MSTDN_SEED_REPLY}', timeout: 60s}
  - &readable_reply
    assert: {exit_code: 0, stdout: {json: {path: $.id, equals: '${env:MSTDN_SEED_REPLY}'}}}
- name: 'behavior: blocking leaves a public status readable'
  only: {env: MSTDN_BLOCKED_PUBLIC}
  steps:
  - *block_peer
  - assert: {status: 200}
  - *read_blocked
  - *readable_reply
  - *unblock_peer
  - assert: {status: 200}
  - *read_blocked
  - *readable_reply
