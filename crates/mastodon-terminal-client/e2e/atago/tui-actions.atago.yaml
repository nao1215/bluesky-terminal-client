- name: declining mute block delete and report sends no write
  mock_servers:
  - name: api
    routes:
    - method: GET
      path: /api/v1/timelines/home
      json:
      - id: s1
        account: {id: '7', username: me, acct: me}
        content: <p>Selected post</p>
        visibility: public
      - id: other
        account: {id: '2', acct: bob, username: bob}
        content: <p>Other post</p>
      header: {Link: '<${api.url}/api/v1/timelines/home>; rel="prev"'}
    - method: GET
      path: /api/v2/instance
      json: {}
    - method: GET
      path: /api/v1/accounts/relationships
      json:
      - {id: '2', following: false, requested: false, muting: false, blocking: false}
    - method: POST
      path: /api/v1/accounts/2/mute
      json: {id: '2', following: false, requested: false, muting: true, blocking: false}
    - method: POST
      path: /api/v1/accounts/2/block
      json: {id: '2', following: false, requested: false, muting: false, blocking: true}
    - method: DELETE
      path: /api/v1/statuses/s1
      json: {}
    - method: POST
      path: /api/v1/reports
      json: {}
    - method: GET
      path: /api/v1/accounts/2
      json: {id: '2', acct: bob, username: bob, note: <p>Profile target</p>}
    - method: GET
      path: /api/v1/accounts/2/statuses
      json: []
  steps:
  - fixture: {file: 'cfg/accounts/127.0.0.1_${api.port}.json', content: '{"service": "${api.url}", "userId": "7", "username": "me",
        "token": "e2e-stage3-fake", "scopes": ["read", "write"]}'}
  - fixture: {file: cfg/accounts.json, content: '{"current":"127.0.0.1:${api.port}"}'}
  - pty:
      command: mstdn
      graphics: kitty
      rows: 36
      cols: 140
      env: {MSTDN_CONFIG_DIR: '${workdir}/cfg', MSTDN_CACHE_DIR: 'off', MSTDN_TOKEN: '', LC_ALL: C.UTF-8}
      timeout: 30s
      session:
      - expect_screen: {contains: Selected post, stable_for: 150ms}
      - {send: D}
      - expect_screen: {contains: 'Delete this post?', stable_for: 150ms}
      - {send: n}
      - expect_screen: {not_contains: 'Delete this post?', stable_for: 150ms}
      - {send: j}
      - send: {key: enter}
      - expect_screen: {contains: Profile target, stable_for: 150ms}
      - {send: M}
      - expect_screen: {contains: y confirms; any other key cancels, stable_for: 150ms}
      - {send: n}
      - expect_screen: {not_contains: y confirms; any other key cancels, stable_for: 150ms}
      - {send: B}
      - expect_screen: {contains: y confirms; any other key cancels, stable_for: 150ms}
      - {send: n}
      - expect_screen: {not_contains: y confirms; any other key cancels, stable_for: 150ms}
      - {send: '!'}
      - expect_screen: {contains: tab comment, stable_for: 150ms}
      - send: {key: enter}
      - expect_screen: {contains: y confirms; any other key cancels, stable_for: 150ms}
      - {send: n}
      - expect_screen: {contains: tab comment, stable_for: 150ms}
      - send: {key: esc}
      - expect_screen: {not_contains: tab comment, stable_for: 150ms}
      - {send: q}
  - assert: {exit_code: 0}
  - assert:
      mock: {name: api, path: /api/v1/accounts/2/mute, method: POST, count: 0}
  - assert:
      mock: {name: api, path: /api/v1/accounts/2/block, method: POST, count: 0}
  - assert:
      mock: {name: api, path: /api/v1/statuses/s1, method: DELETE, count: 0}
  - assert:
      mock: {name: api, path: /api/v1/reports, method: POST, count: 0}
