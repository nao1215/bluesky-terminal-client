# Mocks only. Each write checks method, path and the complete JSON body (DELETE has no body).
# A distinct process checks declined confirmations. Screens wait after esc to avoid alt-key decoding.
version: '1'
suite: {name: tui-actions}
secrets: [e2e-stage3-fake]
scenarios:
- name: follow toggles from a post and from its empty profile
  mock_servers:
  - name: api
    routes:
    - method: GET
      path: /api/v1/timelines/home
      json:
      - id: s1
        account: {id: '2', username: bob, acct: bob}
        content: <p>Selected post</p>
        visibility: public
      header: {Link: '<${api.url}/api/v1/timelines/home>; rel="prev"'}
    - method: GET
      path: /api/v2/instance
      json: {}
    - method: GET
      path: /api/v1/accounts/relationships
      json:
      - {id: '2', following: false, requested: false, muting: false, blocking: false}
    - method: POST
      path: /api/v1/accounts/2/follow
      json: {id: '2', following: true, requested: false, muting: false, blocking: false}
    - method: POST
      path: /api/v1/accounts/2/unfollow
      json: {id: '2', following: false, requested: false, muting: false, blocking: false}
    - method: GET
      path: /api/v1/accounts/2
      json: {id: '2', acct: bob, username: bob, note: <p>Profile target</p>}
    - method: GET
      path: /api/v1/accounts/2/statuses
      json: []
  steps:
  - fixture: {file: 'cfg/accounts/127.0.0.1_${api.port}.json', content: '{"service": "${api.url}", "userId": "7", "username": "me",
        "token": "e2e-stage3-fake", "scopes": ["read", "write"]}'}
  - fixture: {file: cfg/accounts.json, content: '{"current":"127.0.0.1:${api.port}"}'}
  - pty:
      command: mstdn
      graphics: kitty
      rows: 36
      cols: 140
      env: {MSTDN_CONFIG_DIR: '${workdir}/cfg', MSTDN_CACHE_DIR: 'off', MSTDN_TOKEN: '', LC_ALL: C.UTF-8}
      timeout: 30s
      session:
      - expect_screen: {contains: Selected post, stable_for: 150ms}
      - {send: f}
      - expect_screen: {contains: following · not muted · not blocked, not_contains: loading…, stable_for: 150ms}
      - send: {key: enter}
      - expect_screen: {contains: Profile target, stable_for: 150ms}
      - {send: f}
      - expect_screen: {contains: not following · not muted · not blocked, not_contains: loading…, stable_for: 150ms}
      - {send: q}
  - assert: {exit_code: 0}
  - assert:
      mock:
        name: api
        path: /api/v1/accounts/2/follow
        method: POST
        count: 1
        body:
          json:
          - path: $
            equals: {}
  - assert:
      mock:
        name: api
        path: /api/v1/accounts/2/unfollow
        method: POST
        count: 1
        body:
          json:
          - path: $
            equals: {}
  - assert:
      mock:
        name: api
        path: /api/v1/accounts/relationships
        method: GET
        count: 1
        query: {name: 'id[]', equals: '2'}
- name: follow refusal restores the state
  mock_servers:
  - name: api
    routes:
    - method: GET
      path: /api/v1/timelines/home
      json:
      - id: s1
        account: {id: '2', username: bob, acct: bob}
        content: <p>Selected post</p>
        visibility: public
      header: {Link: '<${api.url}/api/v1/timelines/home>; rel="prev"'}
    - method: GET
      path: /api/v2/instance
      json: {}
    - method: GET
      path: /api/v1/accounts/relationships
      json:
      - {id: '2', following: true, requested: false, muting: false, blocking: false}
    - method: POST
      path: /api/v1/accounts/2/unfollow
      json: {error: write refused}
      status: 403
  steps:
  - fixture: {file: 'cfg/accounts/127.0.0.1_${api.port}.json', content: '{"service": "${api.url}", "userId": "7", "username": "me",
        "token": "e2e-stage3-fake", "scopes": ["read", "write"]}'}
  - fixture: {file: cfg/accounts.json, content: '{"current":"127.0.0.1:${api.port}"}'}
  - pty:
      command: mstdn
      graphics: kitty
      rows: 36
      cols: 140
      env: {MSTDN_CONFIG_DIR: '${workdir}/cfg', MSTDN_CACHE_DIR: 'off', MSTDN_TOKEN: '', LC_ALL: C.UTF-8}
      timeout: 30s
      session:
      - expect_screen: {contains: Selected post, stable_for: 150ms}
      - {send: f}
      - expect_screen: {contains: write refused, stable_for: 150ms}
      - send: {key: esc}
      - expect_screen: {contains: following · not muted · not blocked, stable_for: 150ms}
      - {send: q}
  - assert: {exit_code: 0}
  - assert:
      mock:
        name: api
        path: /api/v1/accounts/2/unfollow
        method: POST
        count: 1
        body:
          json:
          - path: $
            equals: {}
  - assert:
      mock: {name: api, path: /api/v1/accounts/2/follow, method: POST, count: 0}
