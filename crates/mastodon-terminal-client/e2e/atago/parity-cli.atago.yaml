- name: report requires confirmation and sends the category and status once
  mock_servers:
  - name: api
    routes:
    - method: GET
      path: /api/v1/statuses/42
      json:
        id: '42'
        account:
          id: '7'
      status: 200
    - method: POST
      path: /api/v1/reports
      json: {}
      status: 200
  steps:
  - run:
      command: mstdn report 42 --reason spam --comment unsolicited --host ${api.url} --json
      env: *id001
  - assert:
      exit_code: 1
  - assert:
      mock:
        name: api
        path: /api/v1/reports
        method: POST
        count: 0
  - run:
      command: mstdn report 42 --reason spam --comment unsolicited --yes --host ${api.url} --json
      env: *id001
  - assert:
