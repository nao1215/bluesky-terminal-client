version: '1'
suite:
  name: mstdn CLI parity
scenarios:
- name: like sends its exact request once successfully
  mock_servers:
  - name: api
    routes:
    - method: POST
      path: /api/v1/statuses/42/favourite
      json: {}
      status: 200
  steps:
  - run:
      command: mstdn like 42 --host ${api.url} --json
      env: &id001
        MSTDN_TOKEN: parity-fake-token
        MSTDN_CONFIG_DIR: ${workdir}/cfg
        MSTDN_CACHE_DIR: 'off'
  - assert:
      exit_code: 0
      stderr:
        empty: true
      stdout:
        json:
          path: $.action
          equals: like
  - assert:
      mock:
        name: api
        path: /api/v1/statuses/42/favourite
        method: POST
        count: 1
        body:
          equals: '{}'
- name: like sends its exact request once and propagates refusal
  mock_servers:
  - name: api
    routes:
    - method: POST
      path: /api/v1/statuses/42/favourite
      json:
        error: refused
      status: 403
  steps:
  - run:
      command: mstdn like 42 --host ${api.url} --json
      env: *id001
  - assert:
      exit_code: 4
      stdout:
        not_contains: '"action"'
  - assert:
      mock:
        name: api
        path: /api/v1/statuses/42/favourite
        method: POST
        count: 1
        body:
          equals: '{}'
- name: unlike sends its exact request once successfully
