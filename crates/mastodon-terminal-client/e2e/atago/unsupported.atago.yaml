- name: quote on 4.4.3 writes nothing in normal and dry run modes
  mock_servers:
  - name: api
    routes:
    - method: GET
      path: /api/v2/instance
      status: 200
      json:
        version: 4.4.3
  steps:
  - run:
      command: mstdn post comment --quote 42  --host ${api.url} --json
      env: &id002
        MSTDN_TOKEN: parity-fake-token
        MSTDN_CONFIG_DIR: ${workdir}/cfg
        MSTDN_CACHE_DIR: 'off'
  - assert:
      exit_code: 5
      stdout:
        json:
          path: $.status
          equals: 5
  - assert:
      mock:
        name: api
        method: POST
        count: 0
  - run:
      command: mstdn post comment --quote 42 --dry-run --host ${api.url} --json
      env: *id002
  - assert:
      exit_code: 5
      stdout:
        json:
          path: $.status
          equals: 5
  - assert:
      mock:
        name: api
        method: POST
        count: 0
- name: quote on unknown writes nothing in normal and dry run modes
  mock_servers:
  - name: api
    routes:
    - method: GET
      path: /api/v2/instance
      status: 200
      json:
        version: unknown
  steps:
  - run:
      command: mstdn post comment --quote 42  --host ${api.url} --json
      env: *id002
  - assert:
      exit_code: 4
      stdout:
        json:
          path: $.status
          equals: 4
  - assert:
      mock:
        name: api
        method: POST
        count: 0
  - run:
      command: mstdn post comment --quote 42 --dry-run --host ${api.url} --json
      env: *id002
  - assert:
      exit_code: 4
      stdout:
        json:
          path: $.status
