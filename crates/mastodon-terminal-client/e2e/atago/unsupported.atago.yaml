  - assert:
      mock:
        name: api
        method: POST
        count: 0
- name: bookmarks 404 on 3.0.6 distinguishes capability from missing resources
  mock_servers:
  - name: api
    routes:
    - method: GET
      path: /api/v1/bookmarks
      status: 404
      json:
        error: Record not found
    - method: GET
      path: /api/v2/instance
      status: 200
      json:
        version: 3.0.6
  steps:
  - run:
      command: mstdn bookmarks --host ${api.url} --json
      env: *id002
  - assert:
      exit_code: 5
      stdout:
        json:
          path: $.status
          equals: 5
