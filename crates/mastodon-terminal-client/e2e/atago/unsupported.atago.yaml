version: '1'
suite:
  name: mstdn shared unsupported errors
scenarios:
- name: like returns shared unsupported status for HTTP 501 without retry
  mock_servers:
  - name: api
    routes:
    - method: POST
      path: /api/v1/statuses/42/favourite
      json:
        error: Not Implemented
      status: 501
  steps:
  - run:
      command: mstdn like 42 --host ${api.url} --json
      env: &id001
        MSTDN_TOKEN: parity-fake-token
        MSTDN_CONFIG_DIR: ${workdir}/cfg
        MSTDN_CACHE_DIR: 'off'
  - assert:
      exit_code: 5
      stdout:
        json:
          path: $.status
          equals: 5
      stderr:
        contains: does not support
  - assert:
      mock:
        name: api
        path: /api/v1/statuses/42/favourite
        method: POST
        count: 1
        body:
          equals: '{}'
