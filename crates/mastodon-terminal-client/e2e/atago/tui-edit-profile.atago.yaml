        LC_ALL: C.UTF-8
        MSTDN_TOKEN: ''
      timeout: 30s
      session:
      - expect_screen:
          contains: 1 Home
      - send: '6'
      - expect_screen:
          contains: Biography
      - send: e
      - expect_screen:
          contains:
          - Edit profile
          - Display name
          - Biography
      - send:
          key: tab
      - send:
          key: ctrl-u
      - send: New bio
      - send:
          key: tab
      - send:
          key: space
      - send:
          key: tab
      - send:
          key: space
      - send:
          key: tab
      - send:
          key: space
      - send:
          key: tab
      - send: Website
      - send:
          key: tab
      - send: https://example.test
