# mstdn post: a status with its files, as the account of MSTDN_TOKEN (the
# way a CI job posts). The Mastodon server is an atago mock, so nothing
# reaches a real server. The token below is a throwaway value; it is
# masked in reports all the same.
version: "1"

suite:
  name: mstdn post

secrets:
  - e2e-env-token-0001

scenarios:
  # The picture goes up without its metadata, with its alt text; the
  # server answers 202 while it processes it, and the post waits until
  # GET /api/v1/media/:id says it is ready. The status is sent once, with
  # an Idempotency-Key.
  - name: post uploads the picture, waits for it, and makes the status with it
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /api/v2/instance
            json: { configuration: { statuses: { max_characters: 500, characters_reserved_per_url: 23 }, media_attachments: { description_limit: 1500 } } }
          - method: GET
            path: /api/v1/accounts/verify_credentials
            json: { id: "7", username: nchika, acct: nchika }
          - method: GET
            path: /api/v1/statuses/100
            json: { id: "100", account: { acct: bob } }
          - method: POST
            path: /api/v2/media
            status: 202
            json: { id: m1, type: image, url: null }
          - method: GET
            path: /api/v1/media/m1
            json: { id: m1, type: image, url: "${api.url}/files/m1.jpg" }
          - method: POST
            path: /api/v1/statuses
            json: { id: "900", uri: "${api.url}/users/nchika/statuses/900", account: { acct: nchika } }
    steps:
      - fixture: { file: gps.jpg, from: testdata/gps.jpg }
      - run:
          command: mstdn post "新しい記事 🐈‍⬛ https://debimate.jp/post/a/" --image gps.jpg --alt "黒猫 🐈‍⬛ の写真" --cw ネタバレ --visibility unlisted --reply 100 --host ${api.url}
          env: &env
            MSTDN_TOKEN: e2e-env-token-0001
      - assert:
          exit_code: 0
          stdout:
            equals: "${api.url}/@nchika/900\n"
          stderr:
            empty: true
      - assert:
          mock:
            name: api
            path: /api/v2/media
            count: 1
            header: { name: Authorization, equals: "Bearer e2e-env-token-0001" }
            body:
              contains:
                - "name=\"description\"\r\n\r\n黒猫 🐈‍⬛ の写真\r\n"
                - "filename=\"gps.jpg\"\r\nContent-Type: image/jpeg\r\n"
              not_contains: ["SecretCam", "Taro Secret"]
      - assert:
          mock: { name: api, path: /api/v1/media/m1, method: GET, count: 1 }
      - assert:
          mock:
            name: api
            path: /api/v1/statuses
            method: POST
            count: 1
            header: { name: Idempotency-Key, matches: "^mstdn-[0-9a-f]{32}$" }
            body:
              json:
                - { path: "$.status", equals: "新しい記事 🐈‍⬛ https://debimate.jp/post/a/" }
                - { path: "$.spoiler_text", equals: ネタバレ }
                - { path: "$.visibility", equals: unlisted }
                - { path: "$.in_reply_to_id", equals: "100" }
                - { path: "$.media_ids[0]", equals: m1 }
      # The text from stdin, the server from MSTDN_HOST, --json: as a CI job.
      - run:
          command: mstdn post - --json
          stdin: "ブログを更新しました 📝\nhttps://debimate.jp/post/b/\n"
          env:
            MSTDN_HOST: ${api.url}
            MSTDN_TOKEN: e2e-env-token-0001
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.id", equals: "900" }
              - { path: "$.url", equals: "${api.url}/@nchika/900" }
              - { path: "$.uri", equals: "${api.url}/users/nchika/statuses/900" }
      - assert:
          mock:
            name: api
            path: /api/v1/statuses
            count: 2
            body:
              json:
                - { path: "$.status", equals: "ブログを更新しました 📝\nhttps://debimate.jp/post/b/" }
                - { path: "$.visibility", equals: public }

  # The limit is the server's, counted as Mastodon counts: an address as
  # 23 characters whatever its length, the content warning with the text.
  - name: what the server does not take is exit 1 before anything is sent
    mock_servers:
      - name: api
        routes:
          - method: GET
            path: /api/v2/instance
            json: { configuration: { statuses: { max_characters: 30, characters_reserved_per_url: 23 } } }
          - { method: GET, path: /api/v1/accounts/verify_credentials, json: { id: "7", username: nchika, acct: nchika } }
          - { method: POST, path: /api/v1/statuses, json: { id: "1" } }
          - { method: POST, path: /api/v2/media, json: { id: m1 } }
    steps:
      - run:
          command: mstdn post "短い https://debimate.jp/a/very/long/address/that/counts/as/twenty-three" --dry-run --host ${api.url}
          env: *env
      - assert:
          exit_code: 0
          stdout:
            contains: "text (26 of 30 characters):\n"
      - run:
          command: mstdn post "短い https://debimate.jp/a" --cw "とても長い注意書きです" --host ${api.url}
          env: *env
      - assert:
          exit_code: 1
          stderr:
            equals: |
              error: the post is 37 characters with its content warning; 127.0.0.1:${api.port} takes up to 30
              hint: an address counts as 23 characters, and @name@host as @name
      - fixture: { file: photo.png, from: testdata/photo.png }
      - run:
          command: mstdn post x --image photo.png --image photo.png --image photo.png --image photo.png --image photo.png --host ${api.url}
          env: *env
      - assert:
          exit_code: 1
          stderr:
            contains: "error: a post can have at most 4 pictures"
      - run:
          command: mstdn post x --image photo.png --video photo.png --host ${api.url}
          env: *env
      - assert:
          exit_code: 1
          stderr:
            contains: "not both"
      - run:
          command: mstdn post "  " --host ${api.url}
          env: *env
      - assert:
          exit_code: 1
          stderr:
            contains: "error: the post is empty"
      - run:
          command: mstdn post x --host ${api.url}
      - assert:
          exit_code: 1
          stderr:
            contains: "error: not logged in on 127.0.0.1:${api.port}"
      - assert:
          mock: { name: api, path: /api/v1/statuses, count: 0 }
      - assert:
          mock: { name: api, path: /api/v2/media, count: 0 }

  # A write is sent once: a server that fails it is exit 4 with its words,
  # and nothing is sent again.
  - name: a status the server refuses is exit 4 and is not sent again
    mock_servers:
      - name: api
        routes:
          - { method: GET, path: /api/v2/instance, json: {} }
          - method: POST
            path: /api/v1/statuses
            status: 422
            json: { error: "Validation failed: Text character limit of 500 exceeded" }
    steps:
      - run:
          command: mstdn post x --host ${api.url}
          env: *env
      - assert:
          exit_code: 4
          stderr:
            equals: "error: v1/statuses failed: Validation failed: Text character limit of 500 exceeded\n"
      - assert:
          mock: { name: api, path: /api/v1/statuses, count: 1 }
