version: '1'
suite:
  name: mstdn speculative threads and unread notifications
scenarios:
- name: resting reads once and v adopts the thread while 4 clears unread
  mock_servers:
  - name: api
    routes:
    - method: GET
      path: /api/v2/instance
      json: {}
    - method: GET
      path: /api/v1/timelines/home
      json:
      - id: '10'
        account:
          acct: alice
        content: <p>Rest here</p>
    - method: GET
      path: /api/v1/notifications
      json:
      - id: '3'
        type: follow
        account:
          acct: bob
      - id: '2'
        type: follow
        account:
          acct: cat
      - id: '1'
        type: follow
        account:
          acct: dog
    - method: GET
      path: /api/v1/statuses/10
      json:
        id: '10'
        account:
          acct: alice
        content: <p>Rest here</p>
    - method: GET
      path: /api/v1/statuses/10/context
      json:
        ancestors: []
        descendants:
        - id: '11'
          in_reply_to_id: '10'
          account:
            acct: bob
          content: <p>Read ahead reply</p>
  steps:
  - fixture:
      file: cfg/accounts/127.0.0.1_${api.port}.json
      content: '{"service":"${api.url}","userId":"7","username":"me","token":"fake-read-ahead","scopes":["read","write"]}'
  - fixture:
      file: cfg/accounts.json
      content: '{"current":"127.0.0.1:${api.port}"}'
  - pty:
      command: mstdn
      rows: 36
      cols: 140
      env:
        MSTDN_CONFIG_DIR: ${workdir}/cfg
        MSTDN_CACHE_DIR: 'off'
        LC_ALL: C.UTF-8
        MSTDN_TOKEN: ''
      timeout: 25s
      session:
      - expect_screen:
          contains:
          - Rest here
          - 4 Notifications (3)
          stable_for: 1s
      - send: v
      - expect_screen:
          contains: Read ahead reply
      - send:
          key: esc
      - send: '4'
      - expect_screen:
          contains: 4 Notifications
          not_contains: Notifications (3)
      - send: q
  - assert:
      exit_code: 0
  - assert:
      mock:
        name: api
        method: GET
        path: /api/v1/statuses/10/context
        count: 1
  - assert:
      mock:
        name: api
        method: GET
        path: /api/v1/statuses/10
        count: 1
  - assert:
      mock:
        name: api
        method: POST
        count: 0
