# Fuzz targets for the code mstdn runs on what a server sends (cargo-fuzz,
# libFuzzer). mstdn is a binary-only crate and keeps no library target, so
# each target includes the self-contained source file it tests with `#[path]`
# instead of depending on the main package.
[package]
name = "mastodon-terminal-client-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Its own workspace, so that it never becomes part of the main package's.
[workspace]
members = ["."]

# Every [[bin]] is a target, and the nightly workflow reads the name from the
# line straight after [[bin]], so keep `name` first.
[[bin]]
name = "html_text"
path = "fuzz_targets/html_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "status_json"
path = "fuzz_targets/status_json.rs"
test = false
doc = false
bench = false
