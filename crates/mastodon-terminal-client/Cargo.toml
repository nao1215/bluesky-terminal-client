[package]
name = "mastodon-terminal-client"
version = "0.1.0"
edition.workspace = true
# Written out in each package: CI and the release scripts read it from the
# package's own [package] table.
rust-version = "1.90"
authors.workspace = true
description = "Unofficial Mastodon client for the terminal: a full-screen client for the timelines and notifications, and commands that read timelines, posts and accounts, save their files, and post with pictures."
license.workspace = true
readme = "README.md"
homepage = "https://github.com/nao1215/social-terminal-clients/tree/main/crates/mastodon-terminal-client"
repository = "https://github.com/nao1215/social-terminal-clients"
keywords = ["mastodon", "fediverse", "cli", "terminal"]
categories = ["command-line-utilities"]
# The unit tests read src/testdata, so it ships; the E2E suite and the fuzz targets do not.
exclude = ["bench/", "doc/", "e2e/", "fuzz/", "justfile"]

# cargo-binstall uses the same archives as release-mstdn.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/mstdn-v{ version }/mstdn-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "mstdn"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
getrandom = "0.4"
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
jiff.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
terminal-kit = { path = "../terminal-kit", version = "0.1.0" }
unicode-segmentation.workspace = true
ureq.workspace = true

[dev-dependencies]
terminal-kit = { path = "../terminal-kit", features = ["test-support"] }
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
