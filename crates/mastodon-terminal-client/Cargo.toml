[package]
name = "mastodon-terminal-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["CHIKAMATSU Naohiro <n.chika156@gmail.com>"]
description = "Unofficial Mastodon client for the terminal: commands that read timelines, posts and accounts, save their files, and post with pictures."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nao1215/sns-terminal-clients"
keywords = ["mastodon", "fediverse", "cli", "terminal"]
categories = ["command-line-utilities"]
# The unit tests read src/testdata, so it ships; the E2E suite does not.
exclude = ["e2e/"]

[[bin]]
name = "mstdn"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jiff = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-segmentation = "1"
ureq = "3"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
rstest = "0.28"
tempfile = "3"

# An error is returned, shown, or kept with the reason it can be ignored: a
# panic leaves a half-written download behind, and a swallowed error hides
# what the user needs to know. clippy.toml lets tests unwrap.
# let_underscore_untyped stays off: it flags every `let _ =`, and the ones
# that matter (a Result, a lock, a future) have lints of their own.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
