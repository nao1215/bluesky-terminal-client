[package]
name = "terminal-kit"
version = "0.1.0"
edition.workspace = true
# Written out in each package: CI and the release scripts read it from the
# package's own [package] table.
rust-version = "1.90"
authors.workspace = true
description = "Drawing helpers for ratatui terminal clients: text laid out in cells by grapheme cluster, a text field, picture scaling, OSC 52, color themes, and terminal checks."
license.workspace = true
repository.workspace = true
keywords = ["tui", "ratatui", "terminal", "unicode", "theme"]
categories = ["command-line-interface"]

[features]
test-support = []

[dependencies]
dirs.workspace = true
# Use level-triggered polling: crossterm 0.29's mio reader discards the
# remaining readiness notifications when it returns the first event.
crossterm = { workspace = true, features = ["use-dev-tty", "event-stream"] }
fast_image_resize.workspace = true
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
openh264.workspace = true
ureq.workspace = true
jiff.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
futures-core = "0.3"

# Reads the console input before crossterm does; see src/events.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
rstest.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
