# What each command, alias and flag in <client>.txt is for, and what would
# happen without it. scripts/rules/cli.py fails a pull request that adds one
# without both: a flag is added for a use someone has (an ego search,
# debimate's announcements), not because it might be handy. Taking one away
# always passes; remove its entry with it.
#
# The empty entries were there before this file was; fill one in when its
# use is known.

