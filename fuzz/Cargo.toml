# Fuzz targets for the parsers bsky runs on untrusted input (cargo-fuzz,
# libFuzzer). bsky is a binary-only crate and keeps no library target, so each
# target includes the self-contained source file it tests with `#[path]`
# instead of depending on the main package. See CONTRIBUTING.md.
[package]
name = "bluesky-terminal-client-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

# Its own workspace, so that it never becomes part of the main package's.
[workspace]
members = ["."]

# Every [[bin]] is a target, and the nightly workflow reads the name from the
# line straight after [[bin]], so keep `name` first.
[[bin]]
name = "hls_demux"
path = "fuzz_targets/hls_demux.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hls_playlist"
path = "fuzz_targets/hls_playlist.rs"
test = false
doc = false
bench = false

[[bin]]
name = "facets_detect"
path = "fuzz_targets/facets_detect.rs"
test = false
doc = false
bench = false
